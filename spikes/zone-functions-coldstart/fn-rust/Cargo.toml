[package]
name = "fn-rust"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["json", "server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[build-dependencies]
connectrpc-build = "0.9.0"

[profile.release]
strip = true
lto = "thin"
