[package]
name = "function"
version = "0.1.0"
edition = "2024"
# The toolchain is pinned in rust-toolchain.toml; the Dockerfile's builder
# image names the same release.
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "A knext zone function: a connect-rust server for the contract in proto/."

[lib]
path = "src/lib.rs"

[[bin]]
name = "function"
path = "src/main.rs"

# The kind e2e (e2e/kind-e2e.sh) calls a deployed function; it is never part
# of `cargo test`.
[[test]]
name = "e2e"
path = "e2e/e2e.rs"
required-features = ["e2e"]

[features]
e2e = []

[dependencies]
# connect-rust is pre-1.0: the 0.9 line is pinned here and in Cargo.lock, and
# the Connect conformance suite runs against the locked version in CI.
connectrpc = { version = "0.9.1", default-features = false, features = ["server", "client", "gzip", "json"] }
connectrpc-health = "0.9.0"
buffa = { version = "0.9.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

bytes = "1"
futures-util = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
pin-project-lite = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }

opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }

# connectrpc-health 0.9.0 depends on connectrpc with its default features, which
# compile zstd into the release binary although the template refuses zstd. A
# dependent cannot switch another crate's default features off, so the crate is
# vendored unchanged except for `default-features = false` on that one edge.
# TODO: drop this patch when upstream publishes the same change; upstream issue/PR links are
# tracked on getknext-dev/knext#2452 (see vendor/connectrpc-health/VENDORED.md).
[patch.crates-io]
connectrpc-health = { path = "vendor/connectrpc-health" }

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
zstd = "0.13"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
