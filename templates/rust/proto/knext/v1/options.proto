// knext zone-function contract options.
//
// `knext add function` copies this file into an app's proto directory, so a
// contract can name the function that serves it and the contract version it
// is at. Field numbers are part of the contract: they never change, and a
// removed option's number is reserved, never reused (`buf breaking` holds
// this in CI).
syntax = "proto3";

package knext.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FileOptions {
  // The zone function that serves this file's services. It names the binding
  // the operator injects into the owning zone: `orders` reads its endpoint
  // from ORDERS_SERVICE_URL. A lowercase DNS label (letters, digits, '-').
  string function = 50701;

  // The contract version of this file, as MAJOR.MINOR.PATCH. Raise it with
  // every change to the file. A function must serve a contract version
  // greater than or equal to the version its zone was generated against, so
  // roll out the function first, then the zone.
  string contract_version = 50702;
}

// Who may call an RPC through the zone's generated code.
enum Auth {
  // Not stated. `knext generate` refuses an RPC whose auth is not stated.
  AUTH_UNSPECIFIED = 0;
  // A signed-in user: the zone's authorize() hook must return a verified
  // user before the call is made. The value `knext add function` writes.
  AUTH_USER = 1;
  // Anyone, without a user. Allowed only on a read
  // (`idempotency_level = NO_SIDE_EFFECTS`); `knext generate` refuses it on
  // any other RPC.
  AUTH_PUBLIC = 2;
  // A public write was considered and is not offered: an anonymous write is
  // an AUTH_USER RPC whose authorize() hook returns an anonymous principal
  // after the app's own check (CAPTCHA, rate limit, CSRF).
  reserved 3;
  reserved "AUTH_PUBLIC_MUTATION";
}

extend google.protobuf.MethodOptions {
  // Who may call this RPC. Every RPC states it; there is no implicit default.
  Auth auth = 50703;
}
