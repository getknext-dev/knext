# A minimal Prometheus for the deep-health alert e2e (scripts/deep-health-alert-e2e.sh).
#
# It selects EVERYTHING (empty selectors) on purpose: the e2e's claim is that the
# PodMonitor and PrometheusRule knext SHIPS, applied unmodified, are enough. If
# this Prometheus carried selectors tuned to the fixture, a shipped manifest that
# no real Prometheus would pick up could still go green here.
#
# The short evaluation interval only makes the alert's `for: 2m` observable
# sooner; the rule itself is not touched.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# The namespace the operator's kustomize overlay puts the shipped PodMonitor in.
apiVersion: v1
kind: Namespace
metadata:
  name: system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-e2e
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-e2e
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: e2e
  namespace: monitoring
spec:
  replicas: 1
  serviceAccountName: prometheus
  evaluationInterval: 15s
  podMonitorSelector: {}
  podMonitorNamespaceSelector: {}
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector: {}
  ruleSelector: {}
  ruleNamespaceSelector: {}
  resources:
    requests:
      memory: 200Mi
