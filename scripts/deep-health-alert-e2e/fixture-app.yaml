# The apps for scripts/deep-health-alert-e2e.sh, one per state worth proving:
#
#   e2e-app            tracing ON, dead database      -> overall `down`
#   e2e-app-notracing  tracing OFF, dead database     -> overall `down`
#   e2e-app-waking     tracing OFF, dead database declared scale-to-zero -> `waking`
#   e2e-app-up         tracing OFF, a real Postgres   -> `ok` / postgres `up`
#
# "Tracing OFF" is the DEFAULT install: the OTEL_* variables are ABSENT, not set to
# "false". The operator sets them only from the CR, so absence is what a default
# install actually has.
#
# The arm is chosen by the environment alone: the fixture runs the reference app's
# real register(), which takes the tracing-on or the tracing-off path by itself.
#
# Labelled exactly as the operator labels every app pod it generates
# (`generated-by: kn-next-operator`, `app: <name>`), because that label is the
# selector of the shipped PodMonitor. The metrics port is declared as an UNNAMED
# containerPort: the PodMonitor targets it by number (9464), the way a serving-layer
# user-container's port appears in the pod spec.
#
# The container runs the repo checkout, mounted from the kind node, under the
# same Bun the reference app builds with — no image build in the loop, so what
# runs is the working tree under test.
apiVersion: v1
kind: Namespace
metadata:
  name: deep-health-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-app
  namespace: deep-health-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-app
  template:
    metadata:
      labels:
        app: e2e-app
        generated-by: kn-next-operator
    spec:
      containers:
        - name: user-container
          image: oven/bun:1.4.2-alpine@sha256:d888c0ae6c86d7866ff10c5aafdd9077b36aee6455b33dd270fb93c0dd5cef6f
          workingDir: /workspace/apps/file-manager
          command: ["bun", "e2e-support/deep-health-alert-fixture.ts"]
          env:
            - name: HOME
              value: /tmp
            - name: NODE_ENV
              value: production
            - name: KN_APP_NAME
              value: e2e-app
            - name: PORT
              value: "3000"
            # The shipped PodMonitor scrapes this port by number.
            - name: METRICS_PORT
              value: "9464"
            # The loopback port the app's registry serves on, which the runtime
            # contract bridges from. The pod spec owns it, so nothing in the lane
            # hardcodes it.
            - name: KN_CHILD_METRICS_PORT
              value: "9092"
            - name: OTEL_TRACING_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://127.0.0.1:4317
            # A bring-your-own Postgres on a port nothing listens on: the connection
            # is REFUSED, which the deep check reports as `down` (not `waking`,
            # which is reserved for a database declared scale-to-zero).
            - name: DATABASE_URL
              value: postgres://app:app@127.0.0.1:1/app
          ports:
            - containerPort: 3000
            - containerPort: 9464
          volumeMounts:
            - name: workspace
              mountPath: /workspace
              readOnly: true
      volumes:
        - name: workspace
          hostPath:
            path: /workspace
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-app-notracing
  namespace: deep-health-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
