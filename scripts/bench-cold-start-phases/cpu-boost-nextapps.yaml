# CLUSTER-SPECIFIC EXAMPLE: this manifest records the cluster one study ran on (namespace,
# node name or IP, kubectl context). Before applying it, set metadata.namespace to your
# --namespace and spec.nodeName to your own node names; see README.md.
# NextApps for the startup-CPU-boost measurement (2026-11-02). Applied with
#   kubectl --context knext-oke-sa apply --validate=strict -f cpu-boost-nextapps.yaml
# The operator reconciles each NextApp into a Knative Service; nothing here writes
# Knative objects. All three arms run the SAME image digest (the default scaffold
# bench image, bun runtime, turbopack build, already pulled on both workers), and
# differ only in spec.resources:
#   cpu-base        no resources block      -> request 250m, limit 1 (operator defaults)
#   cpu-boost2      cpuLimit 2              -> request 250m (unchanged), limit 2
#   cpu-boost2req   cpuRequest 1, cpuLimit 2 -> request 1 (scheduler reserves a full core)
# Bench-only deltas, identical across arms: maxScale 1, minScale 0 (scale-from-zero).
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: cpu-base
  namespace: bench-cells
spec:
  image: ghcr.io/getknext-dev/bench-bunexec@sha256:b3aeecac42e624aacb43823cd096c1d195369e18d918d5267236c47cf82ffa9d
  runtime: bun
  build: turbopack
  imagePullSecrets: [{name: ghcr-bench}]
  scaling: {minScale: 0, maxScale: 1}
---
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: cpu-boost2
  namespace: bench-cells
spec:
  image: ghcr.io/getknext-dev/bench-bunexec@sha256:b3aeecac42e624aacb43823cd096c1d195369e18d918d5267236c47cf82ffa9d
  runtime: bun
  build: turbopack
  imagePullSecrets: [{name: ghcr-bench}]
  scaling: {minScale: 0, maxScale: 1}
  resources: {cpuLimit: "2"}
---
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: cpu-boost2req
  namespace: bench-cells
spec:
  image: ghcr.io/getknext-dev/bench-bunexec@sha256:b3aeecac42e624aacb43823cd096c1d195369e18d918d5267236c47cf82ffa9d
  runtime: bun
  build: turbopack
  imagePullSecrets: [{name: ghcr-bench}]
  scaling: {minScale: 0, maxScale: 1}
  resources: {cpuRequest: "1", cpuLimit: "2"}
