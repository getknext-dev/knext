[package]
name = "knext-ffi-macros"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/getknext-dev/knext"
description = "Proc macros for knext-ffi: #[knext_ffi::export] and #[knext_ffi::record] (ABI v1, Beta)."
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
