# cargo-deny policy for the knext-ffi crates (run by .github/workflows/rust-crates.yml).
# Mirrors the npm side's posture: any advisory fails the build unless it is in
# `ignore` below with a date and a justification (none today).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
