[package]
name = "knext-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/getknext-dev/knext"
description = "Runtime for knext in-process Rust over bun:ffi (ABI v1, Beta)."
publish = false

[dependencies]
knext-ffi-macros = { path = "../knext-ffi-macros", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
trybuild = "1"
