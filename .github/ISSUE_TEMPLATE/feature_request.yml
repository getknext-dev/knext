name: Feature request
description: Propose a new capability or an improvement to an existing one.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        knext is a scale-to-zero Next.js adapter for Knative/Kubernetes, not a general-purpose
        PaaS — requests that expand scope in that direction are likely to be declined or
        redirected, but are still welcome to discuss.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in today and why it's a problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like knext to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've solved or worked around this, if any.
