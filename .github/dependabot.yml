# Dependabot — keeps the SHA-pinned GitHub Actions on the publish path current (#522).
#
# The publish-path workflows (release.yml, release-ghp.yml) pin every `uses:` to a
# full commit SHA because those jobs run with live publish credentials in scope.
# Pinning without a bump channel just trades a supply-chain risk for staleness, so
# Dependabot owns the bumps: it rewrites the SHA and the trailing `# vX.Y.Z`
# comment together.
#
# Division of responsibility — read this before assuming a check exists:
#   - Dependabot owns the SHA and its version comment.
#   - tests/release-action-pins.test.ts asserts IMMUTABILITY and SCOPE — every
#     publish-path `uses:` is a 40-hex commit SHA carrying a `# vX.Y.Z` comment,
#     and only allowlisted ACTIONS appear on the credential-bearing path. It does
#     NOT assert the SHA value.
#   - Therefore a SHA that does not actually belong to its commented tag is caught
#     by HUMAN REVIEW of the Dependabot diff, not by CI. Read the SHA against the
#     tag before approving a bump on release.yml / release-ghp.yml.
#
# An earlier revision of that test asserted the exact SHA of record, described here
# as "a deliberate human review point". That was reversed deliberately, not
# accidentally: it made every correct Dependabot bump go red (see #530/#532, which
# preserved the pin form exactly as required), and the only way to green a correct
# bump was to edit the guard's expectations — training the reader to edit a
# supply-chain guard without reading it. The review point is retained above, moved
# from the test to the reviewer, where it cannot be silenced by an edit.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - 'reliability'
