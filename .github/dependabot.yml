# Dependabot — keeps the SHA-pinned GitHub Actions current (#522, scope widened #528).
#
# EVERY workflow now pins every `uses:` to a full commit SHA, not just the publish
# path: release.yml holds a live publish credential, and
# supply-chain.yml / operator-supply-chain.yml run cosign KEYLESS signing under an
# `id-token: write` OIDC identity able to sign artifacts as this repo. `directory: '/'`
# below already covers `.github/workflows` as a whole, so no per-file entry is needed
# — asserted, not assumed, by tests/workflow-action-pins.test.ts.
# Pinning without a bump channel just trades a supply-chain risk for staleness, so
# Dependabot owns the bumps: it rewrites the SHA and the trailing `# vX.Y.Z`
# comment together.
#
# Division of responsibility — read this before assuming a check exists:
#   - Dependabot owns the SHA and its version comment.
#   - tests/release-action-pins.test.ts asserts IMMUTABILITY and SCOPE on the
#     publish path, plus the ACTION allowlist for the credential-bearing jobs.
#   - tests/workflow-action-pins.test.ts asserts the same FORM (40-hex SHA +
#     `# vX.Y.Z` comment) across EVERY workflow, discovered by directory scan so a
#     newly added workflow is covered without editing a list.
#   - Neither asserts the SHA VALUE. That is resolved UPSTREAM at run time by
#     scripts/verify-action-pins.mjs, run nightly by
#     .github/workflows/action-pin-resolution-nightly.yml over every workflow.
#
# An earlier revision of that test asserted the exact SHA of record, described here
# as "a deliberate human review point". That was reversed deliberately, not
# accidentally: it made every correct Dependabot bump go red (see #530/#532, which
# preserved the pin form exactly as required), and the only way to green a correct
# bump was to edit the guard's expectations — training the reader to edit a
# supply-chain guard without reading it.
#
# Be precise about what that trade cost: the review point is retained as
# DOCUMENTED PRACTICE, not as ENFORCEMENT. A gate blocks and can be mutation-
# proved; a documented expectation degrades — under time pressure, under a bot
# bump that looks like the last four, under a reviewer who never opened this
# file — and its efficacy is unobservable until it has already failed. That gap
# is now CLOSED by the nightly correspondence check (#539), extended in #528 to
# resolve every workflow's pins, not just the publish path. What the nightly
# still does NOT check: it trusts the version comment as a statement of intent,
# so a correctly-pinned MALICIOUS tag remains a human-review concern.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    # `/` covers `.github/workflows/*` AND the root `action.yml`, but Dependabot
    # scans a DIRECTORY, not a tree — it does not reach a composite action at
    # `.github/actions/<name>/action.yml`. Our pin guard covers those files by
    # directory walk, so without the glob below one could be pinned-by-default
    # yet never bumped: pinned and frozen, which is the staleness failure with
    # extra steps.
    #
    # Be precise about what is VERIFIED versus still UNPROVEN here, because the
    # guard in tests/workflow-action-pins.test.ts is a TEXT match — it can tell
    # you this entry exists, and cannot tell an honoured entry from an errored
    # one:
    #   - VERIFIED: the schema. `directories` takes a string array and supports
    #     `*` (GitHub's reference is explicit that `directory` does not).
    #   - VERIFIED IN PRACTICE (#630, evidence: PR #631 "bump the github-actions
    #     group across 1 directory with 3 updates"): a glob matching NOTHING —
    #     the case today, since `.github/actions/` does not exist — does NOT
    #     error the `github-actions` entry. Dependabot ran this config and opened
    #     a grouped bump PR from it. That was the open risk: an errored entry
    #     kills the bump channel SILENTLY, which is worse than the staleness the
    #     glob closes. It is answered; do not re-file it as a thing to go check.
    #   - STILL UNPROVEN, and #631 does not touch it: that `/.github/actions/*`
    #     MATCHES anything once a composite action lands there. Nothing has ever
    #     matched it — the "1 directory" in that PR title is `/`. The first
    #     composite action added is when to look again.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    # ~20 distinct actions are pinned across every workflow (#528). Ungrouped,
    # a week's bumps can exceed open-pull-requests-limit and the surplus waits
    # silently — reintroducing the staleness half of the pinning trade by SCALE
    # rather than by decision. One grouped PR per week keeps the channel open
    # and keeps the review a single readable diff.
    #
    # A catch-all pattern, not a list of action names: a newly pinned action
    # must join the group without a config edit, or the first forgotten entry
    # is the one that goes stale.
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - 'reliability'

  # #1583 — packages/kn-next-operator is the only Go module in the repo, and
  # had NO Dependabot coverage at all: google.golang.org/grpc sat two
  # versions behind CVE-2026-84304's fix (and one behind CVE-2026-84445)
  # until main's supply-chain Trivy gate caught it (run 36358447159, fixed by
  # #1582) instead of a routine bump PR. This entry closes that detection
  # gap so the NEXT transitive Go CVE is caught here, not there.
  #
  # `scripts/dependabot-published-bytes-pause.mjs` (#1663) cannot mis-close a
  # PR this entry opens: it only closes a Dependabot PR that reaches
  # `publishScopeDirs()` — derived from `publishablePackages()` over the npm
  # WORKSPACE manifests (`packages/kn-next`, `packages/lib`, `packages/db`).
  # `packages/kn-next-operator` has no `package.json` and is not an npm
  # workspace member (root `package.json`'s `workspaces` globs `apps/*` and
  # `packages/*`, but membership there still requires a `package.json` to be
  # picked up), so a `gomod` bump under it is outside that scope by
  # construction — confirmed by reading `publishScopeDirs`, not assumed.
  - package-ecosystem: 'gomod'
    directory: '/packages/kn-next-operator'
    schedule:
      interval: 'weekly'
    # Grouped for the same reason as the github-actions entry above: a
    # handful of Go modules bump most weeks, and an ungrouped config risks
    # the same open-pull-requests-limit staleness this file already warns
    # about for GH Actions.
    groups:
      kn-next-operator-gomod:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(operator)'
    labels:
      - 'operator'
      - 'reliability'
