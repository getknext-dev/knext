# scale-zero-pg CI — turbo-affected entrypoint.
#
# The pg project (packages/scale-zero-pg) is a Go + Kubernetes project. It participates
# in the turbo graph via its own package.json scripts + package-level turbo.json (build /
# lint / test / build:image), so THE PROJECT OWNS ITS OWN SCRIPTS and turbo just orchestrates
# them. This job's entrypoint is `turbo run … --affected`: turbo computes the affected graph
# against the PR base (needs full git history, hence fetch-depth: 0) and runs the pg tasks
# ONLY when packages/scale-zero-pg actually changed. `--filter=scale-zero-pg` scopes this job
# to the pg project (it never runs the JS packages' tasks — those keep their own ci.yml jobs);
# on a JS-only PR turbo selects 0 tasks here and the job is a fast no-op.
name: scale-zero-pg CI

on:
  pull_request:
  push:
    branches: [main]

# Turbo needs Go, Python (deploy-script tests) and Node/pnpm (to run turbo itself).
jobs:
  turbo-affected:
    name: turbo run (affected) — scale-zero-pg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history for turbo --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/scale-zero-pg/gateway/go.mod
          cache: true
          cache-dependency-path: packages/scale-zero-pg/gateway/go.sum

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # turbo --affected computes the changed set vs the PR base (or the previous commit
      # on a push to main) and runs only the pg tasks when packages/scale-zero-pg changed.
      # build:image validates the gateway Dockerfile still builds.
      - name: turbo run build lint test build:image (affected, scoped to scale-zero-pg)
        run: bun run turbo run build lint test build:image --affected --filter=scale-zero-pg

  # #797 — run deploy/_validate.sh (the manifest-contract validator) on every PR so the
  # whole guard set it holds — metric/alert lockstep pins, the prometheus config-hash, the
  # ledger-key scan, the yq-scoped label lockstep — is ENFORCED, not decoration (by this
  # repo's own standard, a guard that never runs saved nothing). It runs in STATIC mode
  # (VALIDATE_STATIC=1): the server-side dry-run needs a live cluster, which CI has none, so
  # that section is skipped while every static contract runs. This job is UNCONDITIONAL (not
  # turbo --affected): a guard that only fires "when the package changed" can be sidestepped
  # by a change the affected-graph misclassifies, and the static run is a few seconds anyway.
  validate-manifests:
    name: deploy manifest contracts (static — no cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # _validate.sh REQUIRES mikefarah yq v4 and fails CLOSED without it. The kislyuk
      # python-yq ships a binary of the SAME NAME with a jq-filter CLI that errors on the
      # mikefarah expressions — so install mikefarah explicitly and ASSERT the build, or the
      # yq-scoped lockstep checks would silently degrade to the fail-closed path.
      - name: Install mikefarah yq v4
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version | grep -q 'mikefarah' || { echo "installed yq is not the mikefarah build (need v4)"; exit 1; }

      - name: Static manifest-contract validation (VALIDATE_STATIC=1, no cluster)
        working-directory: packages/scale-zero-pg
        run: VALIDATE_STATIC=1 bash deploy/_validate.sh
