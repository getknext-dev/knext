name: actionlint (changed workflows)

# ── #1300 review round 3, finding 1 ─────────────────────────────────────────
# A job-level `if:` using the `env` context (`env.KNEXT_COMPAT_MODE`) is
# INVALID — GitHub rejects the WHOLE workflow at parse time, which would have
# killed every scheduled compat nightly, not just the one job. Nothing in this
# repo caught that before a live `actionlint` run did. This workflow is the
# gate: it runs the REAL `actionlint` binary against every workflow file this
# PR/push actually CHANGED (not the whole repo — three pre-existing files
# outside this PR's scope carry unrelated shellcheck notes that would
# otherwise turn every future PR red on day one; see #1347 for the pinning
# tech-debt this deliberately does not expand into).
#
# The binary is pinned by SHA256 checksum, the same immutability standard
# `.claude/rules/security.md` sets for third-party Actions — a version tag
# alone is not enough, the checksum is what makes the download verifiable.
#
# SCOPE CAVEAT (#1397): composite action internals are never linted by this
# gate. actionlint 1.7.12 refuses an action.yml passed as a direct CLI
# argument, so a changed composite action instead re-lints every WORKFLOW
# that `uses:` it — that lints the REFERENCE, not the composite action's own
# `runs.steps` body. There is no coverage of a composite action's internal
# step syntax here.
#
# tests/actionlint-workflow.test.ts (below) exercises the real "Compute the
# workflow files" script against the real pinned binary — it RUNS as part of
# this job, right after the binary is installed, and the job fails if any of
# its tests came back skipped (which would mean actionlint silently was not
# on PATH for it, making the coverage inert without turning the job red).

on:
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/**'
      # #1352 — actionlint also lints composite action definitions directly.
      # This repo has none today, but the glob is widened NOW (per the
      # issue's own "once (or before) a composite action lands") so the gate
      # does not need a second PR the day one is added.
      - '.github/actions/**'
      # #1397 review — this gate's own regression suite. General CI skips its
      # real-binary half (no actionlint on PATH there), so a PR touching only
      # the test file (or a local helper it imports) must trigger THIS
      # workflow or that half never runs. Guarded by the test itself.
      - 'tests/actionlint-workflow.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'tests/actionlint-workflow.test.ts'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint every workflow file changed in this diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code (full history for the diff below)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install actionlint (pinned by version + sha256 checksum)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz "${url}"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          ./actionlint -version
          # On PATH (not just ./actionlint) so tests/actionlint-workflow.test.ts's
          # own `actionlintAvailable()` probe (`spawnSync('actionlint', ...)`)
          # finds the exact pinned binary this job just verified.
          echo "$PWD" >>"$GITHUB_PATH"

      - name: Set up bun (lockstep pin, #1310)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install workspace deps (needed to run tests/actionlint-workflow.test.ts)
        run: bun install --frozen-lockfile

      - name: Run tests/actionlint-workflow.test.ts for real (fails on any skipped test)
        run: |
          set -euo pipefail
          bun test tests/actionlint-workflow.test.ts --reporter=junit --reporter-outfile=actionlint-test-results.xml
          if [ ! -f actionlint-test-results.xml ]; then
            echo "::error::actionlint-test-results.xml was not produced by the test run — cannot verify the skip count, failing closed rather than assuming 0 skips."
            exit 1
          fi
          skipped="$(grep -m1 '<testsuites ' actionlint-test-results.xml | grep -oE 'skipped="[0-9]+"' | grep -oE '[0-9]+' || true)"
          if [ -z "${skipped}" ]; then
            echo "::error::no skipped=\"N\" attribute found on the <testsuites> line of actionlint-test-results.xml — failing closed rather than assuming 0 skips (a missing attribute is not the same as a verified zero)."
            exit 1
          fi
          tests="$(grep -m1 '<testsuites ' actionlint-test-results.xml | grep -oE 'tests="[0-9]+"' | grep -oE '[0-9]+' || true)"
          if [ -z "${tests}" ] || [ "${tests}" -eq 0 ]; then
            echo "::error::actionlint-test-results.xml reports zero tests — the suite did not actually run, failing closed rather than treating an empty run as a pass."
            exit 1
          fi
          if [ "${skipped}" -ne 0 ]; then
            echo "::error::${skipped} test(s) in tests/actionlint-workflow.test.ts were SKIPPED — that means actionlint was NOT on PATH for this run (the describe.skipIf guard), so this gate's own regression coverage did not execute. Composite action internals are never linted by this gate (see the header note above)."
            exit 1
          fi

      - name: Compute the workflow files this diff actually changed
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          head="${HEAD_SHA}"
          workflow_globs=('.github/workflows/*.yml' '.github/workflows/*.yaml')
          action_globs=('.github/actions/**/action.yml' '.github/actions/**/action.yaml')
          # A push with no prior commit (`before` all-zeros, first push to a
          # new branch) has nothing to diff against — fall back to lint every
          # workflow file rather than silently linting nothing.
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            changed_workflows="$(git -C . ls-files "${workflow_globs[@]}")"
            changed_actions="$(git -C . ls-files "${action_globs[@]}")"
          else
            # #1300 review round 4 (finding 3) — no `|| true`: a real `git
            # diff` error (e.g. `base` unresolvable) must fail this step, not
            # silently fall through to an empty/partial file list that then
            # reads as "nothing changed, nothing to lint". #1352 review —
            # `--diff-filter=d` excludes DELETED paths: without it, a PR that
            # only deletes a workflow/composite-action file fails this step
            # with a false "file not found" instead of correctly linting
            # nothing.
            changed_workflows="$(git diff --name-only --diff-filter=d "${base}" "${head}" -- "${workflow_globs[@]}")"
            changed_actions="$(git diff --name-only --diff-filter=d "${base}" "${head}" -- "${action_globs[@]}")"
          fi
          # #1397 review — actionlint 1.7.12 REJECTS a composite `action.yml`
          # passed as a CLI argument outright ("jobs section is missing",
          # "unexpected key runs": explicit file args are always treated as
          # WORKFLOW files, never as composite-action manifests — verified
          # live against the exact pinned binary, not assumed from docs).
          # `action.yml`/`action.yaml` paths are therefore NEVER added to the
          # lint list. Instead, when a composite action changed, every
          # WORKFLOW that consumes ANY local composite action (`uses: ./...`)
          # is re-linted — that IS how actionlint validates a local composite
          # action's `uses:` reference (as part of the referencing workflow),
          # and it is the only way this gate can react to a composite-action
          # change at all without ever handing actionlint a file type it
          # rejects.
          # #1397 round 2 — the regex only matched an UNQUOTED
          # `uses: ./.github/actions/...`; `uses: './.github/actions/...'`
          # and `uses: "./.github/actions/..."` (both valid YAML) silently
          # escaped detection. `[\"']?` makes the optional quote explicit.
          referencing_workflows=""
          if [ -n "${changed_actions}" ]; then
            set +e
            referencing_workflows="$(grep -lE "uses:[[:space:]]*[\"']?\./\.github/actions/" .github/workflows/*.y*ml 2>/tmp/actionlint-grep-stderr)"
            grep_status=$?
            set -e
            # grep exit codes: 0 = matches found, 1 = no matches (fine — no
            # workflow references the changed action), 2 = a REAL failure
            # (e.g. the `.github/workflows/*.y*ml` glob not expanding because
            # no workflow file exists, so grep gets handed the literal glob
            # string as a nonexistent filename). The old `|| true` treated
            # all three identically, so a broken scan silently read as
            # "nothing references it" instead of failing loudly.
            if [ "${grep_status}" -eq 2 ]; then
              echo "::error::grep failed while scanning workflows for composite-action references: $(cat /tmp/actionlint-grep-stderr)"
              exit 1
            fi
          fi
          files="$(printf '%s\n%s\n' "${changed_workflows}" "${referencing_workflows}" | sed '/^$/d' | sort -u)"
          if [ -z "${files}" ]; then
            echo "no workflow files (directly changed, or referencing a changed composite action) — nothing to lint"
            echo "files=" >>"$GITHUB_OUTPUT"
          else
            echo "changed/composite-action-referencing workflow files:"
            echo "${files}"
            {
              echo "files<<ACTIONLINT_FILES_EOF"
              echo "${files}"
              echo "ACTIONLINT_FILES_EOF"
            } >>"$GITHUB_OUTPUT"
          fi

      - name: Run actionlint on the changed workflow files (fails on any finding)
        if: steps.diff.outputs.files != ''
        # #1300 review round 4 (finding 1) — the file LIST is PR-controlled
        # (it's the paths in the diff, which a malicious PR could shape,
        # e.g. a filename containing shell metacharacters or a `$(...)`
        # sequence). `${{ steps.diff.outputs.files }}` inside `run:` is
        # GitHub's TEXTUAL substitution, done before the shell ever sees the
        # script — that makes it a script-injection point, not just a data
        # value. Passing it via `env:` instead means the shell only ever sees
        # it as the CONTENTS of `$FILES`, never as script text, and
        # `xargs -d '\n'` (not the default IFS-whitespace splitting) is what
        # makes filenames-with-spaces safe too.
        env:
          FILES: ${{ steps.diff.outputs.files }}
        run: |
          set -euo pipefail
          printf '%s\n' "${FILES}" | xargs -d '\n' ./actionlint
