# Publishes the opt-in knext-patched Bun toolchain (`compile: { bun: 'knext-patched' }`):
# bun-v1.4.2 + oven-sh/bun#44059 (`--compile --include`), built from deploy/bun-patched/ on Cloud
# Build. RETIREMENT: delete this workflow with deploy/bun-patched/ once a stock Bun release ships
# oven-sh/bun#44059 (the `bun-patched-toolchain` retirement probe goes red on it).
#
# Flow (a maintainer runs the Cloud Build and stages the release; this workflow is the gate):
#   1. Cloud Build (deploy/bun-patched/cloudbuild.yaml) produces bun-linux-<arch> + SBOMs + manifests.
#   2. A maintainer creates a DRAFT release for tag `bun-patched-<ver>-knext.<n>` carrying those files
#      and commits their sha256 to deploy/bun-patched/RELEASE.sha256 and to the pins in
#      packages/kn-next/src/cli/bun-toolchain.ts (a unit test keeps the two in lockstep).
#   3. Pushing the tag (at a commit carrying those pins) runs this workflow. EVERY gate runs BEFORE
#      anything is signed or published, against the draft's bytes — a red gate means no release:
#      - verify:      the git tag equals the tag knext pins; EVERY binary matches RELEASE.sha256 at the
#                     tagged commit and every shipped binary is pinned (fail closed);
#      - smoke-x64:   lazy `--include` from the executable on ubuntu-24.04 (stock 1.4.2 control);
#      - smoke-arm64: the same smoke on ubuntu-24.04-arm — arm64 is published only if this is green
#                     (a red arm64 smoke fails the whole release: knext pins the arm64 sha256, so an
#                     x64-only release would 404 every arm64 build);
#      - e2e:         bun-patched-e2e.yml with the VERIFIED DRAFT BINARY seeded into knext's cache, so
#                     knext's own embedded-sha256 check is what admits it (the draft is not publicly
#                     downloadable; a rejected seed fails the build instead of fetching anything);
#      - publish:     only after all four: cosign keyless-signs SHA256SUMS, records GitHub build-
#                     provenance attestations for the binaries, attaches both, publishes (prerelease),
#                     then re-downloads each binary through the PUBLIC URL knext uses and re-checks it.
#
# Third-party actions are SHA-pinned: the publish job holds `id-token: write`, `attestations: write`
# and `contents: write`.
name: bun-patched-release

on:
  push:
    tags: ['bun-patched-*']

permissions: {}

concurrency:
  group: bun-patched-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Stock Bun 1.4.2 — the smoke's negative control (it has no `--compile --include`).
  STOCK_BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # list + download a DRAFT release's assets (drafts need push access)
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The git tag is the tag knext pins
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^    tag: "\(bun-patched-[^"]*\)",$/\1/p' packages/kn-next/src/cli/bun-toolchain.ts)"
          test "$(printf '%s\n' "$pinned" | grep -c .)" = 1 || { echo "::error::expected exactly one pinned tag, got: $pinned"; exit 1; }
          [ "$pinned" = "$TAG" ] || { echo "::error::pushed $TAG but bun-toolchain.ts pins $pinned"; exit 1; }

      - name: Download the draft release assets
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D out
          ls -la out

      - name: Verify every binary against the sums committed at this tag (fail closed)
        working-directory: out
        run: |
          set -euo pipefail
          pins="$GITHUB_WORKSPACE/deploy/bun-patched/RELEASE.sha256"
          test -s "$pins"
          # Every pinned file must be present and match; every shipped binary must be pinned.
          sha256sum -c --strict "$pins"
          for f in bun-linux-*; do
            case "$f" in *.json|*.sha256|*.revision) continue ;; esac
            grep -qE "^[0-9a-f]{64}  $f\$" "$pins" || { echo "::error::$f is not pinned in RELEASE.sha256"; exit 1; }
          done
          # Both architectures are pinned: arm64 ships only through the arm64 smoke gate below.
          grep -qE '  bun-linux-x64$' "$pins"
          grep -qE '  bun-linux-aarch64$' "$pins"

      - name: Hand the verified binaries to the gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bun-patched-binaries
          path: |
            out/bun-linux-x64
            out/bun-linux-aarch64
          if-no-files-found: error
          retention-days: 3

  smoke-x64:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bun-patched-binaries
          path: out
      - name: Smoke-test the x64 toolchain (lazy --include from the executable)
        run: |
          set -euo pipefail
          (cd out && grep -E '  bun-linux-x64$' "$GITHUB_WORKSPACE/deploy/bun-patched/RELEASE.sha256" | sha256sum -c --strict -)
          chmod +x out/bun-linux-x64
          curl -fsSLo /tmp/bun-stock.zip "$STOCK_BUN_URL/bun-linux-x64.zip"
          echo "36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913  /tmp/bun-stock.zip" | sha256sum -c -
          unzip -q /tmp/bun-stock.zip -d /tmp/bun-stock
          BUN="$PWD/out/bun-linux-x64" STOCK_BUN=/tmp/bun-stock/bun-linux-x64/bun bash deploy/bun-patched/smoke.sh

  smoke-arm64:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bun-patched-binaries
          path: out
      - name: Smoke-test the arm64 toolchain on a real arm64 runner (lazy --include)
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          (cd out && grep -E '  bun-linux-aarch64$' "$GITHUB_WORKSPACE/deploy/bun-patched/RELEASE.sha256" | sha256sum -c --strict -)
          chmod +x out/bun-linux-aarch64
          curl -fsSLo /tmp/bun-stock.zip "$STOCK_BUN_URL/bun-linux-aarch64.zip"
          echo "54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7  /tmp/bun-stock.zip" | sha256sum -c -
          unzip -q /tmp/bun-stock.zip -d /tmp/bun-stock
          BUN="$PWD/out/bun-linux-aarch64" STOCK_BUN=/tmp/bun-stock/bun-linux-aarch64/bun bash deploy/bun-patched/smoke.sh

  e2e:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/bun-patched-e2e.yml
    with:
      toolchain-artifact: bun-patched-binaries

  publish:
    # The ONLY job that signs, attests or publishes — and it needs every gate green.
    needs: [verify, smoke-x64, smoke-arm64, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # attach the signature, publish the release
      id-token: write # cosign keyless + the attestation's Sigstore certificate
      attestations: write # GitHub artifact attestations (build provenance)
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Re-download the draft and re-verify (the gated bytes are the published bytes)
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D out --pattern '*'
          cd out
          sha256sum -c --strict "$GITHUB_WORKSPACE/deploy/bun-patched/RELEASE.sha256"
          # SHA256SUMS = the pinned binaries + the SBOMs/manifests shipped beside them.
          sha256sum bun-linux-* manifest-*.json bun-source-*.cdx.json 2>/dev/null | grep -v '\.sha256$' > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SHA256SUMS keyless (GitHub OIDC) and verify the signature
        working-directory: out
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$WORKFLOW_REF" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record build-provenance attestations for the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/bun-linux-x64
            out/bun-linux-aarch64

      - name: Verify the attestations (the documented `gh attestation verify` command)
        working-directory: out
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          for f in bun-linux-x64 bun-linux-aarch64; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$WORKFLOW_REF" \
              --source-ref "refs/tags/$TAG" \
              --deny-self-hosted-runners
          done

      - name: Attach SHA256SUMS + signature and publish the release
        run: |
          set -euo pipefail
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber out/SHA256SUMS out/SHA256SUMS.sigstore.json
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
          echo "published $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: The public URL knext downloads serves exactly the pinned bytes
        run: |
          set -euo pipefail
          mkdir -p pub && cd pub
          for f in bun-linux-x64 bun-linux-aarch64; do
            curl -fsSLo "$f" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$f"
          done
          sha256sum -c --strict "$GITHUB_WORKSPACE/deploy/bun-patched/RELEASE.sha256"
