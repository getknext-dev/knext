name: File-manager platform e2e (reusable)

# Shared implementation of the file-manager platform e2e (#1282). Deploys
# apps/file-manager THROUGH the platform on an ephemeral kind cluster and
# tests it: `kn-next deploy` -> NextApp CR -> the operator built from
# `inputs.ref` -> Knative. Three areas, every check fail-closed (no skip path):
#   A. app functionality  - upload (server action), list, bytes-identical read-back
#                           from object storage, users/audit/dashboard, 404
#   B. platform features  - scale-to-zero + wake, ISR + authenticated invalidation,
#                           image optimization, health, metrics, NetworkPolicy,
#                           graceful rollout under load
#   C. deployment basics  - asset content-types + cache headers, RSC streaming,
#                           next/font/google (Geist) served at a real served URL
#                           (#1284, fixed - no exemption; a font 404 or a leaked
#                           build-machine path is an ordinary failure)
#   D. storage-mode leg   - a SECOND NextApp (file-manager-storage) deployed
#                           object-storage mode against the same in-cluster
#                           MinIO: served HTML references <bucket-url>/<name>/
#                           asset URLs, those URLs 200 from MinIO with the
#                           right content-type, and the served build id equals
#                           the deploy tag (#1292, closes the #1283 gap
#                           `platform-e2e.mjs`'s own comment used to call out)
#
# NOT covered, by design (each is its own follow-up, never a skip):
#   - browser-driven UI (the upload form is a client component; no Playwright dep)
#   - the `mc`-based `minio` storage provider specifically (area D uses the
#     `s3` provider against the same MinIO - see knext.config.storage-e2e.ts)
#   - rename / delete / download flows: the app has none (upload + list only)
#
# The operator image digest recorded here is the digest of the image
# ACTUALLY DEPLOYED: `docker-build` never pushes, so an unpushed local image
# has no `RepoDigests` entry to read. This job pushes the built image to the
# SAME in-cluster registry the app images already use (`localhost:5001`,
# wired into the kind node's containerd certs.d earlier in this job), takes
# the digest from that push, then cross-checks it against the DEPLOYED
# operator pod's own `status.containerStatuses[].imageID` after rollout - so
# the recorded digest can never silently diverge from what the cluster is
# actually running.
#
# BUDGET: one ubuntu-latest job, timeout 45 min, measured ~8-10 min wall (dispatch
# run 35911200144: 8m, 27/27 checks). Cluster-setup steps run under
# `set -euo pipefail` with `kubectl wait --timeout`, so a broken cluster fails fast.
#
# Ephemeral kind on the runner only - never OKE/GKE.
#
# Called by:
#   - file-manager-platform-e2e-nightly.yml (ref = its own commit; schedule + dispatch)
#   - file-manager-platform-e2e-at-tag.yml (ref = a resolved rc tag; dispatch only,
#     which also records rc evidence from this job's operator-image-digest output)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (tag/branch/SHA) to checkout and build the operator from. Empty = this run''s own commit.'
        required: false
        type: string
        default: ''
      cluster-name:
        description: 'kind cluster name (must be unique across concurrently-running callers)'
        required: false
        type: string
        default: 'fm-platform-e2e'
    outputs:
      operator-image-digest:
        description: 'sha256 digest of the operator image actually deployed (registry push, cross-checked against the deployed pod imageID)'
        value: ${{ jobs.platform-e2e.outputs.operator-image-digest }}

permissions:
  contents: read

env:
  APP_NS: fm-e2e
  SCRAPE_NS: fm-e2e-scrape
  CURL_IMAGE: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69

jobs:
  platform-e2e:
    name: file-manager through kn-next deploy on kind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      operator-image-digest: ${{ steps.build-operator.outputs.operator-image-digest }}
    env:
      CLUSTER: ${{ inputs.cluster-name }}
    steps:
      - name: Resolve checkout ref (input or this run's own commit)
        id: resolve-ref
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          echo "ref=${REF_INPUT:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache-dependency-path: packages/kn-next-operator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # Moved ahead of the self-tests (was after cluster/operator setup):
      # storage-mode-e2e.selftest.mjs imports the REAL RESERVED_STATIC_DIRS
      # from the built @getknext/core dist rather than re-declaring it
      # (#1292 round 2), so the dist must exist before the self-test runs.
      - name: Build the workspace packages + the kn-next CLI
        run: |
          set -euo pipefail
          bun run --filter "@getknext/lib" build
          bun run --filter "@getknext/db" build
          bun run --filter "@getknext/core" build
          test -f packages/kn-next/dist/cli/kn-next.js
          test -f packages/kn-next/dist/utils/reserved-static-dirs.js

      # The harness must be able to see red BEFORE its verdict on the cluster counts.
      - name: Self-test - the checks go red on deliberate defects
        run: node apps/file-manager/scripts/platform-e2e.selftest.mjs

      - name: Self-test - the storage-mode leg's checks go red on deliberate defects
        run: node apps/file-manager/scripts/storage-mode-e2e.selftest.mjs

      - name: Create kind cluster (registry certs.d config_path)
        run: |
          set -euo pipefail
          cat <<'YAML' | kind create cluster --name "$CLUSTER" --wait 120s --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            [plugins."io.containerd.grpc.v1.cri".registry]
              config_path = "/etc/containerd/certs.d"
          YAML

      - name: Start in-cluster registry + wire the kind node to it
        run: |
          set -euo pipefail
          reg=kind-registry
          docker run -d --restart=always -p 127.0.0.1:5001:5000 --name "$reg" \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker network connect kind "$reg"
          node="${CLUSTER}-control-plane"
          docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
          printf '[host."http://%s:5000"]\n' "$reg" \
            | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml

      - name: Install cert-manager
        run: |
          set -euo pipefail
          # Shared fetch+checksum-verify+image-digest-pin+apply helper (#1289) — do
          # not re-inline the curl/sha256sum steps here; that drift (this lane's
          # own copy skipped the image-digest pin the shared script does) is exactly
          # what the helper exists to prevent.
          scripts/kind-manifests/apply-cert-manager.sh
          kubectl wait --for=condition=Available --timeout=300s \
            -n cert-manager deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector

      - name: Install Knative Serving + Kourier (scale-to-zero tuned)
        run: |
          set -euo pipefail
          V="knative-v1.16.0"
          scripts/kind-manifests/apply-knative-kourier.sh "${V}"
          kubectl patch configmap/config-network -n knative-serving --type merge \
            --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
          kubectl patch configmap/config-autoscaler -n knative-serving --type merge \
            --patch '{"data":{"scale-to-zero-pod-retention-period":"0s","stable-window":"6s"}}'
          kubectl wait --for=condition=Available --timeout=300s \
            -n knative-serving deployment/controller deployment/webhook deployment/autoscaler deployment/net-kourier-controller

      # The operator is built from the resolved ref, so a runtime or operator
      # regression lands in the same run as the app/ref change that exposes it.
      - name: Build + push the operator image, capture + verify the deployed digest
        id: build-operator
        working-directory: packages/kn-next-operator
        run: |
          set -euo pipefail
          IMG="localhost:5001/kn-next-operator:e2e-${GITHUB_RUN_ID}"
          # `go mod download` inside the image build hits proxy.golang.org, which
          # occasionally drops a stream. Retry the BUILD only (bounded), never a check.
          for attempt in 1 2 3; do
            make docker-build IMG="$IMG" && break
            [ "$attempt" = 3 ] && { echo "::error::operator image build failed 3x"; exit 1; }
            echo "docker-build attempt $attempt failed; retrying"; sleep 10
          done
          # `docker-build` never pushes, so an unpushed local image has no
          # RepoDigests entry to read. Push to the SAME in-cluster registry the
          # app images already use (the kind node already trusts localhost:5001,
          # wired above) and take the digest from the registry that accepted it.
          make docker-push IMG="$IMG"
          PUSH_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG" | sed 's/.*@//')"
          if [ -z "$PUSH_DIGEST" ]; then
            echo "::error::Could not capture the operator image digest from the registry push"
            exit 1
          fi
          make install
          make deploy IMG="$IMG"
          kubectl rollout status deployment/kn-next-operator-controller-manager \
            -n kn-next-operator-system --timeout=180s
          # Cross-check against the DEPLOYED pod's own imageID: this is the
          # digest of the image the cluster actually pulled and is running,
          # read straight off the pod, not merely what the push reported. A
          # stale cached layer or a racing second push would show up here as a
          # mismatch rather than as a silently wrong "rc evidence" value.
          POD_IMAGE_ID="$(kubectl get pods -n kn-next-operator-system \
            -l control-plane=controller-manager \
            -o jsonpath='{.items[0].status.containerStatuses[?(@.name=="manager")].imageID}')"
          if [ -z "$POD_IMAGE_ID" ]; then
            echo "::error::Could not read the deployed operator pod's imageID"
            exit 1
          fi
          case "$POD_IMAGE_ID" in
            *"$PUSH_DIGEST"*) ;;
            *)
              echo "::error::Deployed pod imageID ($POD_IMAGE_ID) does not match the pushed digest ($PUSH_DIGEST)"
              exit 1
              ;;
          esac
          echo "operator-image-digest=$PUSH_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Data plane (redis, postgres, minio) + Secrets
        run: |
          set -euo pipefail
          kubectl create namespace "$APP_NS"
          kubectl create namespace "$SCRAPE_NS"
          kubectl label namespace "$SCRAPE_NS" knext.dev/metrics-scrape=true
          rnd() { openssl rand -hex 16; }
          PG_PW="$(rnd)"; MINIO_KEY="$(rnd)"; MINIO_SECRET="$(rnd)"
          CACHE_TOKEN="$(rnd)"; OBS_TOKEN="$(rnd)"; API_TOKEN="$(rnd)"
          for v in "$PG_PW" "$MINIO_KEY" "$MINIO_SECRET" "$CACHE_TOKEN" "$OBS_TOKEN" "$API_TOKEN"; do echo "::add-mask::$v"; done
          kubectl -n "$APP_NS" create secret generic fm-e2e-pg --from-literal=password="$PG_PW"
          kubectl -n "$APP_NS" create secret generic fm-e2e-minio --from-literal=access="$MINIO_KEY" --from-literal=secret="$MINIO_SECRET"
          kubectl -n "$APP_NS" create secret generic fm-e2e-db \
            --from-literal=DATABASE_URL="postgres://postgres:${PG_PW}@postgres.${APP_NS}.svc.cluster.local.:5432/filemanager"
          kubectl -n "$APP_NS" create secret generic file-manager-credentials \
            --from-literal=CACHE_INVALIDATE_TOKEN="$CACHE_TOKEN" \
            --from-literal=OBSERVABILITY_TOKEN="$OBS_TOKEN" \
            --from-literal=MINIO_ENDPOINT="minio.${APP_NS}.svc.cluster.local" \
            --from-literal=MINIO_PORT=9000 \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_KEY" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_SECRET"
          kubectl -n "$APP_NS" create secret generic global-tokens --from-literal=file_manager_token="$API_TOKEN"
          {
            echo "CACHE_INVALIDATE_TOKEN=$CACHE_TOKEN"
            echo "OBSERVABILITY_TOKEN=$OBS_TOKEN"
            echo "MINIO_ACCESS_KEY=$MINIO_KEY"
            echo "MINIO_SECRET_KEY=$MINIO_SECRET"
          } >> "$GITHUB_ENV"
          kubectl apply -f apps/file-manager/platform-e2e/data-plane.yaml
          kubectl -n "$APP_NS" rollout status deploy/redis deploy/postgres deploy/minio --timeout=180s

      # Through the product: the real CLI builds, pushes the app's own Dockerfile,
      # resolves the digest and applies the NextApp CR. The operator does the rest.
      - name: kn-next deploy (config profile for kind)
        run: |
          set -euo pipefail
          cp apps/file-manager/platform-e2e/knext.config.e2e.ts apps/file-manager/knext.config.ts
          cd apps/file-manager
          node ../../packages/kn-next/dist/cli/kn-next.js deploy \
            --registry localhost:5001 --namespace "$APP_NS" --tag "${GITHUB_RUN_ID}"
          kubectl -n "$APP_NS" wait --for=condition=Ready --timeout=300s nextapp/file-manager \
            || (kubectl -n "$APP_NS" get nextapp,ksvc,pods -o wide; kubectl -n "$APP_NS" describe nextapp file-manager; exit 1)

      # Write-free runtime: file-manager is a vinext DISK-MODE binary (sharp
      # loads from the image's read-only native/ tree), so `kn-next deploy`
      # marks the CR `spec.security.writeFree` and the operator renders NO
      # writable volume — not even the /tmp emptyDir vinext builds used to
      # get. The platform checks below (images, ISR, uploads) then run against
      # that volume-free pod.
      - name: Write-free runtime - no writable volume rendered for the vinext app
        run: |
          set -euo pipefail
          wf="$(kubectl -n "$APP_NS" get nextapp file-manager -o jsonpath='{.spec.security.writeFree}')"
          echo "spec.security.writeFree=${wf}"
          [ "$wf" = "true" ] || { echo "::error::NextApp spec.security.writeFree is '${wf}', want true"; exit 1; }
          ksvc="$(kubectl -n "$APP_NS" get ksvc file-manager -o json)"
          vols="$(echo "$ksvc" | jq -c '.spec.template.spec.volumes // []')"
          mounts="$(echo "$ksvc" | jq -c '[.spec.template.spec.containers[].volumeMounts // []] | add // []')"
          rorfs="$(echo "$ksvc" | jq -r '.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem')"
          echo "volumes=${vols} mounts=${mounts} readOnlyRootFilesystem=${rorfs}"
          [ "$vols" = "[]" ] || { echo "::error::ksvc template renders volumes: ${vols}"; exit 1; }
          [ "$mounts" = "[]" ] || { echo "::error::ksvc template renders volumeMounts: ${mounts}"; exit 1; }
          [ "$rorfs" = "true" ] || { echo "::error::readOnlyRootFilesystem is '${rorfs}', want true"; exit 1; }

      - name: Reach the cluster (kourier-internal + MinIO port-forwards)
        run: |
          set -euo pipefail
          # The operator serves apps cluster-local (status.url is *.svc.cluster.local),
          # and Knative programs cluster-local hosts on kourier-internal only.
          kubectl -n kourier-system port-forward svc/kourier-internal 8080:80 >/tmp/pf-kourier.log 2>&1 &
          kubectl -n "$APP_NS" port-forward svc/minio 9000:9000 >/tmp/pf-minio.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null && (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::port-forwards never came up"; cat /tmp/pf-*.log; exit 1

      - name: Platform e2e (A app / B platform / C basics)
        env:
          PLATFORM_E2E_BASE_URL: http://127.0.0.1:8080
          PLATFORM_E2E_NAMESPACE: ${{ env.APP_NS }}
          PLATFORM_E2E_SCRAPE_NAMESPACE: ${{ env.SCRAPE_NS }}
          KN_NEXT_CLI: ${{ github.workspace }}/packages/kn-next/dist/cli/kn-next.js
          APP_DIR: ${{ github.workspace }}/apps/file-manager
          MINIO_LOCAL_ENDPOINT: http://127.0.0.1:9000
        run: |
          export PLATFORM_E2E_SUMMARY="$GITHUB_STEP_SUMMARY"
          node apps/file-manager/scripts/platform-e2e.mjs

      - name: Write-free runtime - the vinext app logged no read-only write failure
        run: |
          set -euo pipefail
          found=0
          for p in $(kubectl -n "$APP_NS" get pods -l serving.knative.dev/service=file-manager -o name); do
            if kubectl -n "$APP_NS" logs "$p" -c user-container 2>&1 | grep -Ei 'EROFS|read-only file system'; then
              found=1
            fi
          done
          [ "$found" = 0 ] || { echo "::error::file-manager logged a read-only filesystem write failure"; exit 1; }

      # D. storage-mode leg (#1292). A SECOND NextApp, storage configured
      # against the SAME in-cluster MinIO the app-functionality leg already
      # uses. Reuses the standing cluster/operator/registry/MinIO rather than
      # a second cluster, so the added cost is one more build+deploy+check,
      # not another ~8-10min of cluster bring-up.
      # `aws s3 mb` creates a PRIVATE bucket. The served HTML links assets
      # straight at MinIO with no signing (a real browser can't sign a
      # request), so without an explicit anonymous-read policy every GET the
      # live-check step makes would 403 — a real failure mode, not a test
      # artifact, so it needs a real fix here rather than a workaround in the
      # checker.
      - name: Storage-mode - create the MinIO bucket for the leg (anonymous-read)
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$MINIO_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$MINIO_SECRET_KEY"
          aws s3 mb s3://fm-e2e-storage-assets --endpoint-url http://127.0.0.1:9000 --region us-east-1
          cat > /tmp/fm-e2e-storage-assets-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::fm-e2e-storage-assets/*"
              }
            ]
          }
          JSON
          aws s3api put-bucket-policy --bucket fm-e2e-storage-assets \
            --policy file:///tmp/fm-e2e-storage-assets-policy.json --endpoint-url http://127.0.0.1:9000

      - name: Storage-mode - kn-next deploy (object storage against in-cluster MinIO)
        env:
          STORAGE_TAG: ${{ github.run_id }}-storage
          KN_APP_NAMESPACE: ${{ env.APP_NS }}
        run: |
          set -euo pipefail
          cp apps/file-manager/platform-e2e/knext.config.storage-e2e.ts apps/file-manager/knext.config.ts
          cd apps/file-manager
          # `kn-next deploy` runs `aws s3` ON THE RUNNER (not in-cluster), so
          # AWS_ENDPOINT_URL must be the port-forward the runner can actually
          # resolve — NOT the cluster-internal DNS name, which only resolves
          # inside the cluster. `publicUrl` in the profile stays on cluster
          # DNS deliberately: that is what the SERVED HTML embeds, and it is
          # correct there because a real request to it comes from inside (or
          # in front of) the cluster, not from this runner.
          AWS_ENDPOINT_URL="http://127.0.0.1:9000" \
          AWS_ACCESS_KEY_ID="$MINIO_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$MINIO_SECRET_KEY" \
          AWS_DEFAULT_REGION=us-east-1 \
            node ../../packages/kn-next/dist/cli/kn-next.js deploy \
              --registry localhost:5001 --namespace "$APP_NS" --tag "$STORAGE_TAG"
          kubectl -n "$APP_NS" wait --for=condition=Ready --timeout=300s nextapp/file-manager-storage \
            || (kubectl -n "$APP_NS" get nextapp,ksvc,pods -o wide; kubectl -n "$APP_NS" describe nextapp file-manager-storage; exit 1)

      - name: Storage-mode - assets served from MinIO, build id matches the deploy tag
        env:
          PLATFORM_E2E_BASE_URL: http://127.0.0.1:8080
          PLATFORM_E2E_NAMESPACE: ${{ env.APP_NS }}
          STORAGE_APP_NAME: file-manager-storage
          STORAGE_BUCKET_URL: http://minio.${{ env.APP_NS }}.svc.cluster.local:9000/fm-e2e-storage-assets
          STORAGE_TAG: ${{ github.run_id }}-storage
          MINIO_LOCAL_ENDPOINT: http://127.0.0.1:9000
        run: |
          export PLATFORM_E2E_SUMMARY="$GITHUB_STEP_SUMMARY"
          node apps/file-manager/scripts/storage-mode-e2e.mjs

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$APP_NS" get nextapp,ksvc,configuration,revision,pods 2>&1 || true
          kubectl -n "$APP_NS" get nextapp file-manager -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' 2>&1 || true
          kubectl -n "$APP_NS" get nextapp file-manager-storage -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' 2>&1 || true
          kubectl -n "$APP_NS" get revision -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .status.conditions[*]}{.type}={.status} {.reason} {.message}{" | "}{end}{"\n"}{end}' 2>&1 || true
          kubectl -n "$APP_NS" get events --sort-by=.lastTimestamp 2>&1 | tail -30 || true
          revs="$(kubectl -n "$APP_NS" get revision -o name --sort-by=.metadata.creationTimestamp)"
          echo "revision count: $(echo "$revs" | wc -l)"
          r1="$(echo "$revs" | sed -n 3p)"; r2="$(echo "$revs" | sed -n 4p)"
          echo "--- diff of $r1 vs $r2 (spec + annotations)"
          diff <(kubectl -n "$APP_NS" get "$r1" -o json | jq -S '{spec:.spec,ann:.metadata.annotations,lbl:.metadata.labels}') \
               <(kubectl -n "$APP_NS" get "$r2" -o json | jq -S '{spec:.spec,ann:.metadata.annotations,lbl:.metadata.labels}') || true
          kubectl -n kn-next-operator-system logs deploy/kn-next-operator-controller-manager --tail=40 2>&1 | cut -c1-400 || true
          for p in $(kubectl -n "$APP_NS" get pods -l serving.knative.dev/service=file-manager -o name 2>/dev/null); do
            kubectl -n "$APP_NS" logs "$p" --all-containers --tail=60 2>&1 || true
          done
          kubectl -n kn-next-operator-system logs deploy/kn-next-operator-controller-manager --tail=100 2>&1 || true

      - name: Diagnostics - storage bucket contents
        if: failure()
        run: |
          export AWS_ACCESS_KEY_ID="$MINIO_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$MINIO_SECRET_KEY" AWS_DEFAULT_REGION=us-east-1
          aws s3 ls s3://fm-e2e-storage-assets/ --recursive --endpoint-url http://127.0.0.1:9000 2>&1 \
            | awk '{print $4}' | sed -E 's#/[^/]*$##' | sort | uniq -c | head -40 || true
          aws s3 ls s3://fm-e2e-storage-assets/file-manager-storage/_next/static/chunks/ --endpoint-url http://127.0.0.1:9000 2>&1 | head -30 || true

      - name: Tear down
        if: always()
        run: |
          kind delete cluster --name "$CLUSTER" || true
          docker rm -f kind-registry || true
