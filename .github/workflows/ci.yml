name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

# Supersede this workflow's own in-flight runs (#674). #673 fixed the
# `pull_request` filter from `['*']` to `['**']`, which took stacked PRs — this
# repo's normal working mode — from ZERO ci.yml jobs per push to all 19; without
# a group, every superseded push kept running and kept being billed.
#
# The key, MEASURED rather than reasoned about (actions/checkout fetch refspecs
# in real run logs): a `pull_request` run's ref is `refs/pull/<n>/merge`
# (run 31047101359) and a `push` run's is `refs/heads/main` (run 31047831835),
# so the two triggers cannot collide on `github.ref` and do not cancel each
# other. `event_name` is in the key so that stays true by construction if
# `push:` is ever widened past `[main]`, and `workflow` so another workflow
# copying this idiom cannot join CI's group.
#
# Ref scoping is also what keeps this compatible with the #667 blocking-gate
# audit (tests/helpers/blocking-gate.ts): the only run that can cancel a gate
# here is a newer push to the SAME PR, whose own run must go green on the new
# head SHA. That helper now fails closed on a group that is NOT ref-scoped.
#
# Deliberately NOT applied to any workflow that publishes, signs, or deploys —
# a cancelled release or cosign run is worse than a duplicate. `ci.yml` pushes
# no image (its docker build is `load: true`), signs nothing and touches no
# cluster; `tests/ci-concurrency-group.test.ts` holds both halves of that.
#
# Cancellation is scoped to `pull_request`, and that is a deliberate narrowing.
# Keying the GROUP on `event_name` stops the two triggers cancelling each other,
# but it does not stop the `push`->`main` group cancelling ITSELF: two merges
# landing inside one CI duration would cancel `main`'s run for the intermediate
# commit and leave it with no verdict. `main` has already been red across three
# consecutive commits here, and a per-commit result is what makes that
# bisectable. The saving #674 is for is entirely in the `pull_request` group, so
# it is taken there and nowhere else. The cost, stated: consecutive merges to
# `main` are billed in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Full-history secret scan (security sprint S1). DELIBERATELY carries no
  # continue-on-error and no ref-conditional if: — the house idiom
  # `continue-on-error: ${{ github.ref != 'refs/heads/main' }}` used elsewhere
  # in this file would make this gate advisory on pull_request, the one event
  # it exists for. Full history (fetch-depth: 0) rather than diff scanning
  # kills the whole bypass class: base-branch secrets the diff never re-reads,
  # and force-pushes that rewrite the PR base out of a diff window. Runs the
  # pinned gitleaks BINARY, not gitleaks-action (org licensing + an unpinned
  # code path). Guarded by tests/secret-scan-gate.test.ts.
  #
  # Pin-resolution scope, recorded here so it survives the PR body: this pin
  # is deliberately OUTSIDE verify-action-pins.mjs — that nightly resolves
  # SHA<->tag drift for `uses:` action refs, whereas this is a sha256 over the
  # release tarball itself (stronger: content-addressed, no ref to drift).
  # Version bumps are deliberate edits to this file + secret-scan-nightly.yml.
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job downloads and executes a third-party binary over full
          # history; it must not do so with a GITHUB_TOKEN sitting in
          # .git/config (same posture as the nightly twin).
          persist-credentials: false

      - name: Install pinned gitleaks (checksum-verified)
        run: |
          set -eu
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan full history against the disposition-classed allowlist
        run: node scripts/secret-scan.mjs

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # examples/bun-exec sits OUTSIDE the workspace (own bun.lock) and its
      # test harnesses import from its own node_modules (srvx et al). The
      # bun-suite step below runs the example-suite collection guard, whose
      # child runs every example test file — without this install those files
      # die on `Cannot find module 'srvx/bun'`, which cost three CI rounds to
      # see through a guard message that printed only (empty) stderr.
      - name: Install example dependencies (examples/bun-exec)
        working-directory: examples/bun-exec
        run: bun install --frozen-lockfile

      - name: Run Biome lint & format check
        run: bun run lint

      # Fail FAST on the TS5097 main-red class (#289): a relative import written
      # with an explicit .ts/.tsx extension passes vitest at runtime but fails
      # `tsc --noEmit` under moduleResolution:bundler. Runs before the builds so
      # the branch goes red at PR time, not only after the post-build typecheck.
      - name: Guard — no .ts/.tsx import extensions (TS5097)
        run: bun run lint:ts-imports

      # Mutation residue (#645): a mutation-testing proof that was never restored
      # leaves the INVERSE of the fix in the tree, under a commit message
      # describing the fix. `git status --porcelain` cannot catch it when the file
      # is one the PR legitimately modifies — it reads `M` either way — so this
      # scans every tracked file for the marker instead. This step is red-on-fail
      # and carries no soft-failure escape: it happened twice in one session.
      - name: Guard — no mutation residue in tracked files (#645)
        run: bun run lint:mutation-residue

      # ADR phase gates (#709): the validator that keeps a phase from advancing on a
      # number nobody measured. It shipped running in NO job and with NO test, so two
      # of the four rules its own docblock advertised were unenforced and nothing
      # noticed. A gate that runs nowhere is documentation.
      - name: Guard — ADR phase gates are internally consistent
        run: bun run verify:phase-gates

      # @getknext/core ships only dist/ and its exports resolve to ./dist/* (#114).
      # The publish-surface test asserts every exports subpath exists in dist, so
      # core MUST be built before vitest runs. @getknext/lib must be built first —
      # core's dts build imports @getknext/lib/clients types (next-adapter.ts:122),
      # so without lib's dist the core build hard-fails (TS2307). Same lib→core
      # order as the compat-smoke and bytecode jobs.
      - name: Build @getknext/lib
        run: bun run --filter @getknext/lib build

      # @getknext/core type-imports @getknext/db (the `kn-next db migrate` runner lives
      # in @getknext/db/migrate, #242), so without db's dist the core build hard-fails
      # (TS2307). db depends on lib, so the order is lib→db→core.
      - name: Build @getknext/db
        run: bun run --filter @getknext/db build

      - name: Build @getknext/core
        run: bun run --filter @getknext/core build

      # Typecheck gate (#261): per-package `tsc --noEmit` so the strict-mode
      # baseline can never regrow silently. Runs AFTER the lib→db→core builds
      # above because the checks are dist-dependent (core's cli/db-migrate.ts
      # imports @getknext/db/migrate, next-adapter.ts imports @getknext/lib/clients —
      # both TS2307 without the upstream dist). lib/db typecheck through
      # tsconfig.typecheck.json, which (unlike their build tsconfigs) pulls the
      # test files into scope — the exact gap this gate closes.
      - name: Typecheck @getknext/lib (tsc --noEmit, tests in scope)
        run: bun run --filter @getknext/lib typecheck

      - name: Typecheck @getknext/db (tsc --noEmit, tests in scope)
        run: bun run --filter @getknext/db typecheck

      - name: Typecheck @getknext/core (tsc --noEmit, tests in scope)
        run: bun run --filter @getknext/core typecheck

      - name: Typecheck kn-next (alias shim — node --check, no TS)
        run: bun run --filter kn-next typecheck

      # @getknext/ui (private component lib) — self-contained, no dist deps; the
      # P6c coverage guard (ci-typecheck-contract.test.ts) requires every TS
      # workspace member be gated or documented-excluded.
      - name: Typecheck @getknext/ui (tsc --noEmit)
        run: bun run --filter @getknext/ui typecheck

      # apps/db-demo — dist-dependent on @getknext/db + @getknext/core (imports
      # @getknext/db and @getknext/db/schema), so it runs AFTER those builds above.
      - name: Typecheck db-demo (tsc --noEmit)
        run: bun run --filter db-demo typecheck

      # apps/file-manager (#804) — reference e2e Next app, previously the
      # checker-that-never-runs: no typecheck gate anywhere, so real TS errors
      # shipped invisibly. Dist-dependent on @getknext/lib + @getknext/core
      # (next-adapter.ts, instrumentation-node.ts), so it runs AFTER the builds
      # above. tsconfig.typecheck.json keeps generated `.next/` types out of
      # scope so the check is deterministic on this cold checkout.
      - name: Typecheck file-manager (tsc --noEmit)
        run: bun run --filter file-manager typecheck

      # BOTH runners. This step ran `vitest` alone, which after the bun migration
      # collects 3 files out of 338 — so CI's primary test job was executing 12
      # tests and reporting green, and the coverage gate below was measuring a
      # denominator of 3 files. The root `package.json` `ci` script had the same
      # staleness and was fixed; this copy was missed because nothing compares
      # them.
      #
      # The bun runner first: it is the suite. `scripts/bun-test.mjs` exits
      # non-zero on any failing file, and `tests/runner-partition.test.ts` asserts
      # every test file is claimed by exactly one of the two runners, so "ran
      # under neither" cannot hide here.
      #
      # `--coverage` here is NOT optional (#884). It is one lcov per spawned test
      # file, in `coverage-bun/`, and it is almost the entire NUMERATOR of the
      # coverage gate below. Dropping it would leave that gate measuring vitest's
      # 3 files, which is how it came to report 1.37% against a 77% floor.
      - name: Run tests (bun — the suite)
        run: node scripts/bun-test.mjs --coverage

      # The vitest half. Its 3 test files barely move the numerator, but its
      # `include` enumeration is the honest DENOMINATOR — every source file
      # listed, untouched ones at 0%.
      - name: Run tests (vitest — the 3 files that cannot run under bun)
        run: bun x vitest run --coverage

      # The gate itself: merge both runners' lcov, then check the floors from
      # scripts/lib/coverage-policy.mjs. It must run AFTER both steps above, and
      # it fails closed on a missing report — a coverage gate that goes green
      # because it found nothing to measure is the defect this replaced.
      - name: Coverage gate (merged across both runners)
        run: node scripts/check-coverage.mjs

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          directory: ./coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # #527 (Sprint 1, T0) — the root `tests/` tier is type-checked by nothing else.
  # Vitest strips types with esbuild without checking them, so a root test file
  # can be green under `vitest run` while `tsc` rejects it; that shipped twice
  # (PR #500's four implicit-`any`s, PR #526's non-assignable type predicate).
  #
  # This is its OWN top-level job, deliberately WITHOUT `needs:` — it runs
  # ALONGSIDE Lint & Test so a type error fails as early as a lint error rather
  # than waiting on that job's lib->db->core builds. It can: tsconfig.typecheck.json
  # is scoped to root-level TS only, so nothing here is dist-dependent.
  # The contract (config scope, real program contents via `tsc --showConfig`,
  # script, and this job's placement) is guarded by tests/root-typecheck-gate.test.ts.
  typecheck-root:
    name: Typecheck (root tests/)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck root tests/ (tsc --noEmit)
        run: bun run typecheck

  compat-smoke:
    # knext adapter SMOKE suite — NOT the official Next.js compatibility suite (ADR-0007,
    # option C). Builds apps/file-manager through the knext adapter (output:'standalone'),
    # boots the standalone server.js on Node and Bun, and asserts real HTTP behaviors.
    # The official deploy-test harness is a separate scheduled WORKFLOW, and it is named here
    # by file because a lane nickname used to stand in its place and resolved to nothing:
    # .github/workflows/test-e2e-deploy.yml — "Compat suite (official Next.js deploy harness)",
    # ADR-0007 A3-2. Node credential lane nightly 03:17 UTC; Bun runtime axis weekly Sun 05:17
    # UTC. Guarded by tests/compat-lane-pointer-resolution.test.ts.
    name: knext adapter smoke (NOT official compat suite)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    # Sprint 1, T4: check (k) asserts ISR against a REAL cache backend and FAILS (never
    # skips) without one. The smoke used to boot the server with REDIS_URL="" — the
    # in-memory fallback — which is precisely why the ISR row was unbacked. Digest-pinned
    # per security.md ("pin images by digest").
    services:
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
          # PINNED, and now at 1.4.0 (was '1.3.14', #754/#807). The platform runs
          # bun 1.4: the root bun.lock is lockfileVersion 3, which 1.3.x cannot
          # parse at all, and all three container images are already
          # oven/bun:1.4.0-alpine. The 1.3 lane that used to run here is gone
          # deliberately — see #882. Still PINNED rather than `latest`: the
          # mid-day 1.4.0 release is exactly the unpinned-toolchain drift this
          # repo pins images and actions against. Guarded by
          # tests/bun-version-pins.test.ts, which scans every workflow's setup-bun.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @getknext/lib and @getknext/core both ship only dist/ — they MUST be built
      # before the app. file-manager imports @getknext/core/adapters/otel-config and
      # the KnativeNextConfig type, and @getknext/core's exports now resolve to
      # ./dist/* (#114), so a missing core build breaks `next build`.
      - name: Build @getknext/lib
        run: bun run --filter @getknext/lib build

      # @getknext/core type-imports @getknext/db (the `kn-next db migrate` runner lives
      # in @getknext/db/migrate, #242), so without db's dist the core build hard-fails
      # (TS2307). db depends on lib, so the order is lib→db→core.
      - name: Build @getknext/db
        run: bun run --filter @getknext/db build

      - name: Build @getknext/core
        run: bun run --filter @getknext/core build

      - name: Build file-manager (vinext -> nitro .output)
        run: bun run --filter file-manager build

      # The smoke gates the ARTIFACT USERS GET (#900 exit criterion 2): compile
      # the nitro output into the single executable exactly as the Dockerfile
      # does, and boot THAT. Booting `.output/server/index.mjs` under bun — the
      # previous shape — misses every divergence that exists only in the
      # compiled binary: the sharp `process.dlopen` shim, the re-derived asset
      # root, closed module resolution. No --target: the smoke runs on THIS
      # runner, so the host triple is the right one (the musl cross-target is
      # the Dockerfile's concern).
      - name: Compile the single executable
        working-directory: apps/file-manager
        run: |
          bun run node_modules/@getknext/core/dist/adapters/vinext-compile.js \
            --entry .output/server/index.mjs \
            --outfile knext-smoke-exec

      # The sharp addon tree, staged beside the binary (the shim discovers
      # `native/` next to the executable; the addon links libvips by RELATIVE
      # rpath so the @img layout must survive intact — cp -RL dereferences
      # bun's isolated-store symlinks).
      - name: Stage the sharp native tree beside the binary
        run: |
          set -eu
          SRC=""
          for c in node_modules/.bun/node_modules/@img node_modules/@img; do
            [ -d "$c" ] && SRC="$c" && break
          done
          test -n "$SRC" || { echo "no @img tree found for sharp staging" >&2; exit 1; }
          mkdir -p apps/file-manager/native
          cp -RL "$SRC"/sharp-linux-x64 apps/file-manager/native/ 2>/dev/null || true
          cp -RL "$SRC"/sharp-libvips-linux-x64 apps/file-manager/native/ 2>/dev/null || true
          ls apps/file-manager/native/ | grep -q sharp- || { echo "sharp addon not staged" >&2; exit 1; }

      # SERVER_CMD == SERVER_PATH is the smoke's single-exec signal: no script
      # arg, no preload — the binary IS the server.
      - name: Run knext compat-smoke (compiled single executable)
        working-directory: apps/file-manager
        env:
          RUNTIME: bun
          SERVER_CMD: ${{ github.workspace }}/apps/file-manager/knext-smoke-exec
          SERVER_PATH: ${{ github.workspace }}/apps/file-manager/knext-smoke-exec
          # The service container above, reachable on localhost from the job.
          REDIS_URL: redis://127.0.0.1:6379
        run: node scripts/compat-smoke.mjs

  sigterm-drain-shipped:
    # Per-PR GATE for the LEGACY standalone supervisor's SIGTERM drain
    # (security.md graceful shutdown). HONESTY NOTE (#887): this job's subject
    # is node-server — the standalone-shape supervisor that still ships for
    # back-compat (stored CRs with build=turbopack) — NOT the artifact new
    # builds produce. An earlier version of this header claimed it proved "the
    # SHIPPED container layout"; since ADR-0048 the shipped layout is the
    # compiled single executable, whose drain is proved where the binary is —
    # `bun-exec-alpine-image` runs test/alpine-image.docker-e2e.test.ts, which
    # sends a real TERM to the real container and asserts the in-flight
    # request completes, exit 0, drain markers in order.
    # Mechanics (unchanged): node-server's hard deps are not traced into
    # `.next/standalone`; the legacy Dockerfile's `pnpm --prod deploy` of
    # @getknext/core is what makes the CMD bootable, and this job assembles
    # that exact layout. KNEXT_REQUIRE_STANDALONE=1 hard-fails (never skips)
    # if the standalone build is missing.
    name: SIGTERM drain (legacy standalone supervisor)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @getknext/lib and @getknext/core ship only dist/ and must be built before the
      # app; the test also `pnpm deploy`s @getknext/core (needs its dist present).
      - name: Build @getknext/lib
        run: bun run --filter @getknext/lib build

      # @getknext/core type-imports @getknext/db (the `kn-next db migrate` runner lives
      # in @getknext/db/migrate, #242), so without db's dist the core build hard-fails
      # (TS2307). db depends on lib, so the order is lib→db→core.
      - name: Build @getknext/db
        run: bun run --filter @getknext/db build

      - name: Build @getknext/core
        run: bun run --filter @getknext/core build

      # db-demo, not file-manager: this gate's subject is the node-server
      # SUPERVISOR — the app's own server.js is replaced by a slow fixture via
      # STANDALONE_SERVER_PATH — so it needs *a* standalone tree, and db-demo is
      # the only app still emitting one since ADR-0048 moved file-manager to
      # vinext. Left pointing at file-manager, this gate would hard-fail on a
      # build that no longer exists (KNEXT_REQUIRE_STANDALONE=1) or, without
      # that, skip silently and report green while testing nothing.
      - name: Build db-demo standalone (next build --webpack)
        run: bun run --filter db-demo build

      - name: Run SIGTERM shipped-bundle gates — drain + hard-cap (must NOT skip)
        env:
          # Converts the skipIf guard into a HARD failure if the build is missing,
          # so a green check genuinely proves BOTH the graceful-drain path
          # (sigterm-drain-e2e) and the force-kill hard-cap safety net
          # (sigterm-hardcap-e2e). Both boot the shipped runtime entry, and since
          # #678 every port either of them binds is OS-assigned — never a literal.
          # The two lanes get there differently, on purpose:
          #   - hard-cap: PORT=0 and METRICS_PORT=0. The fixture reports the port
          #     its socket actually got (LISTENING:<n>) and nothing scrapes metrics.
          #   - drain: both ports RESERVED via freePorts(2), because the supervisor
          #     TCP-probes its child at $PORT (port 0 can never be connected to, so
          #     PORT=0 killed the child-serving probe path) and because this lane
          #     scrapes :METRICS_PORT, which has no readback channel.
          # They therefore coexist in one invocation — and, unlike the old
          # hand-deconflicted 9091/9092 literals, with any OTHER job that happens
          # to share this runner. That collision is what made this gate flake with
          # `EADDRINUSE :::39188` on PR #676.
          KNEXT_REQUIRE_STANDALONE: '1'
          KNEXT_SIGTERM_APP_DIR: ${{ github.workspace }}/apps/db-demo
        # bun, not vitest: both files import `bun:test`, so vitest's config
        # excludes them and the step died with `No test files found` — a gate whose
        # contract is "must NOT skip", failing for a reason unrelated to draining.
        # `scripts/bun-test.mjs` also exits 1 on an empty selection, so a renamed
        # file still fails loudly.
        run: >-
          node scripts/bun-test.mjs
          apps/file-manager/sigterm-drain-e2e.test.ts
          apps/file-manager/sigterm-hardcap-e2e.test.ts

  # seam-alive gates: RETIRED (#885, stability sprint). The #352 defect class —
  # webpack layers duplicating @getknext/lib module state across the
  # instrumentation and app-server chunks — cannot occur under the vinext
  # (vite/rollup) single-graph build, and the guard hard-required a
  # `.next/standalone` tree no app on this path produces. The globalThis
  # Symbol.for anchoring in @getknext/lib STAYS (defense-in-depth, still
  # pinned by template-guarded-instrumentation.test.ts); what retired is the
  # artifact assertion whose subject no longer exists. See ADR-0027 Amendment.

  no-latest-guard:
    name: No :latest images in operator manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check operator manifests are digest-pinned
        run: bash packages/kn-next-operator/hack/check-no-latest.sh --quiet
      # Base-image-pin guard (refs #117): the operator runtime is distroless/static
      # + a CGO-disabled Go binary, so the only fixable Trivy HIGH/CRITICAL surface
      # is the Go stdlib version baked into the binary. A floating `golang:1.25`
      # builder can leak an unpatched stdlib CVE and fail the supply-chain Trivy
      # gate on main (blocking the bundle publish). This offline guard keeps the
      # builder pinned to a patched Go point release on every PR.
      - name: Check operator builder image is pinned to a patched Go release
        run: bash packages/kn-next-operator/hack/check-trivy-baseimage.bats.sh
      # Supply-chain hardening: EVERY Dockerfile FROM (app + operator) must be
      # pinned by @sha256: digest, not a floating tag — the base images determine
      # the CVE surface of the images we sign. Analogous to hadolint DL3006/DL3007.
      - name: Check all Dockerfile base images are digest-pinned
        run: bash scripts/check-base-images-pinned.sh --quiet

  bench-harness-guards:
    name: Benchmark harness guards (no cluster)
    runs-on: ubuntu-latest
    # #425 item 3. These suites were documented as MANUAL-ONLY, which means
    # nothing caught a regression in them — and they cover the most dangerous path
    # in the harness: capture/restore of a live service's autoscaling config. A
    # broken restore leaves a cluster mis-tuned in a way that silently corrupts
    # every later measurement rather than failing.
    #
    # They are cheap to run here because they need NO cluster: each stubs kubectl
    # via the documented DRY_RUN + DRY_RUN_EXERCISE_KC seam. The only extra
    # dependency is jq, which ubuntu-latest already ships.
    #
    # Worth stating why this is not optional: during the #536 work these suites
    # caught a regression the new feature's own (green) tests could not see —
    # a pending-restore file leaking out of dry runs and blocking every
    # subsequent run. Without them in CI that ships.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run harness guard suites
        working-directory: benchmarks/scale-to-zero-oke
        run: |
          set -euo pipefail
          failed=0
          for t in capture-restore k6-metrics-integrity running-pods-integrity \
                   api-retry provenance k6-latency-splits pending-restore; do
            echo "::group::${t}.test.sh"
            if bash "${t}.test.sh"; then
              echo "PASS ${t}"
            else
              echo "::error::${t}.test.sh FAILED"
              failed=1
            fi
            echo "::endgroup::"
          done
          # Run every suite before failing, so one red suite does not hide the
          # state of the other six.
          exit "$failed"

  safety-hook-guard:
    name: Agent safety-control hook (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # `.claude/hooks/block-dangerous-bash.sh` is the ONLY enforcement of the
    # operations `.claude/rules/security.md` calls never acceptable on an agent's
    # behalf: force/mirror/--all push, direct push to main/master, history rewrite,
    # recursive-force removal, cluster deletes, infra teardown.
    #
    # Its test suite is, by its own history, the only thing that has ever caught a
    # regression in it — and until now it ran only when a human remembered to type it.
    # That is exactly the shape security.md warns about: a documented expectation
    # degrades, and its efficacy is unobservable until it has already failed. Four
    # separate rounds shipped a bypass that looked correct on inspection.
    #
    # BOTH PLATFORMS, and that is the point rather than thoroughness for its own sake.
    # One of those bypasses was a BSD/GNU `sed` split: `N` at EOF discards the pattern
    # space on macOS and prints on GNU, so the hook was open where contributors run it
    # and closed where CI would have looked. A Linux-only gate cannot see that class at
    # all — it would have gone green while the control was open on every developer
    # machine. `grep -E \b` (four rule families) and `awk` behaviour differ the same way.
    # fail-fast is off so a divergence shows which platform, not just that one failed.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the safety-control suite
        run: |
          set -euo pipefail
          bash .claude/hooks/block-dangerous-bash.test.sh
      - name: Prove the suite is not decoration
        run: |
          set -euo pipefail
          # A guard that stays green when its subject is removed is decoration
          # (.claude/rules/workflow.md). Rather than assert a case count — which
          # drifts, and which gets edited to green — neuter the hook and require the
          # suite to NOTICE. The anchor must occur exactly once or this aborts: a
          # silently-failed substitution yields a green run that proves nothing.
          # MUTATE A COPY, never the in-tree hook. Safe here only because a runner
          # is ephemeral is not a reason to keep doing it: ADR-0043 Decision 9 says an
          # evidence harness may not mutate the artifact under test in the shared tree,
          # and this step is an evidence harness. Three lines to obey it.
          work=$(mktemp -d)
          cp .claude/hooks/block-dangerous-bash.sh .claude/hooks/block-dangerous-bash.test.sh "$work"/
          hook="$work/block-dangerous-bash.sh"
          # python3, not `sed -i`: that spelling is GNU-only and fails on the macOS half
          # of this matrix, which would have made the platform pair pointless. The script
          # asserts the anchor occurs exactly once and aborts otherwise — a silently
          # failed substitution yields a green run that proves nothing, which is why
          # `.claude/rules/workflow.md` bans doing this with perl.
          # One line deliberately: a heredoc body inside a YAML block scalar keeps its
          # indentation, which python rejects.
          python3 -c "p='$hook'; s=open(p).read(); a='deny() { echo'; n=s.count(a); assert n==1, f'anchor occurs {n}x, expected 1'; o=s.replace(a,'deny() { return 0; echo',1); assert o!=s, 'substitution produced no change'; open(p,'w').write(o)"
          grep -q 'deny() { return 0;' "$hook" || { echo "::error::mutation did not land"; exit 1; }
          if bash "$work/block-dangerous-bash.test.sh" >/dev/null 2>&1; then
            echo "::error::the suite passed with every deny() neutered — it proves nothing"
            exit 1
          fi
          # The in-tree hook must be untouched by this step, asserted not assumed.
          git diff --quiet -- .claude/hooks/block-dangerous-bash.sh ||
            { echo "::error::this step modified the in-tree hook"; exit 1; }
          echo "OK: neutering deny() reddens the suite, and the in-tree hook is untouched"

  operator-codegen-check:
    name: Operator codegen is up-to-date (make generate + make manifests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache: true
          cache-dependency-path: packages/kn-next-operator/go.sum
      - name: Run make generate
        working-directory: packages/kn-next-operator
        run: make generate
      - name: Run make manifests
        working-directory: packages/kn-next-operator
        run: make manifests
      - name: Fail if codegen produced a diff
        run: |
          if ! git diff --exit-code; then
            echo "ERROR: make generate or make manifests produced uncommitted changes."
            echo "Run 'make generate && make manifests' locally and commit the result."
            exit 1
          fi

  operator-test:
    # Issue #102: actually RUN the operator Go test suite in CI. `make test`
    # self-provisions envtest (setup-envtest dep) and excludes /e2e. We build the
    # install bundle first (make build-installer renders dist/install.yaml) so the
    # internal/install namespace-immunity tests RUN instead of skipping, and set
    # KNEXT_REQUIRE_BUNDLE=1 so a missing bundle HARD-FAILS — a green check can never
    # mean "skipped".
    name: Operator Go tests (envtest + install bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache: true
          cache-dependency-path: packages/kn-next-operator/go.sum
      - name: Resolve envtest k8s version
        working-directory: packages/kn-next-operator
        run: echo "ENVTEST_K8S_VERSION=$(make print-envtest-version)" >> "$GITHUB_ENV"
      - name: Cache envtest + tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/kn-next-operator/bin
          key: ${{ runner.os }}-envtest-${{ env.ENVTEST_K8S_VERSION }}-${{ hashFiles('packages/kn-next-operator/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-envtest-
      - name: Set up envtest binaries
        working-directory: packages/kn-next-operator
        run: make setup-envtest
      - name: Build install bundle (so immunity tests run, not skip)
        working-directory: packages/kn-next-operator
        run: make build-installer
      # A build-tagged suite is INVISIBLE to `go vet ./...` and `go build ./...`, so it
      # can stop compiling with every PR gate green. That is not hypothetical: deleting
      # one spec took a helper + const with it that two other specs in the same tag
      # still used, and it reached `main`. The nightly lane then dies at BUILD time, so
      # the invariants it owns (scale-from-zero #39, image-prewarm #471) stop running
      # instead of reporting — strictly worse than a failing test.
      #
      # Runs BEFORE the envtest suite: it is seconds long and needs no cluster, so a
      # broken tag should fail fast rather than after envtest boots.
      - name: Compile-check every build-tagged e2e suite
        working-directory: packages/kn-next-operator
        run: make vet-tags

      - name: Run operator Go test suite (envtest)
        working-directory: packages/kn-next-operator
        env:
          # Converts the dist/install.yaml skip guards into a HARD failure if the
          # bundle is missing — the namespace-immunity contract must be gated.
          KNEXT_REQUIRE_BUNDLE: '1'
        run: make test

  prod-image-optimization:
    # #66 AC#2 + AC#3: the ONLY job that verifies next/image optimization in the
    # SHIPPED Alpine production image. It BUILDS apps/file-manager/Dockerfile (musl),
    # runs the container, and runs scripts/prod-image-probe.mjs — a STRICT, fail-closed
    # probe (unlike compat-smoke check 'g', which skip()s on non-200 so a no-bucket CI
    # stays green, and which only ever ran on the ubuntu/glibc standalone server.js).
    #
    # AC#3 (sharp present) is also enforced inside the build itself: the Dockerfile runs
    # `node -e require('sharp')` and `apk add vips`, so a missing musl runtime fails the
    # image build before this job even reaches the probe.
    name: Prod image next/image optimization (strict, #66)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (to run the probe on the host)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Cheap regression for the probe's fail-closed logic (no Docker needed):
      # proves the strict probe FAILS on 500 / wrong content-type / non-shrinking
      # output and PASSES only when all invariants hold. If this regresses, the
      # docker probe below could silently stop gating anything.
      - name: Self-test the strict probe (fail-closed)
        run: node apps/file-manager/scripts/prod-image-probe.selftest.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build the production image. The Dockerfile's `RUN node -e require('sharp')`
      # verification (AC#3) fails the build here if sharp's musl runtime is missing.
      - name: Build production Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/file-manager/Dockerfile
          target: runner
          tags: knext-file-manager:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the production container
        run: |
          docker run -d --name knext-prod -p 3000:3000 \
            -e REDIS_URL="" \
            knext-file-manager:ci
          echo "container started"

      # STRICT probe — FAILS (does not skip) unless: HTTP 200 AND content-type is
      # image/webp|avif AND optimized body < source bytes. (#66 AC#2.)
      - name: Probe /_next/image (strict, fail-closed)
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node apps/file-manager/scripts/prod-image-probe.mjs

      - name: Container logs (on failure)
        if: failure()
        run: docker logs knext-prod || true

      - name: Stop container
        if: always()
        run: docker rm -f knext-prod || true

  db-live-integration:
    # Plan P2 (ADR-0021): the @getknext/db live-Postgres lane — the first place the
    # SDK's product claims (migrations apply + idempotent, read-your-writes, RO
    # routing, the one-shot CLI runner) touch a REAL database.
    #
    # SAFETY BY CONSTRUCTION: DATABASE_URL below is a HARDCODED, inline,
    # throwaway credential for the ephemeral service container — deliberately
    # NOT a secret. This job must reference NO `secrets.*` for the DSN
    # (tests/db-live-workflow.test.ts enforces it), so no real database DSN can
    # ever enter this lane; the suite's own host guard (live-dsn-guard.ts)
    # additionally refuses any non-loopback host before connecting.
    name: '@getknext/db live Postgres integration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knext
          POSTGRES_PASSWORD: knext-ci-throwaway
          POSTGRES_DB: knext
        ports:
          - 5432:5432
        # Job start is gated on pg_isready-style container health — the suite
        # never races a booting Postgres (the plan's readiness-flake risk).
        options: >-
          --health-cmd "pg_isready -U knext -d knext"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KNEXT_DB_LIVE: '1'
      # Inline throwaway DSN on loopback (the runner maps the service port).
      DATABASE_URL: postgres://knext:knext-ci-throwaway@127.0.0.1:5432/knext
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite imports `@getknext/db` and `@getknext/core` by PACKAGE NAME, so
      # their dist must exist. Under vitest it did not have to: `vitest.config.ts`
      # aliases those specifiers to `packages/*/src` precisely so a clean run works
      # before any build. bun has no such alias, so the import failed with
      # `Cannot find package '@getknext/db'` and five hermetic guards died on it.
      #
      # Building is the better half of the trade anyway — it exercises the real
      # dist surface consumers get, rather than the source the alias substitutes.
      - name: Build @getknext/lib
        run: bun run --filter @getknext/lib build

      - name: Build @getknext/db
        run: bun run --filter @getknext/db build

      - name: Build @getknext/core
        run: bun run --filter @getknext/core build

      # The live suite + its hermetic guards (DSN host guard, workflow contract).
      - name: Run the live @getknext/db suite
        # bun, not vitest — all three import `bun:test`; same reason as above.
        run: >-
          node scripts/bun-test.mjs
          packages/db/src/__tests__/integration/live-postgres.test.ts
          packages/db/src/__tests__/live-dsn-guard.test.ts
          tests/db-live-workflow.test.ts

  docs-site:
    # Docs site (apps/docs, knext.dev) build gate — mirrors the compat-smoke
    # file-manager pattern: root workspace-aware install, build the @getknext chain
    # (lib→db→core) then knext-docs. The docs app consumes @getknext/core via
    # `workspace:*` (it imports @getknext/core, @getknext/core/adapter, and
    # @getknext/core/validate), so the chain MUST build before `next build`.
    #
    # Two build legs, BOTH required:
    #   1. vanilla (KNEXT_ADAPTER unset) — the managed-host build (what Vercel
    #      ships at knext.dev). Asserts .vercel/output (Build Output API v3).
    #   2. the bun target (default preset) — the knext dogfood image — and the
    #      node target (NITRO_PRESET=node) behind Dockerfile.oke. adapterPath /
    #      adapter-key drift is covered by `seam-alive` against file-manager,
    #      not here: this app no longer builds through next.config at all.
    #
    # Path-filtered: only runs when the docs app OR the public @getknext/core surface
    # changes (turbo-cache-friendly — an unrelated PR skips the ~minutes-long
    # Fumadocs build).
    name: Docs site build (apps/docs → knext.dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # For push (main) the base is the previous commit; on PRs the action
          # diffs against the PR base automatically.
          filters: |
            docs:
              - 'apps/docs/**'
              - 'packages/kn-next/src/**'
              - 'packages/kn-next/package.json'
              - '.github/workflows/ci.yml'

      - name: Setup Node.js
        if: steps.filter.outputs.docs == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        if: steps.filter.outputs.docs == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        if: steps.filter.outputs.docs == 'true'
        run: bun install --frozen-lockfile

      # lib→db→core, same ordering rationale as compat-smoke: core's dts build
      # type-imports @getknext/lib/clients and @getknext/db/migrate, so both must ship
      # dist first or core's build hard-fails (TS2307). knext-docs then resolves
      # @getknext/core (and its ./adapter + ./validate subpaths) against that dist.
      - name: Build @getknext/lib
        if: steps.filter.outputs.docs == 'true'
        run: bun run --filter @getknext/lib build

      - name: Build @getknext/db
        if: steps.filter.outputs.docs == 'true'
        run: bun run --filter @getknext/db build

      - name: Build @getknext/core
        if: steps.filter.outputs.docs == 'true'
        run: bun run --filter @getknext/core build

      # Config-validate gate: run the docs dogfood kn-next.config.ts through the
      # REAL @getknext/core/validate (the public surface), same code path
      # `kn-next deploy` uses. Proves the workspace `./validate` export resolves.
      - name: Validate the docs kn-next.config.ts (real validateConfig)
        if: steps.filter.outputs.docs == 'true'
        working-directory: apps/docs
        run: bun run config:validate

      # The two legs that used to live here — vanilla `.next/BUILD_ID` and adapter
      # `.next/standalone/...` — were both dead. The docs app builds with
      # vinext/vite now, which emits a nitro server under `.output/` and no
      # `.next/` at all, and ignores `next.config.ts` entirely, so `KNEXT_ADAPTER=1`
      # selected nothing. Neither assertion could pass; nothing noticed because
      # ci.yml had never run against the branch that migrated the app.
      #
      # Adapter-key coverage is NOT lost with them: `seam-alive` builds
      # apps/file-manager with `next build --webpack` and asserts the standalone
      # artifact, which is what actually exercises `experimental.adapterPath`.
      #
      # What replaces them gates the three targets this app really deploys to.
      # Each is a different nitro preset, and two of them cannot run the default
      # one's output.
      - name: Build knext-docs (default = bun target, the knext dogfood image)
        if: steps.filter.outputs.docs == 'true'
        run: |
          rm -r apps/docs/.output apps/docs/.vercel 2>/dev/null || true
          bun run --filter knext-docs build

      - name: Assert the bun target emits its bespoke entry
        if: steps.filter.outputs.docs == 'true'
        # Both halves. The path alone passes for a build that silently fell back
        # to nitro's default entry, which is exactly what a mis-set preset makes.
        run: |
          test -f apps/docs/.output/server/index.mjs
          grep -q 'metricsServer' apps/docs/.output/server/index.mjs

      - name: Build knext-docs for Node (NITRO_PRESET=node — the OKE image)
        if: steps.filter.outputs.docs == 'true'
        env:
          NITRO_PRESET: node
        run: |
          rm -r apps/docs/.output apps/docs/.vercel 2>/dev/null || true
          bun run --filter knext-docs build

      - name: Assert the Node target does NOT carry the bun entry
        if: steps.filter.outputs.docs == 'true'
        # knext-bun-entry.mjs serves through Bun.serve; carried into a node:22
        # image it builds cleanly and dies at runtime. This is the assertion that
        # would have caught Dockerfile.oke shipping a bun build.
        run: |
          test -f apps/docs/.output/server/index.mjs
          ! grep -q 'metricsServer' apps/docs/.output/server/index.mjs

      - name: Build knext-docs for Vercel (NITRO_PRESET=vercel — knext.dev)
        if: steps.filter.outputs.docs == 'true'
        env:
          NITRO_PRESET: vercel
        run: |
          rm -r apps/docs/.output apps/docs/.vercel 2>/dev/null || true
          bun run --filter knext-docs build

      - name: Assert the Vercel target emits Build Output API v3
        if: steps.filter.outputs.docs == 'true'
        # Vercel consumes .vercel/output only when the build produces it. A build
        # that quietly emitted .output instead reported "4 successful" and then
        # failed the deploy — that is the failure this gates.
        run: |
          test -f apps/docs/.vercel/output/config.json
          test -f apps/docs/.vercel/output/functions/__server.func/index.mjs
          ! grep -q 'metricsServer' apps/docs/.vercel/output/functions/__server.func/index.mjs

      # Materialise the DOCS-SCOPED dependency closure. Under pnpm the whole
      # workspace shares ONE root pnpm-lock.yaml and node_modules hoists to the
      # root — so `scan-ref: apps/docs` finds NOTHING (no local lockfile). Instead
      # `turbo prune` emits a pruned workspace whose pnpm-lock.yaml contains ONLY
      # knext-docs + its @getknext/{core,db,lib} closure. Trivy scans THAT lockfile,
      # so the npm→pnpm transitive shifts (and the root pnpm.overrides Trivy
      # remediations) are checked against the docs-only tree, not the whole repo.
      - name: Prune docs dependency closure (turbo prune → scoped lockfile)
        if: steps.filter.outputs.docs == 'true'
        run: bun x turbo prune knext-docs --out-dir ./.docs-closure

      # Trivy fs scan of the docs closure lockfile. Report (don't block) on PRs;
      # The gate scans an SBOM of the closure's PRODUCTION dependencies, read from
      # the installed tree — not a lockfile. Pointing Trivy at `bun.lock` instead
      # was measured at 509 packages vs pnpm-lock's 777, missing a HIGH that IS in
      # the file under a nested key its parser does not descend into.
      # `scripts/sbom-docs-closure.mjs` carries the full measurement.
      - name: Install the docs closure (the SBOM is read from the installed tree)
        if: steps.filter.outputs.docs == 'true'
        working-directory: ./.docs-closure
        run: bun install

      - name: Build the docs closure SBOM (production dependencies)
        if: steps.filter.outputs.docs == 'true'
        run: node scripts/sbom-docs-closure.mjs ./.docs-closure ./.docs-closure/closure.cdx.json

      # ENFORCE (fail) on main — the same phased gate the image supply-chain job
      # uses. FAIL on HIGH/CRITICAL.
      #
      # The old note here said any HIGH in this closure was "a pre-existing
      # REPO-WIDE toolchain CVE ... not a docs-runtime issue". That was wrong on
      # its own example: picomatch@2.3.1 is reachable at RUNTIME via
      # fast-glob -> micromatch -> picomatch. Scoping to production dependencies
      # removes the toolchain noise that made the excuse necessary, so a finding
      # here is now a finding about what ships.
      - name: Trivy scan — docs dependency closure (FAIL on HIGH/CRITICAL)
        if: steps.filter.outputs.docs == 'true'
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: ./.docs-closure/closure.cdx.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

  docs-drift-reminder:
    # SOFT, NON-BLOCKING nudge (judgment-based, never a hard gate):
    #   (a) if a PR changes public surface (packages/kn-next/src exports, config
    #       schema, CLI) WITHOUT touching apps/docs/content/**, warn "docs may
    #       need an update — knext.dev is user-facing".
    #   (b) grep the apps/docs/content/** DIFF for internal refs
    #       (ADR-NNNN | #NN | vinext | Nitro) and warn — the site stays
    #       user-facing even living beside the code + ADRs.
    # Both are ::warning:: annotations only; the job always succeeds.
    name: Docs drift reminder (soft, non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Public-surface-changed-without-docs reminder
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          CHANGED="$(git diff --name-only "$BASE"...HEAD || true)"
          echo "Changed files:"; echo "$CHANGED"
          SURFACE="$(echo "$CHANGED" | grep -E '^packages/kn-next/src/|^packages/kn-next/package.json' || true)"
          DOCS="$(echo "$CHANGED" | grep -E '^apps/docs/content/' || true)"
          if [ -n "$SURFACE" ] && [ -z "$DOCS" ]; then
            echo "::warning title=Docs may need an update::Public @getknext/core surface changed but apps/docs/content/** was not touched. knext.dev is user-facing — did the docs need an update? (Judgment-based reminder, not a gate.)"
          else
            echo "No public-surface-without-docs drift detected."
          fi

      - name: User-facing internal-reference reminder (content/** only)
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          # Only scan ADDED lines in content/** — the app's next-adapter/config
          # legitimately reference internals; this guard is content-only.
          DIFF="$(git diff "$BASE"...HEAD -- 'apps/docs/content/**' || true)"
          HITS="$(echo "$DIFF" | grep -E '^\+' | grep -vE '^\+\+\+' | grep -EI 'ADR-[0-9]|#[0-9]{2,}|vinext|Nitro' || true)"
          if [ -n "$HITS" ]; then
            echo "::warning title=Possible internal reference in user-facing docs::Added lines under apps/docs/content/** contain internal references (ADR-NNNN, #NN, vinext, or Nitro). knext.dev is user-facing — scrub internal refs. (Judgment-based reminder, not a gate.)"
            echo "$HITS"
          else
            echo "No internal references detected in added content/** lines."
          fi

  # ---------------------------------------------------------------------------
  # The bun-exec SIGTERM hardcap gate (#448).
  #
  # WHY THIS JOB EXISTS AT ALL: the e2e carries its own hard-fail guard
  # (KNEXT_REQUIRE_BUN=1 makes a missing `bun` throw instead of skip), but a
  # guard nothing invokes is decoration. Before this job, NO workflow ran
  # examples/bun-exec's tests, so the `describe.skipIf(!bunAvailable)` meant the
  # hardcap suite was green-by-skip everywhere -- the exact shape #408 was closed
  # for, in a different subsystem.
  #
  # examples/bun-exec is OUTSIDE the pnpm workspace (it has its own bun.lock and
  # pins nitro/vinext prereleases the workspace must not inherit), so its deps
  # are installed with bun, in-directory, not by the root `pnpm install`.
  bun-exec-hardcap:
    name: bun-exec SIGTERM hardcap (real sockets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
          # PINNED — see the first setup-bun step's rationale (#754/#807/#882).

      - name: Install example dependencies
        working-directory: examples/bun-exec
        run: bun install --frozen-lockfile

      # KNEXT_REQUIRE_BUN=1 is load-bearing: it converts "bun is missing" from a
      # silent skip into a thrown error. Removing it from this line does not make
      # the job fail -- it makes the gate stop gating, which is why
      # tests/bun-exec-hardcap-ci.test.ts asserts this env var is present here.
      - name: SIGTERM hardcap e2e
        working-directory: examples/bun-exec
        env:
          KNEXT_REQUIRE_BUN: '1'
        run: bun run test

  # ---------------------------------------------------------------------------
  # The vinext PRE-COMPILE CLOSURE supply-chain gate (ADR-0042 Consequence 6, #764).
  #
  # WHY THIS JOB EXISTS AT ALL: a `bun build --compile --bytecode` binary is
  # OPAQUE to syft and Trivy. Scan a vinext image and you see Alpine packages and
  # nothing else -- react, vinext, nitro and the app are all inside one ~120 MB
  # executable. That is precisely the "makes the image-scan gate vacuously green"
  # reasoning ADR-0042 used to REJECT `FROM scratch`, reached by another route;
  # full `resolve.noExternal` inlining completes it by deleting the last
  # externalised, scannable sliver. C6 therefore binds the vinext path to an SBOM
  # + HIGH/CRITICAL scan of the PRE-COMPILE CLOSURE -- the resolved node_modules
  # tree that feeds `vite build` -- and the architect gate ruled that gate a
  # PRECONDITION for the inlining config shipping beyond the spike branch.
  #
  # WHY IT SCANS THE INSTALLED TREE, NOT THE LOCKFILE. A lockfile is a claim
  # about what should be installed; the tree is what the compiler actually
  # swallows, including whatever install scripts materialised. MEASURED here,
  # each number stated as what it counts: `trivy fs examples/bun-exec` finds
  # `bun.lock` and catalogues 60 npm packages, while the same tree yields 210
  # INSTALLED packages by this repo's walker and 409 npm COMPONENTS under syft
  # (nested copies and package.json files inside published packages are counted
  # too; `find -name package.json` returns 527). What trivy never looked at
  # included a HIGH (nanoid 3.3.17 -- since bumped to 3.3.18 by an override in
  # the example's package.json, which is what this gate is for).
  #
  # WHY grype HERE AND Trivy ON IMAGES. `trivy sbom` refuses a syft directory
  # SBOM (`unsupported type`: syft sets the root component type to `file`), and
  # normalising the document before the scan would mean the scanner no longer
  # reads the artifact that was attached. grype consumes it as-is, so the scanned
  # bytes ARE the attached bytes. security.md says "Trivy/Grype"; the image gates
  # in supply-chain.yml stay Trivy.
  #
  # A VINEXT IMAGE *IS* PUBLISHED FROM CI (corrected 2026-09-04, C1/#785). This
  # block used to read "NO VINEXT IMAGE IS PUBLISHED FROM CI TODAY"; that was
  # true when it was written and stopped being true at ADR-0048.
  # `supply-chain.yml`'s `image-supply-chain` job builds apps/file-manager's
  # image -- alpine + a `bun build --compile` single executable -- `crane push`es
  # it to GHCR on main, cosign-signs the digest and attests an SBOM. THIS job's
  # subject is still only `examples/bun-exec`; the published app's closure is
  # gated inside that lane instead (`--app apps/file-manager`, run before the
  # build), guarded by `tests/published-image-closure-gate.test.ts`. The one job
  # here that builds a vinext artifact is `bun-exec-alpine-image` below, which
  # `needs:` this gate -- so the precondition holds for the example, and the
  # publish lane carries its own. `tests/precompile-closure-gate-ci.test.ts` SCANS EVERY
  # `.github/workflows/*.yml` (not just this file) for any job that compiles the
  # binary or builds its image -- including via the `bun run build` package-script
  # alias for `./build.sh` -- and requires a job running the closure audit in its
  # transitive `needs` closure, so a future publish lane that forgets it fails
  # there rather than shipping an opaque binary past a scan that never ran. What
  # that scan does NOT see: a lane that compiles through a reusable workflow, a
  # composite action or a shell wrapper. Adding one means extending
  # `tests/helpers/vinext-artifact-scan.ts` in the same PR.
  #
  # AND IT GUARDS ORDERING ONLY. ADR-0042 C6's other half -- the closure SBOM
  # ATTACHED TO THE IMAGE DIGEST AS A COSIGN ATTESTATION -- is no longer owed for
  # the PUBLISHED image (#785, done in supply-chain.yml: `cosign attest --type
  # cyclonedx --predicate sbom/app-closure.cdx.json` onto the pushed digest). It
  # is still true HERE: this job's SBOM is a per-run Actions artifact, which is
  # evidence, not provenance -- and correctly so, because nothing publishes an
  # examples/bun-exec image, so there is no digest to bind it to.
  # The subject of THIS job is exactly one closure: the in-repo
  # `examples/bun-exec`. A USER app on the vinext target still has no equivalent
  # closure gate; what changed is that the repo's own published app now does.
  #
  # THE EMPTINESS GUARD IS THE POINT. A scan of nothing exits 0, and both ways of
  # scanning nothing here are SILENT: `syft scan dir:` with default catalogers
  # emits ZERO npm components (measured), and an unpopulated closure directory has
  # trivially perfect coverage. `scripts/precompile-closure-audit.mjs` fails on
  # both -- mutation-proved against an empty directory (exit 1) and against a
  # default-cataloger SBOM (0 components, guard red).
  vinext-precompile-closure:
    name: vinext pre-compile closure SBOM + HIGH/CRITICAL scan (ADR-0042 C6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
          # PINNED — see the first setup-bun step's rationale (#754/#807/#882).

      # examples/bun-exec is OUTSIDE the pnpm workspace (own bun.lock, pins the
      # vinext/nitro prereleases the workspace must not inherit), so the closure
      # is materialised with bun, in-directory -- exactly as the two jobs below
      # do. `--frozen-lockfile` is what makes the scanned tree the tree the
      # committed lockfile describes.
      - name: Install the pre-compile closure (the tree that feeds `vite build`)
        working-directory: examples/bun-exec
        run: bun install --frozen-lockfile

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Unlike download-syft (which exports to PATH itself), download-grype only
      # exposes the binary location via its `cmd` output — spawning bare `grype`
      # without the PATH step below is an ENOENT, caught on this gate's first
      # real CI run. The output is the pinned action's own value, not
      # user-influenced text, so interpolating it into `run:` is safe.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0

      - name: Put grype on PATH
        run: dirname "${{ steps.grype.outputs.cmd }}" >> "$GITHUB_PATH"

      # SBOM (CycloneDX) over the installed closure -> coverage/emptiness guard
      # -> HIGH/CRITICAL scan of that exact SBOM, minus the dated + justified
      # security/precompile-closure-allowlist.json. One script so the three stay
      # in one order; deleting any of them reddens tests/precompile-closure-*.
      - name: SBOM + HIGH/CRITICAL scan of the pre-compile closure
        run: node scripts/precompile-closure-audit.mjs --closure examples/bun-exec

      # Attached per vinext build (C6 criterion 1). `always()` so a FAILING scan
      # still publishes the evidence of what was scanned -- the artifact is how
      # a triage decision gets made, and withholding it on failure is backwards.
      # A step-level `if:` is not a disarm (the job's failure still fails the
      # run); a step-level `continue-on-error:` would be, and the blocking-gate
      # audit scans every step for one.
      - name: Upload pre-compile closure SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: precompile-closure-sbom-${{ github.sha }}
          path: sbom/precompile-closure.cdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The bun-exec alpine-image gate (ADR-0042 A1 + A9).
  #
  # WHY THIS JOB EXISTS AT ALL: two claims about the compiled binary had nothing
  # running behind them.
  #
  #   A9 — `FROM alpine` + the single binary DOES NOT RUN. bun's `-musl` targets
  #        are dynamically linked; without libstdc++/libgcc the container dies
  #        with ~30 relocation errors and exit 127. ADR-0036's image row said
  #        otherwise for months, because every prior validation happened to run
  #        somewhere those libraries already existed.
  #   A1 — self-containment (routes embedded by `bun build --compile`, shipped as
  #        binary + `.output/public` with NO `.output/server`) was verified by
  #        hand during #460 and never again.
  #
  # `examples/bun-exec/test/alpine-image.docker-e2e.test.ts` has NO skip path -- a
  # missing docker or bun is a failure, not a skip -- but it is excluded from the
  # example's fast `bun run test` (it compiles a ~100 MB binary and builds a
  # container). This job is the only thing that runs it, which is why
  # tests/bun-exec-alpine-image-ci.test.ts asserts this job exists and invokes
  # `test:image`.
  #
  # examples/bun-exec is OUTSIDE the pnpm workspace, so its deps are installed
  # with bun, in-directory, exactly as the hardcap job does.
  bun-exec-alpine-image:
    name: bun-exec runs from a clean alpine (ADR-0042 A9)
    runs-on: ubuntu-latest
    # ADR-0042 C6 / #764: no vinext binary or image is built in CI before the
    # pre-compile closure has an SBOM and a clean HIGH/CRITICAL scan. That gate
    # cannot skip (no `if:`, no `paths:` filter), so needing it does not make
    # this job skippable -- which is the disarm `auditBlockingGate` checks for.
    needs: vinext-precompile-closure
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
          # PINNED — see the first setup-bun step's rationale (#754/#807/#882).

      - name: Install example dependencies
        working-directory: examples/bun-exec
        run: bun install --frozen-lockfile

      # The suite compiles the binary itself (via ./build.sh) UNCONDITIONALLY --
      # reusing a pre-existing one is what let a green run validate the wrong
      # artifact -- and builds + runs the reference Dockerfile. Deleting its
      # `apk add libstdc++ libgcc` line makes this step fail with the
      # container's own exit code 127 -- mutation-proved.
      - name: Alpine image e2e (compiled binary, clean container)
        working-directory: examples/bun-exec
        run: bun run test:image

  # ---------------------------------------------------------------------------
  # The compile-cache diagnostic's Bun probe (#309).
  #
  # WHY A SEPARATE JOB: the `Lint & Test` runner has no `bun`, so the Bun half of
  # `compile-cache-health-bun.test.ts` would skip there -- and the defect it
  # exists for is precisely a Bun-only false alarm (bun EXPORTS
  # module.getCompileCacheDir and returns undefined unconditionally, so a healthy
  # cache volume was being reported as "refused" on every Bun pod). A stub cannot
  # prove that fix; only a real bun process can.
  #
  # KNEXT_REQUIRE_BUN=1 is load-bearing exactly as it is in the job above: it
  # converts "bun is missing" from a silent skip into a failure. Removing it does
  # not redden anything by itself, which is why
  # tests/compile-cache-health-bun-ci.test.ts asserts it is present here.
  compile-cache-bun-probe:
    name: compile-cache diagnostic under real bun (#309)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
          # PINNED — see the first setup-bun step's rationale (#754/#807/#882).

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile-cache diagnostic under real bun
        env:
          KNEXT_REQUIRE_BUN: '1'
        # bun, not vitest — same reason as the seam-alive gate: the file imports
        # `bun:test`, so vitest collected nothing and exited 1.
        run: node scripts/bun-test.mjs packages/kn-next/src/__tests__/compile-cache-health-bun.test.ts
