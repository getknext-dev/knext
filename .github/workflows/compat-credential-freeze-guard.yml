name: Compat credential freeze guard

# #1302 — the PR-TIME half of ADR-0056's freeze. `.github/compat-credential-ref.json`
# freezes the harness a live credential window (`rcTag` set) hashes; a
# scheduled night only DETECTS a mismatch after the fact, restarting the
# 14-night streak. This gate REFUSES the PR that would have caused it, before
# it merges — unless the pin file carries a dated, reviewed `rcBumpMarker`.
#
# THE PROTECTED FILE SET IS DERIVED, NEVER HARDCODED HERE: `scripts/compat-
# credential-freeze-guard.mjs`'s `frozenFileSet()` reuses `collectHarness()`
# (`scripts/compat-window-fingerprint.mjs`, exported for exactly this) across
# every `CREDENTIAL_CELLS` entry with a `workflowFile` — the SAME derivation
# a real credential night's fingerprint step uses. This file has no list of
# paths to keep in sync. (It also unions in a small, necessarily hardcoded
# self-protection list — the guard's own script/workflow, see `GUARD_SELF_FILES`
# in the script.)
#
# THE FREEZE STATE (rcTag) IS READ AT THE PR'S BASE COMMIT, not its head —
# "was a window ALREADY live before this PR" is the property under test. This
# is what lets the PR that FIRST sets `rcTag` (null -> a real tag) land
# unrestricted: its own base still reads `rcTag: null`. THE MARKER, by
# contrast, is read at HEAD — a PR authorizes itself by adding the marker in
# the same diff, and a base-only read would deadlock that (#1370 review).
#
# THE GUARD RUNS FROM A BASE-COMMIT CHECKOUT OF ITS OWN CODE, not the PR's
# working copy — a PR must not be able to weaken `evaluateFreezeGuard`/
# `frozenFileSet`/`collectHarness` and then have THIS run execute its own
# edited copy against itself (#1370 review, "the PR can rewrite its own
# gate"). See the "Checkout the guard's own code" step below. SCOPE, stated
# honestly (#1370 review round 2): this protects the .mjs SCRIPT only. It
# does NOT protect this YAML FILE itself — GitHub evaluates the workflow
# definition from the PR's own ref regardless, so a PR can still replace
# this whole job body (e.g. one `run: exit 0` step) on its own check. See
# docs/ci/credential-freeze-guard.md's "known limitation" section.
#
# NOT a required check yet — turning it into one is a repo branch-protection
# (Settings) change, which this workflow does not and cannot make. See
# docs/ci/credential-freeze-guard.md for the one manual step a founder still
# owns. It still triggers on `merge_group` regardless (#1370 review) so that,
# the moment it IS made required, the queue does not stall waiting on a check
# that never reports on the queue ref.

on:
  pull_request:
    branches: ['**']
  # See tests/merge-queue-triggers.test.ts's rationale (ci.yml carries the
  # canonical comment): a required check that never triggers on merge_group
  # hangs every PR in AWAITING_CHECKS on the queue ref. This workflow is not
  # required YET, but wiring the trigger now means turning on the Settings
  # requirement later is the ONLY step left, not a follow-up PR too.
  merge_group:

permissions:
  contents: read

jobs:
  freeze-guard:
    name: Freeze guard — .github/compat-credential-ref.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Queue-safe base/head: `pull_request` and `merge_group` carry the SHAs
    # under different event fields. Computed once, at job level, so every
    # step below reads plain $BASE_SHA/$HEAD_SHA shell vars — job-level `env:`
    # is injected into every step's process environment automatically, so
    # this is not a `${{ }}`-in-run: injection point (same safety property as
    # a step-level env:, just declared once).
    env:
      BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Checkout code (full history — needed for the base-commit diff and pin read)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun (workspace install)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      # scripts/compat-window-fingerprint.mjs (imported by the guard, for
      # collectHarness) statically imports `typescript` — a root
      # devDependency. Without this, the guard's own import fails, not the
      # PR under test.
      - name: Install knext deps
        run: bun install --frozen-lockfile

      # Three-dot diff (merge-base...head), not two-dot: a PR's base branch
      # can move after the PR was opened, and a two-dot diff against a moved
      # base would surface files main itself changed as if this PR touched
      # them. `git diff A...B` is exactly "what B changed since it diverged
      # from A", which is the property this gate actually wants (#1370 review).
      #
      # --no-renames is REQUIRED, not cosmetic (#1370 review round 2): with
      # rename detection on (git's default), renaming a frozen file to a new
      # name — `git mv scripts/e2e-cleanup.sh scripts/e2e-cleanup-x.sh` — makes
      # `--name-only` print ONLY the new path. The OLD (frozen) path never
      # appears in changed-files.txt, so the guard never sees it as touched and
      # exits 0 on a live window. `--no-renames` makes git report the rename as
      # a plain delete-of-old + add-of-new, so the frozen path is listed.
      - name: Compute the files this PR changed (base...head)
        id: diff
        run: |
          set -euo pipefail
          git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          echo "changed files in this PR:"
          cat changed-files.txt

      # Read the pin AS OF THE BASE COMMIT — the live-window state before
      # this PR, not whatever this PR's own branch happens to contain (which
      # may itself be the PR that legitimately bumps rcTag for the first
      # time). This decides freeze/unfrozen; it is NOT what the marker is
      # checked against (that's the head read below).
      - name: Read the pin file at the PR's base commit
        run: |
          set -euo pipefail
          # A base commit that predates the pin file (or targets a branch
          # that never had it) has nothing to freeze — write the same
          # "no RC cut yet" shape the guard already treats as unfrozen,
          # rather than failing the whole job on an absent historical file.
          if ! git show "${BASE_SHA}:.github/compat-credential-ref.json" > base-pin.json 2>/dev/null; then
            echo "no pin file at the base commit — treating as unfrozen"
            echo '{"rcTag": null}' > base-pin.json
          fi
          cat base-pin.json

      # Read the pin AS OF THIS PR'S HEAD — the only state a marker THIS PR
      # adds can ever appear in (#1370 review: reading the marker from base
      # deadlocks the very PR that introduces it).
      - name: Read the pin file at the PR's head commit
        run: |
          set -euo pipefail
          if ! git show "${HEAD_SHA}:.github/compat-credential-ref.json" > head-pin.json 2>/dev/null; then
            echo "no pin file at head — treating as unfrozen"
            echo '{"rcTag": null}' > head-pin.json
          fi
          cat head-pin.json

      # A PR must not be able to weaken the guard and have THIS run execute
      # its own edited copy against itself (#1370 review). Check out a
      # SECOND, separate copy of the repo at the base commit and run the
      # guard FROM THERE — `frozenFileSet`/`evaluateFreezeGuard`/
      # `collectHarness` all execute as of base, never as of this PR's head.
      # `base-checkout/` nests inside the already-installed workspace so
      # Node's ancestor node_modules resolution still finds the `typescript`
      # import without a second `bun install`.
      - name: Checkout the guard's own code at the PR's base commit
        run: |
          set -euo pipefail
          git worktree add --detach base-checkout "${BASE_SHA}"

      - name: Run the freeze guard (from the base-commit checkout of its own code)
        run: |
          node base-checkout/scripts/compat-credential-freeze-guard.mjs \
            --repo-root base-checkout \
            --base-pin-file base-pin.json \
            --head-pin-file head-pin.json \
            --changed-files-file changed-files.txt
