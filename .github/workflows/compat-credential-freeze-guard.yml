name: Compat credential freeze guard

# #1302 — the PR-TIME half of ADR-0056's freeze. `.github/compat-credential-ref.json`
# freezes the harness a live credential window (`rcTag` set) hashes; a
# scheduled night only DETECTS a mismatch after the fact, restarting the
# 14-night streak. This gate REFUSES the PR that would have caused it, before
# it merges — unless the pin file carries a dated, reviewed `rcBumpMarker`.
#
# THE PROTECTED FILE SET IS DERIVED, NEVER HARDCODED HERE: `scripts/compat-
# credential-freeze-guard.mjs`'s `frozenFileSet()` reuses `collectHarness()`
# (`scripts/compat-window-fingerprint.mjs`, exported for exactly this) across
# every `CREDENTIAL_CELLS` entry with a `workflowFile` — the SAME derivation
# a real credential night's fingerprint step uses. This file has no list of
# paths to keep in sync.
#
# THE PIN IS READ AT THE PR'S BASE COMMIT, not its head — "was a window
# ALREADY live before this PR" is the property under test. This is what lets
# the PR that FIRST sets `rcTag` (null -> a real tag) land unrestricted: its
# own base still reads `rcTag: null`.
#
# NOT a required check yet — turning it into one is a repo branch-protection
# (Settings) change, which this workflow does not and cannot make. See
# docs/ci/credential-freeze-guard.md for the one manual step a founder still
# owns.

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  freeze-guard:
    name: Freeze guard — .github/compat-credential-ref.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code (full history — needed for the base-commit diff and pin read)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Bun (workspace install)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      # scripts/compat-window-fingerprint.mjs (imported by the guard, for
      # collectHarness) statically imports `typescript` — a root
      # devDependency. Without this, the guard's own import fails, not the
      # PR under test.
      - name: Install knext deps
        run: bun install --frozen-lockfile

      # PR-controlled values (the diff, the base sha) flow through env:, NEVER
      # `${{ }}` inline in run: — a script-injection point, per
      # .claude/rules/security.md / the actionlint.yml precedent this mirrors.
      - name: Compute the files this PR changed (base...head)
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > changed-files.txt
          echo "changed files in this PR:"
          cat changed-files.txt

      # Read the pin AS OF THE BASE COMMIT — the live-window state before
      # this PR, not whatever this PR's own branch happens to contain (which
      # may itself be the PR that legitimately bumps rcTag for the first
      # time, or carries the rcBumpMarker this guard consults below).
      - name: Read the pin file at the PR's base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A base commit that predates the pin file (or targets a branch
          # that never had it) has nothing to freeze — write the same
          # "no RC cut yet" shape the guard already treats as unfrozen,
          # rather than failing the whole job on an absent historical file.
          if ! git show "${BASE_SHA}:.github/compat-credential-ref.json" > base-pin.json 2>/dev/null; then
            echo "no pin file at the base commit — treating as unfrozen"
            echo '{"rcTag": null}' > base-pin.json
          fi
          cat base-pin.json

      - name: Run the freeze guard
        run: |
          node scripts/compat-credential-freeze-guard.mjs \
            --repo-root . \
            --base-pin-file base-pin.json \
            --changed-files-file changed-files.txt
