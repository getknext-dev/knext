name: Escalation triggers

# Enforce the MECHANICALLY DETECTABLE escalation triggers from
# `.claude/rules/workflow.md`.
#
# WHY. The sprint model moved the architect + system-designer gates from per-PR to
# per-sprint and pulls them back only on five triggers. The rules file says plainly
# that three are detectable and that leaving them to self-reporting is the failure
# mode to watch — "rather than relying on someone to self-report against their own
# interest" — and then never implemented it. On 2026-08-11 a breaking CRD + CLI
# change merged with no design gate and no per-PR review; the retroactive review
# found two HIGH defects, one in a safety control. Nothing flagged it because
# nothing was looking.
#
# WHAT THIS IS NOT, per workflow.md's 2026-09-22 amendment: design gates are no
# longer a per-PR merge gate — a PR merges on code review + spec review + CI green.
# A trigger-class concern a reviewer spots becomes a tech-debt backlog item raised at
# sprint close, not a merge blocker. So this check does NOT require a design gate to
# have cleared the change (it used to, and that contradicted the amendment — see
# #1161). It asserts that a trigger-class change was ACKNOWLEDGED: that a human/agent
# consciously noted it, so sprint close can collect it. Two of the five triggers (a
# discovered fact that invalidates the sprint plan; a hard-rule contradiction touching
# no tracked path) remain judgement and unenforced, by the rules' own admission. Three
# of five, not five.
#
# ACKNOWLEDGEMENT MECHANISM, either of:
#   - the `trigger:acknowledged` label (or, backward compatible, the older
#     `design-gate:cleared` label from when this check still required a gate);
#   - a PR-body line: "Escalation trigger acknowledged: <trigger> — <reason>".
# Both are auditable and cheap, because a gate that is expensive to satisfy gets
# routed around instead of obeyed. The point is that noting the trigger must be a
# DECISION someone takes, not the default that happens when nobody looks. When the
# check passes with a trigger fired, it writes the detected triggers (and whether an
# ack was present) to the job summary so sprint close can collect them without
# re-deriving the diff.
#
# FALSE-POSITIVE RATE, MEASURED not assumed: 15% of the last 40 first-parent
# commits, and every one of those is defensible on inspection (including the change
# this check exists because of). See tests/escalation-triggers.test.ts, whose
# "stays quiet on ordinary work" block is what defends that number.

on:
  pull_request:
    branches: ['**']
    # `edited` IS REQUIRED: the PR-body acknowledgement line is one of the two
    # acknowledgement mechanisms (the other is a label), and a label edit already
    # re-triggers via `labeled`/`unlabeled`. Without `edited`, adding the body line
    # to an ALREADY-OPEN PR never re-runs this check, so a PR that acknowledges by
    # body alone stays red until an unrelated push happens to retrigger it — caught
    # in review on #1804 (round 2). Guarded by tests/escalation-triggers.test.ts.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  # This job posts the REQUIRED "Escalation triggers acknowledged" context, so it
  # must report on the merge queue's `refs/heads/gh-readonly-queue/main/...` ref via
  # `merge_group` or the queue hangs. The trigger check itself CANNOT run there —
  # there is no `pull_request` payload (base/head SHA, labels) to diff against, and
  # the acknowledgement was already decided at PR time — so on merge_group the job
  # runs a single no-op step and reports success (see the step guards below).
  # Guarded by tests/merge-queue-triggers.test.ts.
  merge_group:

# `edited` (body edit) and `synchronize` (push) can land close together on the same
# PR and race to post the same required context. Cancel the in-progress PR run when
# a newer one starts so they don't fight over the status; NEVER cancel a merge_group
# run — that ref only runs once per queue entry and a cancelled report there hangs
# the queue.
concurrency:
  # Deliberately WITHOUT `github.event_name` in the group key: an `edited` run and a
  # `synchronize` run on the SAME PR must share a group so the older one gets
  # cancelled, not race it in a sibling group. `github.event.pull_request.number` is
  # unset on `merge_group`, where it falls back to `github.ref` (the queue's own
  # unique ref), so merge_group entries never collide with a PR's group or each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  escalation-triggers:
    name: Escalation triggers acknowledged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # On merge_group there is no pull_request payload to diff and the check was
      # already satisfied at PR time; this no-op posts the required context green so
      # the queue is not hung by a check that cannot meaningfully re-run here.
      - name: Acknowledge on merge_group (no-op — checked at PR time)
        if: github.event_name == 'merge_group'
        run: echo "merge_group event - escalation triggers were checked at PR time; nothing to re-check on the merged ref."

      - name: Checkout (full history — the check diffs against the merge base)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No `${{ }}` inside the script body: the PR's labels and body are
      # attacker-influenced text (anyone who can label/edit the PR can set them), so
      # they arrive via env and are read as data. Interpolating them into the shell
      # would be an injection.
      - name: Check for unacknowledged escalation triggers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          node scripts/check-escalation-triggers.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --labels "$PR_LABELS" \
            --body "$PR_BODY"
