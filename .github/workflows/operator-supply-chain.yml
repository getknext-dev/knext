name: Operator Supply Chain

# Issue #76: publish + sign the kn-next-operator image and ship an installable bundle.
#
# Mirrors .github/workflows/supply-chain.yml (the APP image, #48): SBOM per image ·
# Trivy scan + FAIL on HIGH/CRITICAL on main (report-only on PRs) · cosign keyless
# sign + SBOM attestation. Build/scan run on every PR; push + sign only on main
# (no signing throwaway PR images).
#
# ORDERING INVARIANT (#201, same class as the app fix in #199/#200):
# build (local) → SBOM → Trivy gate → push → sign → verify → installer pin →
# release attach. The image is built into a LOCAL OCI layout and scanned
# there; it is pushed to GHCR only AFTER the Trivy HIGH/CRITICAL gate passes,
# cosign signs the digest of the image that was actually pushed, and the
# dist/install.yaml release asset bakes in that SAME post-gate pushed digest.
# A scan-failed operator image is therefore never pullable at a stable tag,
# never signed, and never referenced by the operator-latest release bundle.
# (The previous flow pushed on main at BUILD time, before the scan.)
# Guarded by tests/operator-supply-chain-workflow.test.ts.
#
# PROVENANCE RESTORE (#202): the first scan-before-push flow (#203) used the
# local `docker` exporter (load: true), which cannot carry buildkit's provenance
# attestation manifest — so provenance was dropped. Now the build exports an OCI
# layout DIRECTORY (which CAN carry the attestation), Trivy scans that exact
# layout (--input), and `crane push` publishes it byte-for-byte, preserving the
# SLSA provenance manifest. A post-push step asserts the attestation actually
# survived before anything is signed. Same gate, provenance back.
#
# Bootstrap (#76): the operator image at ghcr.io/getknext-dev/kn-next-operator does
# not exist until the FIRST push to main runs this job. Before that, the manager
# manifests carry a clearly-fake all-zeros placeholder digest (which still passes
# hack/check-no-latest.sh — that guard rejects :latest, not unreachable digests).
# After the push, the "Build installer + pin real digest" step rewrites
# dist/install.yaml with the real pushed digest and attaches it to the GitHub
# Release tagged `operator-latest`. Docs address that asset by its OWN tag
# (releases/download/operator-latest/install.yaml) and must keep doing so —
# see the note on the release step below for why /releases/latest/ is not usable.
#
# Path discipline (review fix): this job does NOT set a run.working-directory
# default. A job-level default only applies to `run:` steps, NOT to `uses:` action
# steps — so an action like anchore/sbom-action would write its output-file to
# $GITHUB_WORKSPACE (repo root) while a `run:` step (cosign attest) would look in the
# subdir, and the paths would silently diverge. Instead every `run:` step uses
# explicit `packages/kn-next-operator/...` paths, and the SBOM output-file is a
# single repo-root path referenced identically by upload + attest.
#
# Required permissions/secrets (documented for operators):
#   - packages: write  → push to GHCR (uses the built-in GITHUB_TOKEN)
#   - id-token: write  → cosign keyless signing via OIDC (Sigstore/Fulcio)
#   - contents: write  → create/update the GitHub Release that carries install.yaml
#   No extra repo secrets are needed; GITHUB_TOKEN is sufficient for GHCR + OIDC +
#   Releases.
#
# SEMVER RELEASE LINE (#1667): this job also runs on a pushed `operator-vX.Y.Z`
# tag (including rc/prerelease tags), reusing this SAME publisher — there is no
# second workflow. `hack/release-channel.sh` (unit-tested directly, see
# tests/operator-release-channel.test.ts) turns the triggering ref into a
# channel: a version tag publishes its OWN immutable release
# (`operator-vX.Y.Z[-rc.N]`), and ONLY a stable (non-prerelease) tag also
# re-points the `operator-latest` release. A plain push to `main` no longer
# moves `operator-latest` at all — it publishes to the rolling `operator-edge`
# channel instead, so "upgrade to latest" always means a real cut release, not
# whatever HEAD happened to build last. Every step downstream of the Trivy gate
# is now conditioned on `steps.channel.outputs.publish`, not a literal
# `github.ref == 'refs/heads/main'` check.
#
# `check-release-immutable.sh` runs before anything is built (#1667 review
# round 2): softprops/action-gh-release UPDATES an existing release for a
# given tag rather than refusing to touch one, so a re-pushed/force-moved
# operator-vX.Y.Z tag could otherwise silently overwrite a previously
# published install.yaml. It fails the run if a release for that tag already
# carries an install.yaml asset. Scoped to real version tags only —
# operator-edge/operator-latest are mutable by design.
#
# PATHS FILTERING (#1667 review round 2): GitHub evaluates a single `paths:`
# filter against every ref a `push:` trigger matches — there is no way, in one
# `on.push` block, to apply `paths` to `branches: [main]` while leaving
# `tags: ['operator-v*']` unfiltered, and a tag push may legitimately repoint
# at a commit whose own diff doesn't touch these paths. So `push.paths` is
# NOT set on the trigger; instead the `changes` job below restores
# paths-filter behavior for MAIN pushes only (via `hack/path-relevant.sh`,
# a real `git diff`, unit-tested in tests/operator-path-relevant.test.ts) and
# unconditionally treats every `operator-v*` tag push (and every non-push
# event) as relevant. The main job's `if:` reads `needs.changes.outputs.relevant`.
#
# `changes` ALWAYS runs, for every event (#1667 review round 3). It used to
# carry `if: github.event_name == 'push'`, which meant the job was SKIPPED —
# not "ran and reported relevant=false" — on pull_request. A `needs:` on a
# SKIPPED job propagates the skip to the dependent job by default (GitHub's
# `if:` on a dependent job defaults to `success()`, which a skipped need does
# not satisfy), so `operator-image-supply-chain` — the Trivy/SBOM gate — was
# silently skipped on every PR. Making `changes` unconditional (and reporting
# relevant=true for any non-push event, since `pull_request.paths` already
# scopes PRs natively) closes that hole without reintroducing `always()`
# logic in the dependent job's `if:`.
#
# CONCURRENCY (#1667 review round 3): grouped by ref so two runs for the SAME
# `operator-vX.Y.Z` tag (or the same branch) can never run concurrently — the
# immutability guard above reads "does a release already exist" and then
# publishes; two racing runs on the same ref could both observe "no release
# yet" and then both attempt to create/attach one. `cancel-in-progress: false`
# because this is a publish path: an in-flight publish must be allowed to
# finish, not be cancelled mid-way through pushing/signing an image.

on:
  pull_request:
    paths:
      - 'packages/kn-next-operator/**'
      - '.github/workflows/operator-supply-chain.yml'
  push:
    branches: [main]
    tags:
      - 'operator-v*'
  workflow_dispatch:

permissions:
  contents: read

# See the CONCURRENCY note above the `on:` block.
concurrency:
  group: operator-supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Restores push.paths-filter behavior for MAIN pushes only (see the PATHS
  # FILTERING note above). Runs UNCONDITIONALLY for every event — see the
  # note above the `on:` block for why a push-only `if:` here silently
  # skipped the Trivy/SBOM gate on every PR.
  changes:
    name: Detect operator-relevant changes (main pushes only; always relevant otherwise)
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether this push touched operator-relevant paths
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "push" ]]; then
            # pull_request is already scoped by the pull_request.paths filter
            # on the trigger above; workflow_dispatch is an explicit manual
            # run. Neither is gated by this job's path check.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif [[ "${REF}" == refs/tags/operator-v* ]]; then
            # Tag pushes are always relevant — never gated by paths.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            RELEVANT="$(bash packages/kn-next-operator/hack/path-relevant.sh "${BEFORE_SHA}" "${AFTER_SHA}" .)"
            echo "relevant=${RELEVANT}" >> "$GITHUB_OUTPUT"
          fi

  operator-image-supply-chain:
    name: Operator SBOM + Trivy (+ cosign sign on main)
    needs: [changes]
    # `changes` runs unconditionally (see the note above the `on:` block), so
    # its output is always defined — no `always()`/event-name fallback needed
    # here, and a genuinely failed/skipped `changes` run correctly skips this
    # job too (the default `success()` behavior for a `needs:` dependency).
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the GitHub Release that carries install.yaml
      packages: write # push to GHCR on main
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Determines the release channel from the triggering ref (#1667): a
      # stable version tag / an rc-or-other prerelease tag / a main push
      # (operator-edge) / anything else (no publish). Every publish-gated step
      # below reads steps.channel.outputs.* instead of re-deriving this.
      - name: Determine release channel (#1667)
        id: channel
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: bash packages/kn-next-operator/hack/release-channel.sh "${REF}" "${REF_NAME}" >> "$GITHUB_OUTPUT"

      # Enforces that operator-vX.Y.Z releases are ACTUALLY immutable, not just
      # documented as such (#1667): softprops/action-gh-release UPDATES an
      # existing release for a given tag_name rather than refusing to touch
      # one, so a re-pushed/force-moved version tag could otherwise silently
      # overwrite a previously published install.yaml. Runs early (before the
      # multi-arch build) so a doomed re-publish fails fast. Deliberately
      # scoped to a real version tag — operator-edge/operator-latest stay
      # mutable by design (a rolling channel and a stable-tracking pointer).
      - name: Guard operator-vX.Y.Z release immutability (#1667)
        if: steps.channel.outputs.is_version_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packages/kn-next-operator/hack/check-release-immutable.sh "${{ github.repository }}" "${{ steps.channel.outputs.release_tag }}"

      # GHCR repository names must be lowercase; the owner can be mixed-case.
      # ${OWNER,,} lowercases it (mirrors the app job — fixes the #48 casing bug).
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kn-next-operator" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      # QEMU for the arm64 half of the multi-arch build (Go cross-compiles fast;
      # the emulated stage is only the distroless assembly).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into a LOCAL OCI-layout directory on every ref — never push here.
      # The Trivy gate below scans this exact layout; publication (main & release tags)
      # happens in the explicit crane-push step AFTER the gate. This is what
      # guarantees a scan-failed operator image is never pullable at a stable
      # tag (#201). The OCI layout — unlike the `docker` exporter used before —
      # CAN carry buildkit's provenance attestation manifest, which restores the
      # SLSA provenance dropped in #203 (#202). tar=false because Trivy's
      # --input accepts an OCI layout directory but not an OCI tarball.
      - name: Build operator image (local OCI layout — pushed after the Trivy gate)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/kn-next-operator
          file: packages/kn-next-operator/Dockerfile
          # amd64 + arm64 (#iteration-7 finding): the image was amd64-only, so an
          # Apple-Silicon laptop — the exact persona of the first-cluster docs
          # page — got "no matching manifest" on a local kind cluster. Trivy
          # scans and cosign signs the same multi-arch OCI layout below.
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          outputs: type=oci,dest=operator-oci,tar=false
          # mode=max records the full build definition + materials. Safe here:
          # this build takes no build-args at all, so nothing secret can be
          # recorded into the attestation.
          provenance: mode=max

      # syft cannot parse buildx's nested OCI index (the image + attestation
      # manifests are wrapped in a second index), so give it a flattened VIEW of
      # the SAME layout: symlinked blobs (identical bytes), the nested index
      # promoted to index.json with only the attestation entry dropped. The
      # image-manifest digest is unchanged, so the SBOM provably describes the
      # same image the gate scans and crane pushes. SBOM-only — the Trivy GATE
      # scans the real layout directly.
      - name: Prepare SBOM view of the OCI layout (syft can't parse nested indexes)
        run: |
          set -euo pipefail
          NESTED="$(jq -r '.manifests[0].digest' operator-oci/index.json | cut -d: -f2)"
          mkdir operator-oci-sbom
          ln -s "$(pwd)/operator-oci/blobs" operator-oci-sbom/blobs
          cp operator-oci/oci-layout operator-oci-sbom/
          # Multi-arch: after dropping attestation manifests the index still holds
          # one image manifest PER PLATFORM, and syft refuses an oci-dir with more
          # than one ("found 2"). The SBOM view selects the amd64 manifest — the
          # arm64 binary is cross-compiled from the SAME go.sum module inputs in
          # the same build, so one SBOM describes both arches' contents; the
          # Trivy GATE still scans the real multi-arch layout directly.
          jq '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json",
               manifests: [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                                        | select((.platform.architecture // "amd64") == "amd64")]}' \
            "operator-oci/blobs/sha256/${NESTED}" > operator-oci-sbom/index.json
          test "$(jq '.manifests | length' operator-oci-sbom/index.json)" = "1" || {
            echo "SBOM view must hold exactly one manifest" >&2; exit 1; }

      # AWS Marketplace-bound variant (#1954). Marketplace rejects an image index
      # that carries attestation (in-toto) manifests, and the GHCR index above
      # does by design (provenance: mode=max — those images keep it). This does
      # NOT rebuild: it writes a second index over the SAME platform manifests
      # (same digests, so provably the same config + layers) with the
      # attestation entries removed. Local file work only, safe on every ref, and
      # self-checks its output; the publish/prove/sign steps further down run on
      # version tags only. Nothing is pushed to any Marketplace registry here.
      - name: Derive attestation-free Marketplace index (#1954)
        run: bash packages/kn-next-operator/hack/marketplace-index-build.sh operator-oci operator-oci-mp

      # output-file is resolved relative to $GITHUB_WORKSPACE (repo root) for a
      # `uses:` step. This is the single canonical SBOM path; upload + attest below
      # reference the SAME path so they never diverge.
      - name: Generate SBOM (syft, SPDX-JSON)
        # SHA-pinned (#202): sbom-action runs in a job with packages:write +
        # id-token:write, so a mutable tag is a supply-chain hole. v0.24.0.
        # The oci-dir: source is passed verbatim to syft (verified against the
        # pinned action source) — the image no longer exists in the docker daemon.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: oci-dir:operator-oci-sbom
          format: spdx-json
          output-file: operator-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-sbom-${{ github.sha }}
          path: operator-sbom.spdx.json

      - name: Trivy scan — FAIL on HIGH/CRITICAL
        # ENFORCING on every PUBLISHING run (#1667 review round 4) — not just
        # `main`. The old literal (`github.ref != 'refs/heads/main'`) meant a
        # failing scan was SWALLOWED on an operator-vX.Y.Z tag push (any ref
        # other than exactly `refs/heads/main`), and the image was pushed,
        # cosign-signed, and attached to an IMMUTABLE release anyway — the
        # supply-chain gate was decorative on the one channel that most needs
        # it. `steps.channel.outputs.publish` is the single source of truth
        # for "this run intends to publish" (main push, operator-edge; any
        # operator-vX.Y.Z tag) — advisory (continue-on-error) only when
        # NOTHING downstream publishes (an ordinary PR).
        continue-on-error: ${{ steps.channel.outputs.publish != 'true' }}
        # `id: trivy` (#1667 round 4): continue-on-error masks `conclusion`
        # (it always reports success there) — every push/sign/release step
        # below must additionally gate on `steps.trivy.outcome == 'success'`,
        # which reflects the REAL pass/fail regardless of continue-on-error.
        id: trivy
        # SHA-pinned (#202): this action is the publish GATE in a job holding
        # packages:write + id-token:write — a compromised mutable @master could
        # push/sign with this repo's OIDC identity. v0.36.0.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: operator-oci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      # ── Everything below runs ONLY after the Trivy gate passed — both that
      # it was intended to publish (steps.channel.outputs.publish) AND that
      # the scan itself actually succeeded (steps.trivy.outcome), which
      # continue-on-error above cannot hide (#1667 round 4). ────────────────

      - name: Log in to GHCR
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # crane pushes the OCI layout (docker push can't — the daemon store drops
      # the attestation manifest). Pinned to an exact version AND a sha256 of
      # the release tarball: crane is now on the publish path in a job holding
      # packages:write + id-token:write, the same discipline that SHA-pinned
      # trivy-action/sbom-action (#202).
      - name: Install crane (version + checksum pinned)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        env:
          CRANE_VERSION: v0.21.7
          # sha256 of go-containerregistry_Linux_x86_64.tar.gz from the v0.21.7
          # release's checksums.txt (github.com/google/go-containerregistry).
          CRANE_SHA256: 1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          sudo install -m 0755 /tmp/crane /usr/local/bin/crane
          crane version

      # Publish the EXACT bytes that were scanned: `crane push` the gated OCI
      # layout (no rebuild — a rebuild could diverge from what Trivy approved),
      # preserving the buildkit provenance manifest the docker store would drop.
      # crane prints the pushed `ref@digest` on stdout; capture it as the step
      # output that parameterizes signing, verification AND the install.yaml
      # digest pin below, and fail loud if it doesn't parse (we must never sign
      # — or bake into the release bundle — a guessed digest).
      - name: Push operator image (publish channel, after the Trivy gate)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        id: push
        run: |
          set -euo pipefail
          PUSHED_REF="$(crane push operator-oci "${IMAGE}:${GITHUB_SHA}")"
          DIGEST="${PUSHED_REF##*@}"
          if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve the pushed digest for ${IMAGE}:${GITHUB_SHA} (crane output: ${PUSHED_REF}) — refusing to sign"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST}"

      # The point of the OCI-layout + crane flow (#202): prove the buildkit
      # provenance attestation actually survived the push — and only sign
      # provenance-bearing images. Fails loud if the pushed index carries no
      # attestation manifest or the attestation has no SLSA provenance predicate.
      - name: Verify buildkit provenance survived the push (publish channel)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          ATT_DIGEST="$(crane manifest "${IMAGE}@${DIGEST}" \
            | jq -re '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")][0].digest')" || {
            echo "::error::pushed image ${IMAGE}@${DIGEST} carries NO buildkit attestation manifest"
            exit 1
          }
          crane manifest "${IMAGE}@${ATT_DIGEST}" \
            | jq -re '[.layers[] | select(.annotations["in-toto.io/predicate-type"] | test("slsa.dev/provenance"))][0]' > /dev/null || {
            echo "::error::attestation manifest ${ATT_DIGEST} carries no SLSA provenance predicate"
            exit 1
          }
          echo "Buildkit SLSA provenance present: ${IMAGE}@${ATT_DIGEST}"

      - name: Install cosign
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # No working-directory default: this `run:` step executes at repo root, so it
      # references the SAME operator-sbom.spdx.json that the sbom-action wrote there.
      - name: Sign image + attest SBOM (keyless)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --predicate operator-sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      # Verify the signature we just produced, parameterized by the pushed digest
      # (issue #117). This proves the keyless identity/issuer round-trips before we
      # advertise the image as signed, and exercises the same hack/cosign-verify.sh
      # a client runs. The identity-regexp/issuer default to this repo's signer.
      - name: Verify operator image signature (cosign verify, publish channel)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        env:
          IDENTITY_REGEXP: https://github.com/${{ github.repository }}/.*
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash packages/kn-next-operator/hack/cosign-verify.sh "${IMAGE}@${DIGEST}"

      # Marketplace-bound index (#1954), version tags only. Pushed under a
      # throwaway `<sha>-mp` tag FIRST, because the proof below reads the
      # registry (not local files); the user-visible `vX.Y.Z-mp` tag is applied
      # only by the last of these four steps, after the assertion and signature,
      # so a failed run leaves no `-mp` release tag behind. The platform blobs
      # already exist in the repository, so this uploads one small index.
      - name: Push Marketplace index (version tags only, #1954)
        if: steps.channel.outputs.is_version_tag == 'true' && steps.trivy.outcome == 'success'
        id: push_mp
        run: |
          set -euo pipefail
          PUSHED_REF="$(crane push operator-oci-mp "${IMAGE}:${GITHUB_SHA}-mp")"
          DIGEST="${PUSHED_REF##*@}"
          if ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve the pushed Marketplace index digest (crane output: ${PUSHED_REF}) — refusing to sign"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}@${DIGEST} (Marketplace-bound, no attestation manifests)"

      # The acceptance proof, against the registry: the Marketplace index has no
      # attestation manifest and its platform manifests carry the SAME config +
      # layer digests as the gated, signed image. Fails the run otherwise.
      - name: Assert Marketplace index has no attestations and identical bits (#1954)
        if: steps.channel.outputs.is_version_tag == 'true' && steps.trivy.outcome == 'success'
        env:
          GATED_DIGEST: ${{ steps.push.outputs.digest }}
          MP_DIGEST: ${{ steps.push_mp.outputs.digest }}
        run: bash packages/kn-next-operator/hack/marketplace-index-assert.sh "${IMAGE}@${GATED_DIGEST}" "${IMAGE}@${MP_DIGEST}"

      # The Marketplace index is a different index digest than the gated one, so
      # it gets its own keyless signature (same OIDC identity as the gated image).
      # The platform manifests underneath are the already-signed gated ones.
      - name: Sign + verify Marketplace index (version tags only, #1954)
        if: steps.channel.outputs.is_version_tag == 'true' && steps.trivy.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: "1"
          IDENTITY_REGEXP: https://github.com/${{ github.repository }}/.*
          MP_DIGEST: ${{ steps.push_mp.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${MP_DIGEST}"
          bash packages/kn-next-operator/hack/cosign-verify.sh "${IMAGE}@${MP_DIGEST}"

      - name: Tag the Marketplace index (version tags only, #1954)
        if: steps.channel.outputs.is_version_tag == 'true' && steps.trivy.outcome == 'success'
        env:
          GATED_DIGEST: ${{ steps.push.outputs.digest }}
          MP_DIGEST: ${{ steps.push_mp.outputs.digest }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          crane tag "${IMAGE}@${MP_DIGEST}" "v${VERSION}-mp"
          echo "Tagged ${IMAGE}@${MP_DIGEST} as v${VERSION}-mp"
          {
            echo "### Marketplace-bound operator image (not yet pushed to any Marketplace registry)"
            echo "- \`${IMAGE}:v${VERSION}-mp\` = \`${MP_DIGEST}\`"
            echo "- same platform manifests as \`${IMAGE}@${GATED_DIGEST}\`, no attestation manifests"
          } >> "$GITHUB_STEP_SUMMARY"

      # ORDERING (#1954 review): both release tags are applied LAST, after the
      # Marketplace index has been pushed, asserted, signed and verified. The
      # gated `vX.Y.Z` tag used to land before those steps, so a failure in any
      # of them left `vX.Y.Z` tagged with no release, and a re-run (new build,
      # new digest) would have moved the immutable tag. The gated tag below is
      # the last registry mutation: nothing that can fail runs after it.
      # Version tags only (#1947): make the `vX.Y.Z` image tag the bundle will
      # carry (hack/stamp-release-version.sh) a REAL registry tag on the exact
      # gated digest, so `image: …:vX.Y.Z@sha256:…` is not a label that lies.
      # The digest still decides what runs; the tag is for humans and `knext
      # doctor`. Runs only AFTER the Trivy gate, the push, the provenance check,
      # the cosign sign AND the cosign verify: a version tag must never land on
      # an unsigned or unverified digest, and (the release is immutable) a
      # failed run therefore leaves no `:vX.Y.Z` behind for a re-run to re-point.
      - name: Tag the verified digest with the release version (version tags only, #1947)
        if: steps.channel.outputs.is_version_tag == 'true' && steps.trivy.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          crane tag "${IMAGE}@${DIGEST}" "v${VERSION}"
          echo "Tagged ${IMAGE}@${DIGEST} as v${VERSION}"

      # On the publish channel (main or an operator-v* tag): regenerate dist/install.yaml with the REAL pushed digest. This is
      # the bootstrap-resolution step — the placeholder all-zeros digest in the
      # committed manifests is replaced here with the digest cosign just signed.
      # MUST consume the POST-gate pushed digest (steps.push.outputs.digest, #201):
      # this step only runs after the Trivy gate + push + sign + verify all passed,
      # so a scan-failed run can never refresh the operator-latest release asset.
      # This `run:` step runs at repo root, so it cd's into the operator package.
      # Version tags only (#1947): write the release version into the two
      # places a client can read it back from the cluster — the image tag in the
      # kustomization and the app.kubernetes.io/version label on the manager
      # Deployment. MUST run before the render below. Fails loud (and changes
      # nothing) if either anchor has drifted. `main` / operator-edge builds keep
      # the committed `unreleased` sentinel: they never claim a version.
      - name: Stamp the release version into the bundle sources (version tags only, #1947)
        if: steps.channel.outputs.is_version_tag == 'true' && steps.trivy.outcome == 'success'
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: bash packages/kn-next-operator/hack/stamp-release-version.sh "${VERSION}"

      - name: Build installer + pin real digest (publish channel)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cd packages/kn-next-operator
          # Pin the real digest into the manager kustomization (single combined
          # newTag form, so hack/check-no-latest.sh stays happy), then render.
          # The tag part is matched loosely (`v[^@ ]+`) so a prerelease tag
          # (v1.2.3-rc.1) is re-pinned too — the strict vN.N.N form silently
          # skipped it. `sed -i` here is GNU (ubuntu runner).
          sed -i -E \
            "s|(newTag: v[^@[:space:]]+@sha256:)[0-9a-f]{64}|\\1${DIGEST#sha256:}|" \
            config/manager/kustomization.yaml
          make build-installer
          echo "Pinned operator image digest ${DIGEST} into dist/install.yaml:"
          grep -E 'image: ghcr' dist/install.yaml
          # Gate-review advisory (#203): the bundle MUST carry the exact signed
          # digest — if the sed pattern ever stops matching (kustomization
          # format drift), a stale previously-pinned digest would ship silently.
          grep -q "${DIGEST}" dist/install.yaml || { echo "::error::dist/install.yaml does not contain the signed digest ${DIGEST}"; exit 1; }
          bash hack/check-no-latest.sh
          # PUBLISHED-CONTEXT guard (#117): now that the real digest is pinned, the
          # all-zeros bootstrap placeholder must be GONE from the rendered bundle.
          # If the re-pin silently failed we'd otherwise publish a bundle pointing at
          # a non-existent image — this fails the run instead.
          bash hack/check-published-digest.sh dist/install.yaml

      # Version tags only (#1947): the per-release, self-describing asset
      # `install-vX.Y.Z.yaml` — the same digest-pinned bytes as `install.yaml`
      # (kept under both names so existing `…/install.yaml` URLs keep working),
      # re-checked here so the file a client pins is itself proven digest-pinned
      # and to carry the version it is named for. The step output feeds the
      # release step's `files:`; for operator-edge it is empty (no extra asset).
      - name: Write install-vX.Y.Z.yaml (version tags only, #1947)
        id: versioned_asset
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.channel.outputs.version }}
          IS_VERSION_TAG: ${{ steps.channel.outputs.is_version_tag }}
        run: |
          set -euo pipefail
          if [[ "${IS_VERSION_TAG}" != "true" ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd packages/kn-next-operator
          cp dist/install.yaml "dist/install-v${VERSION}.yaml"
          bash hack/check-published-digest.sh "dist/install-v${VERSION}.yaml"
          grep -q "kn-next-operator:v${VERSION}@${DIGEST}" "dist/install-v${VERSION}.yaml" || {
            echo "::error::dist/install-v${VERSION}.yaml does not carry image tag v${VERSION} pinned to ${DIGEST}"; exit 1; }
          # kustomize may or may not quote the scalar when it renders the bundle.
          grep -Eq "app\.kubernetes\.io/version: \"?${VERSION//./\\.}\"?\$" "dist/install-v${VERSION}.yaml" || {
            echo "::error::dist/install-v${VERSION}.yaml does not carry the version label ${VERSION}"; exit 1; }
          echo "path=packages/kn-next-operator/dist/install-v${VERSION}.yaml" >> "$GITHUB_OUTPUT"

      # Transient CI artifact (auth-gated) — handy for inspecting the exact bundle a
      # run produced, but NOT the user-facing install path.
      - name: Upload install.yaml artifact (main + release tags only)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-install-bundle-${{ github.sha }}
          path: packages/kn-next-operator/dist/install.yaml

      # User-facing install path (#1667): attach the digest-pinned bundle to a
      # GitHub Release tagged with the CHANNEL — `operator-vX.Y.Z[-rc.N]` for a
      # version tag (a fresh tag every time, so this release is immutable: the
      # same tag is never re-pushed), or the rolling `operator-edge` channel for
      # a plain `main` push. `make_latest: "false"` here — the repo's default
      # view is decided by the operator-latest step below, only for stable tags.
      #
      # `make_latest` on ANY release here does NOT make
      # `/releases/latest/download/install.yaml` a dependable URL, and the docs
      # must not use it. GitHub resolves /releases/latest/ to the most RECENTLY
      # PUBLISHED release repo-wide — and this repo also cuts npm package
      # releases (`@getknext/core@…`, `@getknext/db@…`). Each of those steals
      # the pointer, and they carry no assets, so the URL returns 404 until the
      # next operator publish. Docs address every asset by its OWN tag
      # (`releases/download/<channel>/install.yaml`), which no other release
      # can steal.
      - name: Publish install.yaml to its channel release (#1667)
        if: steps.channel.outputs.publish == 'true' && steps.trivy.outcome == 'success'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.channel.outputs.release_tag }}
          name: kn-next-operator ${{ steps.channel.outputs.release_tag }}
          make_latest: "false"
          # install.yaml (compat name) + install-vX.Y.Z.yaml (version tags only;
          # the blank line is the operator-edge case and is ignored).
          files: |
            packages/kn-next-operator/dist/install.yaml
            ${{ steps.versioned_asset.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only a STABLE (non-prerelease) operator-vX.Y.Z tag also re-points
      # operator-latest (#1667) — a plain main push no longer does, and neither
      # does an rc/prerelease tag. This is the one release object in the flow
      # that IS mutable by design: "install the latest operator" always means
      # the newest cut stable version, re-published to this same tag.
      - name: Move operator-latest to this stable release (#1667)
        if: steps.channel.outputs.is_stable == 'true' && steps.trivy.outcome == 'success'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: operator-latest
          name: kn-next-operator (latest)
          make_latest: "true"
          files: packages/kn-next-operator/dist/install.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
