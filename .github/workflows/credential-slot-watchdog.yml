name: Credential-slot watchdog

# ── #1640 — alert on a late or missing compat CREDENTIAL scheduled run ───────
#
# PROBLEM. GitHub fires scheduled runs late: the 4 compat credential crons in
# `.github/workflows/test-e2e-deploy.yml` ran 2.5-6.6h after their slot this
# week (the bun credential slot, 05:47 UTC, ran at 12:00). The window audit's
# missing-night grace (`MISSING_NIGHT_GRACE_HOURS` in
# scripts/compat-window-audit.mjs, currently 6h) can void a credential night
# on a late-enough or genuinely dropped run — and nobody hears about it until
# the audit reads the gap, which can be days later.
#
# THIS WORKFLOW is a NEW, standalone check — deliberately NOT added to
# test-e2e-deploy.yml, which is frozen (owned by a concurrent change). It runs
# a few hours after each credential slot, asks only whether that lane's
# scheduled run exists and has started, and raises the standard pinned alert
# (scripts/nightly-alert-issue.mjs) when it has not.
#
# READ-ONLY, BY DESIGN. The check step below only ever calls `gh api ...
# runs?event=schedule` (a GET) — it never dispatches, cancels, reruns, or
# otherwise writes to test-e2e-deploy.yml or its runs. `permissions:` on the
# check job is `contents: read` + `actions: read` (read-only surfaces only);
# only the alert job gets `issues: write`, matching every other nightly alert
# in this repo (see action-pin-resolution-nightly.yml).
#
# LANE DISCOVERY IS RUNTIME, NOT A SECOND HARDCODED COPY.
# `scripts/lib/credential-slot-watchdog.mjs` parses the 4 credential-lane cron
# literals out of test-e2e-deploy.yml's own `env.KNEXT_COMPAT_MODE` /
# `env.KNEXT_LANE` expressions at run time (never duplicating them as a
# maintained literal here) and FAILS CLOSED — alerts, never silently
# substitutes a hardcoded table — if that parsing fails.
#
# LANE ATTRIBUTION prefers an EXACT signal: test-e2e-deploy.yml's root job
# unconditionally publishes `compat-lane-<lane>` / `compat-mode-<mode>` marker
# artifacts as its first step, and this script reads them (never downloaded)
# the same way scripts/compat-window-audit.mjs does. Only when that marker is
# missing/unreadable does it fall back to nearest-prior-slot-time matching,
# and that fallback now refuses to let an ambiguous match (a run that could
# equally belong to a neighbouring lane whose own run is otherwise
# unaccounted for) satisfy either lane's "quiet" verdict — it alerts
# `ambiguous` instead. See that file's module header for the full design.
#
# THE SCHEDULE BELOW (ADR-0056 Amendment 5). Every credential lane now fires
# THREE times a day, 8 h apart (node 01/09/17:17, bun 05/13/21:47,
# node-webpack 06/14/22:17, bun-webpack 07/15/23:47 UTC). Each run of this
# watchdog checks every lane's latest DUE fire — the latest at or before
# now - grace (DEFAULT_GRACE_HOURS = 8 in scripts/lib/credential-slot-watchdog.mjs).
# Because this workflow also fires every 8 h, each check covers exactly one
# fire per lane and every fire is checked exactly once, whatever the grace
# (tests/credential-slot-watchdog.test.ts proves it on these crons). 01:25 /
# 09:25 / 17:25 sit 8 min after the node fires' grace ends, so each check
# covers the four fires that came due since the previous one:
#   check 09:25 covers bun 05:47, node-webpack 06:17, bun-webpack 07:47 and
#   node 01:17 (each + 8 h); 17:25 and 01:25 cover the next two bands.

on:
  workflow_dispatch:
    inputs:
      graceHours:
        description: >-
          Override the grace-period hours after a slot before alerting
          (default 8, DEFAULT_GRACE_HOURS in scripts/lib/credential-slot-watchdog.mjs).
          Dispatch-only: schedule events never carry inputs, so a cron-triggered
          run always uses this repo's CREDENTIAL_WATCHDOG_GRACE_HOURS variable
          if set, else the script's own default.
        required: false
        type: string
        default: ''
  schedule:
    - cron: '25 1,9,17 * * *'

permissions:
  contents: read

jobs:
  # ── Check: read-only, never dispatches ──────────────────────────────────
  check-credential-slots:
    name: Check the 4 credential-lane slots for a missing/queued-too-long run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `setup-node`/`bun install`: both scripts are dependency-free ESM
      # on the runner's built-in Node (same convention as
      # action-pin-resolution-nightly.yml's resolve-action-pins job) — this
      # workflow cannot itself become a supply-chain surface while watching
      # for a scheduling problem elsewhere.
      - name: Check credential-lane slots (read-only; never dispatches a run)
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_GRACE_HOURS: ${{ github.event.inputs.graceHours || vars.CREDENTIAL_WATCHDOG_GRACE_HOURS || '' }}
        run: node scripts/credential-slot-watchdog.mjs

  # ── Idempotent pinned alert (same pattern as action-pin-resolution-nightly.yml) ──
  slot-watchdog-alert:
    name: Credential-slot watchdog alert (pinned issue)
    needs: [check-credential-slots]
    # #1645 — a cancelled/timed-out check job (runner loss, its own
    # timeout-minutes) must alert exactly like a failed one; checking only
    # 'failure' silently drops that case. Same fixed shape as
    # action-pin-resolution-nightly.yml, main-side, tests/nightly-alert-
    # cancelled-condition.test.ts scans for and enforces.
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.check-credential-slots.result == 'failure' || needs.check-credential-slots.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the "Credential-slot watchdog RED" issue (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The idempotency KEY is this fixed literal title — the lookup and
          # the create MUST share it, so keep it a constant (never interpolated).
          title='Credential-slot watchdog RED'
          body="One or more compat CREDENTIAL scheduled lanes (node / bun / node-webpack / bun-webpack
          in test-e2e-deploy.yml) is either MISSING (no scheduled run recorded since its slot, past
          the grace window), QUEUED TOO LONG (a run exists but had not started, past the grace
          window), or AMBIGUOUS (no run could be unambiguously attributed to this lane's slot — a
          neighbouring lane has a late run that could equally belong here) — read the job log for
          the per-lane verdicts.

          - Run (per-lane verdicts in the job log): ${RUN_URL}

          **This check is read-only** — it never dispatched, cancelled, or reran anything; the
          underlying credential run (if any) needs separate investigation (runner capacity, GitHub
          incident, or a genuinely dropped schedule trigger).

          **Lane-attribution**: each run's own \`compat-lane-<lane>\`/\`compat-mode-<mode>\` marker
          artifacts (the same ones scripts/compat-window-audit.mjs reads) give an EXACT lane match
          when present. Only when that marker is missing does attribution fall back to
          nearest-prior-slot time, and an AMBIGUOUS verdict means that fallback could not rule out a
          neighbouring lane — check that neighbour's verdict too. See
          scripts/lib/credential-slot-watchdog.mjs's module header for the full design.

          Once the underlying credential run is confirmed to have started (or the false alarm is
          understood), close this issue; the next red night reopens it via a comment, never a
          duplicate."
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs
