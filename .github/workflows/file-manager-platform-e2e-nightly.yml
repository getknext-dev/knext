name: File-manager platform e2e (nightly / dispatch)

# Thin caller of the shared file-manager platform e2e implementation
# (file-manager-platform-e2e.yml, #1282) - runs it against THIS commit, once
# a night plus on-demand, and alerts on a red run. See the reusable
# workflow's own header for what the suite covers (areas A-D) and what it
# deliberately does not.
#
# BUDGET: same as the reusable job (~8-10 min wall, ~10 runner-minutes/night).
# Triggers: schedule + dispatch.

on:
  # (#1675) — WEEKLY during the rc credential window to reduce runner contention
  # with the credential lanes. Restore to daily after GA.
  schedule:
    - cron: '37 4 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  platform-e2e:
    name: file-manager through kn-next deploy on kind (nightly)
    uses: ./.github/workflows/file-manager-platform-e2e.yml
    with:
      ref: ${{ github.sha }}
      cluster-name: fm-platform-e2e

  # One pinned issue, comment-don't-spam. A dispatch experiment never files.
  nightly-red-alert:
    name: Nightly red alert (pinned issue)
    needs: [platform-e2e]
    if: >-
      always() &&
      github.event_name == 'schedule' &&
      (needs.platform-e2e.result == 'failure' || needs.platform-e2e.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # #1406 — this job's own steps shell out to scripts/nightly-alert-issue.mjs,
      # which requires the repo to be checked out; nothing upstream shares a
      # checkout across jobs.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the "File-manager platform e2e nightly RED" issue (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='File-manager platform e2e nightly RED'
          body="The nightly file-manager platform e2e FAILED.

          - Run: ${RUN_URL}

          It deploys file-manager through \`kn-next deploy\` -> operator -> Knative on kind and checks app flows, platform features and deployment basics. Open the run's job summary for the per-check table. Fix the regression, re-run via workflow_dispatch to confirm green, then close this issue."
          # #1347 — create-or-update via the shared, never-pinning helper.
          # This alert used to `gh issue pin` its own issue, racing 9 OTHER
          # nightly workflows for GitHub's hard 3-pinned-issue cap (a failed
          # pin was only `::warning::`, so a red beyond the third pinned
          # issue went genuinely unseen). See scripts/lib/nightly-alert-issue.mjs.
          TITLE="${title}" BODY="${body}" node scripts/nightly-alert-issue.mjs
