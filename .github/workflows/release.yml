# Release (changesets) — E1-1
#
# Flow:
#   1. A normal feature PR includes a changeset (.changeset/*.md).
#   2. On merge to main, `version-pr` opens/updates the "Version Packages" PR
#      (version bump + changelog). NO credential, NO environment, NO approval.
#   3. Merging that PR is a second push to main. `publish-preflight` then finds a
#      version in the tree that the registry does not have, and `release` — the
#      only job that ever holds NPM_TOKEN — runs under the `npm-publish`
#      environment. CORRECTION (#1638, settled 2026-10-02): that environment
#      has NO required-reviewer protection rule, and by founder decision never
#      will — the sole maintainer is pre-authorized to publish and asked not
#      to be a blocking step. Do not read this workflow as gated by a
#      reviewer. What DOES protect a release: a repository ruleset,
#      "release tags (v*) immutable", blocks deleting, updating, or
#      force-moving any `refs/tags/v*` (creating new tags still works), and
#      `.github/workflows/npm-publish-drift-nightly.yml` alerts nightly if
#      that ruleset is ever removed or narrowed.
#
# ┌─ WHY THIS IS THREE JOBS AND NOT ONE (the lane starved itself for a month) ───┐
# │ It used to be one job, and that job declared `environment: npm-publish`.     │
# │ At the time, that environment DID have a `required_reviewers` rule (the     │
# │ `waiting` status below is only reachable with one), so EVERY push to main — │
# │ including the ones that only wanted to open a Version PR — parked the run in │
# │ `waiting` for a human click. That rule is not present today (see the        │
# │ CORRECTION above) — the job split itself no longer depends on it existing,  │
# │ since `publish-preflight` deciding to skip `release` outright is what       │
# │ actually prevents parking, with or without a reviewer rule configured.      │
# │                                                                             │
# │ Run 30207128316 (2026-07-26) parked and was never approved. With a           │
# │ WORKFLOW-level `concurrency: {group: release-<ref>, cancel-in-progress:      │
# │ false}` it held that group indefinitely; every later push queued behind it   │
# │ as `pending`; and GitHub keeps at most ONE pending run per group, so each    │
# │ new push cancelled the previous one. MEASURED: 99 of the last 100 runs are   │
# │ `cancelled` with ZERO jobs, each cancelled at the exact second the next push │
# │ arrived. No Version PR opened after #523, so nothing was published for a     │
# │ month and `kn-next` stayed a 404.                                            │
# │                                                                             │
# │ The environment gate is evaluated when a JOB STARTS, not when a step runs,   │
# │ so the publish job must be able to decide it has nothing to do WITHOUT       │
# │ starting. A job-level `if:` is evaluated first — hence the decision lives in │
# │ `publish-preflight`'s output, and `release` is skipped outright when there   │
# │ is nothing to publish. A skipped job never requests an approval, so it never │
# │ parks, so it never holds a group.                                            │
# │                                                                             │
# │ Concurrency is now PER JOB, in two different groups. A publish awaiting      │
# │ approval serialises later publishes (correct — two concurrent `changeset     │
# │ publish` runs are worse than a queue) and cannot touch the version lane.     │
# │ Neither group cancels in progress; `tests/ci-concurrency-group.test.ts`      │
# │ enforces that for every workflow that publishes or signs.                    │
# │ Guarded by `tests/release-lane-liveness.test.ts`, mutation-proved by         │
# │ `scripts/mutation-prove-release-lane.mjs`.                                   │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Publishable packages: @getknext/core (packages/kn-next), @getknext/lib (packages/lib),
# @getknext/db (packages/db) and the `kn-next` alias (packages/kn-next-alias) — core
# depends on lib AND db, db depends on lib; they are a changesets `fixed` group and
# must ship together or consumers 404 on the missing member (#255/#256).
# Provenance is enabled via each package's publishConfig.provenance + id-token permission.
#
# ┌─ DO NOT SHA-PIN-STRIP: KEEP THESE PINS (#522) ─────────────────────────┐
# │ Every `uses:` below is pinned to a full 40-char commit SHA, with the human   │
# │ version in a trailing comment. This is load-bearing, not style: the          │
# │ `changesets/action` step in the `release` job receives NODE_AUTH_TOKEN = the │
# │ live npm publish token (plus GITHUB_TOKEN with contents/pull-requests        │
# │ write). A mutable ref means whoever can move that ref chooses the code that  │
# │ runs with a publish credential in scope — and on changesets/action, `v1` is  │
# │ a BRANCH, not even a tag. Same rule security.md already applies to container │
# │ images ("pin by digest; reject :latest"), applied to the CI action supply    │
# │ chain. Bumps come from Dependabot's github-actions ecosystem                 │
# │ (.github/dependabot.yml) so pinning does not become staleness. Guarded by    │
# │ tests/release-action-pins.test.ts.                                           │
# │                                                                             │
# │ A BUMP HERE IS NOT SELF-CONTAINED. `changesets/action`'s major is coupled to │
# │ the `@changesets/cli` major in the ROOT package.json: action v1 <-> CLI v2,  │
# │ action v2 <-> CLI v3. The action validates this before it reads a single     │
# │ input and throws on a mismatch, so the Version-PR job dies and the whole     │
# │ lane below it never starts. It happened: #831 took the v1->v2 bump against   │
# │ CLI v2 and the first live run after the deadlock lifted (32850202919) failed │
# │ on exactly that. Guarded by tests/changesets-cli-action-compat.test.ts,      │
# │ mutation-proved by mutations 19-22 of the release-lane prover.               │
# └──────────────────────────────────────────────────────────────────────────────┘

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# NO workflow-level `concurrency:` — see the block above. A workflow-level group
# is what let one un-approved run starve every subsequent one. Concurrency is
# declared per job instead, in two groups that cannot block each other.

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance (--provenance)

jobs:
  # ┌─ PUBLISH-LANE GUARD: THE ROOT EVERY OTHER JOB HANGS FROM (#2035, v2 R0) ──┐
  # │ `workflow_dispatch` above accepts ANY ref, and 242 remote branches        │
  # │ (`integration/v1-coldstart` among them) still carry the changeset marker  │
  # │ that once computed 2.0.0 by accident. This job refuses, fail-closed:      │
  # │   1. a `github.ref` outside the EXACT publish-lane allowlist (string      │
  # │      equality on the full ref, no globs) or the anchored                  │
  # │      `release/vX.Y.Z[-rc.N]` cut pattern the 1.3 procedure dispatches     │
  # │      from; and                                                            │
  # │   2. a version changesets would publish whose major is not the lane's     │
  # │      (`integration/v1.3` and its `release/vX.Y.Z[-rc.N]` cuts -> 1).         │
  # │ The allowlist and the major map live ONLY in                              │
  # │ `scripts/publish-lane-guard.mjs`; this file carries no lane literal.      │
  # │                                                                           │
  # │ Every other job `needs:` it (the credentialed `release` job DIRECTLY), so │
  # │ a refused run never packs, never opens a Version PR, and never starts the │
  # │ job that holds NODE_AUTH_TOKEN. No step here is skippable or soft.        │
  # │                                                                           │
  # │ LIMIT, stated so nobody reads more into it. This guard is NOT the whole   │
  # │ defence, and until the repository settings in the PR that added it are    │
  # │ applied the CURRENT exposure is wider than stale dispatches:              │
  # │   - a dispatch runs the workflow file AT THE DISPATCHED REF, so a branch  │
  # │     that predates this guard (a stale marker branch, `integration/v1.3`,  │
  # │     a cut taken from it) runs its own older, unguarded `release.yml`; AND │
  # │   - the `npm-publish` environment has NO deployment-branch policy today   │
  # │     (null), so ANY same-repo pull-request workflow that declares          │
  # │     `environment: npm-publish` is handed NPM_TOKEN on                     │
  # │     `refs/pull/N/merge`; AND                                              │
  # │   - an environment branch policy matches by branch NAME only, so a lane   │
  # │     name that does not exist yet (`release/1.x`) can be created by anyone │
  # │     with push, at a stale marker SHA, and dispatched.                     │
  # │ Closing it takes settings, not code: an interim `main`-only policy, a     │
  # │ repository ruleset protecting the lane names, and lane names added to the │
  # │ policy only once they exist and are covered (see the PR body, and         │
  # │ docs/RELEASING.md). Guarded by                                            │
  # │ tests/publish-lane-guard-workflow.test.ts and                             │
  # │ tests/publish-lane-guard.test.ts, mutation-proved by                      │
  # │ scripts/mutation-prove-publish-lane-guard.mjs.                            │
  # └───────────────────────────────────────────────────────────────────────────┘
  publish-lane-guard:
    name: Publish-lane guard (exact ref allowlist + lane major)
    runs-on: ubuntu-latest
    if: github.repository == 'getknext-dev/knext'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The FULL ref, never `ref_name` (a tag named `main` has ref_name "main")
      # and never an input. Passed through env, not interpolated into the
      # script, because a branch name may carry shell metacharacters.
      - name: Refuse a ref outside the publish-lane allowlist (fail-closed)
        env:
          PUBLISH_REF: ${{ github.ref }}
        run: node scripts/publish-lane-guard.mjs ref --ref "$PUBLISH_REF"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run the exact bump `version-pr` runs, in this runner only (nothing here
      # pushes). Same two valid outcomes as there: exit 0 (changesets versioned:
      # the tree now holds what the Version PR would carry) or exit 1 with "No
      # unreleased changesets found" (the tree already holds what `changeset
      # publish` would ship). Any other failure is a defect and stays red.
      - name: Compute the version changesets would publish (runner-local bump)
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          out="$(bun run changeset:version 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ] && ! printf '%s' "$out" | grep -q "No unreleased changesets found"; then
            echo "::error::changeset version failed for a reason other than 'no changesets' (exit $rc)" >&2
            exit 1
          fi

      - name: Refuse a computed major that does not match the lane (fail-closed)
        env:
          PUBLISH_REF: ${{ github.ref }}
        run: node scripts/publish-lane-guard.mjs major --ref "$PUBLISH_REF"

  # THE single pack (#1614/#1616). Before this job, THREE places packed the
  # `@getknext/*` fixed group from independent `bun install` + build of the
  # same commit: `audit` (`bun pm pack`, measurably NOT the tool
  # `changeset publish` uses — #1614), `ga-tarball-diff` (its own worktree
  # build + `npm pack` of HEAD), and `release` itself
  # (`verify-published-group.mjs --pre`, also its own `npm pack`). The bytes
  # were MEASURED byte-identical (#1616), but "measured identical today" is
  # not "provably the same artifact". This job packs ONCE, with `npm pack`
  # (the real publish tool — see `rewrite-workspace-ranges.mjs`), and
  # `ga-tarball-diff` + `release` consume its artifact instead of re-packing:
  #   - `ga-tarball-diff` diffs its HEAD side against these tarballs
  #     (`--ga-dir`) instead of a second worktree build of HEAD.
  #   - `release`'s pre-publish verification sha256-compares its OWN fresh
  #     pack against this artifact's manifest (`--compare-dir`) and refuses
  #     to publish on any drift.
  # `audit` deliberately does NOT consume this artifact for its bun-pack
  # staleness check (`siblingRangeProblems` needs bun's OWN
  # bun.lock-vs-manifest divergence — see `packPublished`'s doc — which this
  # job's `npm pack` does not reproduce); it packs its OWN npm-pack target for
  # the CVE audit/SBOM from the build it already runs, a small, LOCAL,
  # non-blocking duplication kept out of this job's blast radius on purpose.
  pack:
    name: Pack the @getknext/* fixed group ONCE (npm pack, the real publish tool)
    runs-on: ubuntu-latest
    needs: publish-lane-guard
    if: github.repository == 'getknext-dev/knext'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publishable packages
        run: bun run --filter @getknext/lib build && bun run --filter @getknext/db build && bun run --filter @getknext/core build

      - name: Pack once with npm pack (the real publish tool)
        run: node scripts/pack-release-tarballs.mjs --dest release-tarballs

      - name: Upload the pack-once artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: release-tarballs/
          if-no-files-found: error

  # npm/JS supply-chain gate (v4-P3). The image Trivy gate scans containers; this
  # scans the PUBLISHED npm tarballs' PRODUCTION closure (--omit=dev) of
  # @getknext/{core,lib,db}, FAILS on HIGH/CRITICAL (mirrors security.md's Trivy
  # rule), and emits a CycloneDX SBOM per package. It is PUBLISH-BLOCKING: the
  # `release` job `needs: audit` (transitively and directly), so a failed audit
  # stops the publish — never advisory/after. scripts/audit-published.mjs is the
  # single source of truth for scope + audit-level; the dated+justified allowlist
  # is security/npm-audit-allowlist.json.
  audit:
    name: npm supply-chain audit + JS SBOM (blocks publish)
    runs-on: ubuntu-latest
    needs: publish-lane-guard
    if: github.repository == 'getknext-dev/knext'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build in dependency order so the packed tarballs carry real dist/ (lib →
      # db → core). `audit-published.mjs` packs TWICE from this ONE build
      # (#1614): first with `bun pm pack`, whose rewrite of workspace:^ comes
      # from `bun.lock` (not the manifest) — deliberately kept, because that
      # divergence is exactly what `siblingRangeProblems` uses to catch a
      # stale lock (#942 F1) — then AGAIN with `npm pack`, the tool
      # `changeset publish` actually shells to, and audits/SBOMs THOSE bytes
      # (the earlier note that this job audited the bun-packed bytes was the
      # #1614 gap; fixed here, without a cross-job artifact dependency, since
      # this job already builds regardless).
      - name: Build publishable packages
        run: bun run --filter @getknext/lib build && bun run --filter @getknext/db build && bun run --filter @getknext/core build

      # Audits the PUBLISHED production closure (--omit=dev, HIGH/CRITICAL) and
      # writes sbom/*.cdx.json. Non-zero exit here fails the job → blocks publish.
      - name: Audit published production closure + generate SBOMs
        run: node scripts/audit-published.mjs

      - name: Upload JS SBOMs (CycloneDX)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # The VERSION lane. Opens/updates the "Version Packages" PR and nothing else.
  #
  # It holds NO npm credential and declares NO environment, which is the whole
  # point: opening a PR is reversible, so it must not sit behind a human click.
  # This is the job whose month-long starvation was the actual release blocker.
  version-pr:
    name: Version PR (no credential, no approval)
    runs-on: ubuntu-latest
    needs: [publish-lane-guard, audit]
    if: github.repository == 'getknext-dev/knext'
    concurrency:
      # Its OWN group: a publish parked on the environment approval lives in
      # `release-publish-*` and cannot queue anything up behind this one.
      group: release-version-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      # Underscore, not the action's own kebab key, so nothing downstream has to
      # dereference a dashed property name in an expression.
      has_changesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── The version bump MUST pass (FAIL-CLOSED) ──────────────────────────
      # Split out of the best-effort changesets/action step below so a REAL
      # release defect — a malformed changeset, a broken bump, a changelog hook
      # that throws — still turns this job RED. We run the exact command the
      # action runs (`bun run changeset:version`), assert it exits 0, then
      # RESTORE the tree so the action below still finds the changesets to
      # consume and opens/updates the PR from an identical starting point.
      #
      # Why this split exists: the action below does the bump AND the PR-open in
      # ONE step, and that step must be `continue-on-error` (see its comment).
      # Without validating the bump here first, that continue-on-error would
      # ALSO swallow a genuine version-bump failure — blanket-greening a real
      # defect, which is exactly what this must not do.
      - name: Verify the version bump succeeds (fail-closed)
        id: bump
        # Override the default `bash -e {0}`: with `-e`, `out="$(changeset version)"`
        # exits the step the instant the command fails — BEFORE our `rc=$?` branch
        # runs — so the "No unreleased changesets found" (exit 1) tolerance never
        # took effect and the publish stayed blocked. Drop `-e`; keep `-u`+pipefail;
        # WE decide fail-vs-tolerate from the captured exit code below.
        shell: bash --noprofile --norc -uo pipefail {0}
        run: |
          # Run the exact bump the action runs. TWO valid outcomes:
          #   exit 0  -> changesets existed and versioned cleanly (Version-PR path)
          #   exit 1 + "No unreleased changesets found" -> nothing to version, which
          #     is the NORMAL post-version-PR state and means we are READY TO PUBLISH.
          # Only a DIFFERENT non-zero (a malformed changeset, a throwing changelog
          # hook, a broken bump) is a real defect that must stay fail-closed.
          # Without this, a clean "nothing to release" run failed this job, left
          # has_changesets unset, and skipped the publish path entirely (#987 landed
          # 0.4.0 in-tree but the publish never reached its gate).
          out="$(bun run changeset:version 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ] && ! printf '%s' "$out" | grep -q "No unreleased changesets found"; then
            echo "::error::changeset version failed for a reason other than 'no changesets' (exit $rc)" >&2
            exit 1
          fi
          # Undo it: the action below re-runs the same bump and opens the PR.
          # Restore tracked edits/deletions (package.json versions, CHANGELOGs,
          # the deleted .changeset/*.md) and drop the newly generated untracked
          # CHANGELOG files, so the action starts from the tree this step did.
          # No-op when there were no changesets.
          git checkout -- .
          git clean -fd

      # NO `publish-script` and NO `NODE_AUTH_TOKEN`: this step is structurally
      # incapable of publishing, which is what lets it run unapproved.
      #
      # ── Opening the PR is BEST-EFFORT (environment limit, not a defect) ────
      # `continue-on-error: true` is scoped to THIS step only. The getknext-dev
      # org/repo toggle "Allow GitHub Actions to create and approve pull
      # requests" is OFF — a human-only setting — so after the bump succeeds
      # this step ALWAYS ends in `HttpError: GitHub Actions is not permitted to
      # create or approve pull requests` and the Version PR is opened by hand
      # (as it always has been). That is an environment limitation, NOT a
      # release defect, so it must not paint the main CI rollup permanently red
      # — two permanently-red lanes trained the rollup to noise, which is how a
      # live HIGH CVE hid for a whole sprint. The bump above is already
      # fail-closed and the `release` publish job stays fully fail-closed; only
      # this PR-open is softened. The moment the org toggle is flipped on, this
      # step simply starts succeeding — no further change needed.
      - name: Create or update the Version Packages PR (best-effort)
        id: changesets
        continue-on-error: true
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 RENAMED EVERY INPUT THIS STEP PASSES, and #831 took the v1→v2 pin
          # bump WITHOUT this migration (#749 had it, but was not what merged) —
          # GitHub Actions does NOT error on unknown `with:` keys, it ignores
          # them, so the step sat GREEN while set to run with every input
          # defaulted (no version script, no publish script, wrong commit
          # message), surfacing only at the next release. Caught by the #750
          # input-existence check on its first live run; migration mirrors #749.
          #   version              -> version-script
          #   publish              -> publish-script
          #   commit               -> commit-message
          #   title                -> pr-title
          #   createGithubReleases -> create-github-releases
          version-script: bun run changeset:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # Releases are created by the publish job, from the published set.
          create-github-releases: false
          # v2 requires the token as an INPUT. Its release notes are explicit that
          # "the GITHUB_TOKEN environment variable and credentials configured by
          # actions/checkout ... are not substitutes for this input" — so the env
          # var below is no longer sufficient on its own for the push.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── PUSH-INTEGRITY GATE: a swallowed push failure MUST stay red ───────
      # The `continue-on-error` above swallows more than the PR-create 403. The
      # action, BEFORE it opens the PR, pushes the `changeset-release/main`
      # branch with GITHUB_TOKEN (contents:write). So a real push failure —
      # reduced token scope, new branch protection, a rejected ref — is now
      # swallowed too, and must NOT be mistaken for the org PR-open limitation.
      #
      # This step runs ONLY when the best-effort step above actually failed
      # (`outcome == 'failure'` — its pre-continue-on-error result). When it
      # fails, we must distinguish the two causes.
      #
      # EXISTENCE IS NOT ENOUGH — assert FRESHNESS. The org toggle is
      # permanently off, so the action force-pushes `changeset-release/main`
      # every run and the branch PERSISTS between runs. A bare
      # `git ls-remote`/existence check would therefore go green on last run's
      # leftover even when THIS run's push failed — decoration by this repo's
      # own standard (green when its subject is removed), and the exact
      # unverified-cause falsehood this PR exists to kill, one level down. So we
      # fetch the branch and require THIS run's commit ($GITHUB_SHA) to be an
      # ANCESTOR of the pushed tip: the action bases the branch on the checked-out
      # HEAD and commits the bump on top, so a fresh push descends from
      # $GITHUB_SHA, while a stale leftover from an earlier main tip does not.
      #   - fresh push (descends from $GITHUB_SHA) -> only the PR-open was refused
      #     (the org toggle) — tolerated.
      #   - branch missing, unfetchable, OR stale  -> the PUSH failed — a real
      #     release defect — so FAIL the job.
      # A fetch failure is a FAILURE, never a pass (a network/ref error must not
      # read as "fresh"). NO continue-on-error, so `exit 1` reds the lane. On the
      # merge push (no changesets, action succeeds) `outcome` is 'success' and
      # this is skipped; if the fail-closed bump step failed, `outcome` is
      # 'skipped' and this is skipped too (the job is already red at the bump).
      - name: Assert the version branch push is FRESH (a real push failure stays red)
        if: steps.changesets.outcome == 'failure'
        run: |
          set -euo pipefail
          if ! git fetch --no-tags origin changeset-release/main; then
            echo "::error title=Version branch push failed::The version bump PASSED but 'changeset-release/main' could not be fetched from origin — the changesets/action branch push (GITHUB_TOKEN, contents:write) did not land it. That is a real release defect (reduced token scope, branch protection, a rejected ref), NOT the org PR-open limitation. Failing the job."
            exit 1
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "changeset-release/main on origin descends from $GITHUB_SHA — this run's version branch push is FRESH; only the PR-open was refused." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Version branch push failed (stale)::The version bump PASSED but 'changeset-release/main' on origin does NOT descend from this run's commit ($GITHUB_SHA) — this run's push FAILED and only a stale leftover from an earlier run remains. That is a real release defect (reduced token scope, branch protection, a rejected ref), NOT the org PR-open limitation. Failing the job."
            exit 1
          fi

      # ── HONEST NUDGE (only when it is genuinely the org limitation) ───────
      # Gated so it can NEVER assert a cause it did not verify: it runs only
      # when the bump SUCCEEDED (`steps.bump.outcome == 'success'`) AND the
      # PR-open step failed (`steps.changesets.outcome == 'failure'`). The
      # implicit `success()` on this un-annotated `if:` also requires the
      # push-integrity gate above to have PASSED — so if the push failed (gate
      # exited 1) this step is skipped and never prints "not a release defect".
      # The claim is therefore true by construction: bump passed, branch pushed,
      # only the PR-open was refused.
      - name: Report the Version PR must be opened by hand
        if: steps.bump.outcome == 'success' && steps.changesets.outcome == 'failure'
        run: |
          echo "::warning title=Version PR must be opened by hand::The version bump PASSED and 'changeset-release/main' was pushed; only opening the Version PR was refused because GitHub Actions cannot create PRs in getknext-dev (the org toggle is OFF, a human-only setting). Open or refresh the 'chore: version packages' PR by hand. This is an environment limitation, not a release defect."
          {
            echo "### Version PR: open by hand"
            echo "The version bump PASSED and the version branch was pushed. Opening the Version PR was refused by the standing org limitation (\`GitHub Actions is not permitted to create or approve pull requests\`), so open/refresh the \`chore: version packages\` PR by hand. Not a release defect."
          } >> "$GITHUB_STEP_SUMMARY"

  # Decide whether `release` should start AT ALL.
  #
  # This exists because the `npm-publish` environment gate fires when the job
  # STARTS. A publish job that starts on every push and then discovers it has
  # nothing to do would request an approval on every push, and each un-clicked
  # request parks a run — which is exactly the failure this workflow was
  # restructured to remove. So the decision has to be reachable from a job-level
  # `if:`, and a job-level `if:` can only read another job's outputs.
  #
  # No environment, no credential, no pnpm install: it is a registry read.
  publish-preflight:
    name: Is anything actually unpublished?
    runs-on: ubuntu-latest
    needs: version-pr
    # A run that just opened/updated a Version PR has nothing to publish yet —
    # the bump is on the PR branch, not on main.
    if: github.repository == 'getknext-dev/knext' && needs.version-pr.outputs.has_changesets == 'false'
    outputs:
      should_publish: ${{ steps.preflight.outputs['should-publish'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Fails closed if the registry is unreachable — an unanswerable question is
      # never answered "nothing to publish".
      - name: Compare tree versions against the registry
        id: preflight
        run: node scripts/publish-preflight.mjs

  # GA-vs-rc tarball diff (#1306, wired here by #1562) — PUBLISH-BLOCKING.
  #
  # The v1.0 compat credential is a property of the rc.N tarballs the compat
  # suite actually installed and exercised. Nothing else connects that
  # measurement to what `changeset publish` ships next — if a GA cut differs
  # from its last rc in anything beyond version fields, the credential does
  # not cover the artifact users install. `scripts/ga-tarball-diff-gate.mjs`
  # decides from the GIT TAGS (not `rcTag`, which is cleared when a window
  # closes): a GA `X.Y.Z` with `vX.Y.Z-rc.N` tags is diffed against the
  # highest N (`--rc-ref vX.Y.Z-rc.N --ga-ref HEAD`); a GA with no rc tags for
  # its own tuple, or any prerelease, is a loudly-announced SKIP; an `rcTag`
  # pinned at a lower same-tuple rc is an ambiguous-credential FAIL. Every
  # outcome is written to the step summary + a `::notice::`/`::error::`.
  #
  # `fetch-depth: 0` + `fetch-tags: true`: the gate lists the tags and the
  # diff script resolves the rc tag via `git worktree add --detach`, which
  # needs the tag's history present — the default shallow, no-tags checkout
  # the other jobs use is not enough (and a tagless checkout fails closed).
  #
  # A SKIP exits 0 quickly, so this job is cheap on every push that has
  # nothing to gate; only a credentialed GA cut pays for the rc-side worktree
  # build + pack (the ga/HEAD side no longer builds — #1616, see below).
  ga-tarball-diff:
    name: GA-vs-rc tarball diff (credential still covers what ships) — blocks publish
    runs-on: ubuntu-latest
    needs: [version-pr, publish-preflight, pack]
    # The SAME three conditions as the `release` job, deliberately written in a
    # different ORDER: `scripts/mutation-prove-release-lane.mjs` anchors on the
    # `release` job's `if:` block byte-for-byte and aborts on an ambiguous
    # (2x) anchor, which would silently disable that guard on the publish
    # lane. Semantics are identical (a pure `&&` conjunction).
    if: >-
      needs.publish-preflight.outputs.should_publish == 'true'
      && needs.version-pr.outputs.has_changesets == 'false'
      && github.repository == 'getknext-dev/knext'
    steps:
      - name: Checkout code (full history + tags — resolves the credentialed rc's git ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # `ga-tarball-diff-gate.mjs` only shells out to `ga-tarball-diff.mjs`
      # (which needs the `tar` devDependency) on a RUN decision, but a RUN
      # decision (the actual credentialed-publish case) still needs it
      # installed. Its absence here — this step was simply missing — is what
      # crashed a SKIP decision too before the gate script deferred that
      # invocation, silently skipping the `release` (publish) job downstream:
      # the defect that blocked the v1.0.0-rc.1 publish (release run
      # 36418444586).
      # #1616 — the ga/HEAD side of the diff consumes the `pack` job's
      # artifact (SAME commit, already `npm pack`ed) instead of `packRef`
      # building+packing HEAD a second time in its own worktree. The rc side
      # still builds (a different commit) — see `ga-tarball-diff.mjs`'s
      # `packRef`, unchanged. Placed BEFORE "Install dependencies" so that
      # step stays directly adjacent to the gate step below — the shape
      # `scripts/mutation-prove-ga-tarball-diff-release-gate.mjs` anchors on.
      - name: Download the pack-once artifact (ga/HEAD side)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: release-tarballs-head

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the GA-vs-rc tarball diff gate
        env:
          PACK_ONCE_GA_DIR: ${{ github.workspace }}/release-tarballs-head
        run: node scripts/ga-tarball-diff-gate.mjs

  release:
    name: Publish to npm (gated on NPM_TOKEN + environment approval)
    runs-on: ubuntu-latest
    # NPM_TOKEN lives as an ENVIRONMENT secret on `npm-publish`, not a repo
    # secret. Environment secrets are only injected into jobs that declare the
    # environment — without this line `secrets.NPM_TOKEN` resolves to the empty
    # string. Declaring it would ALSO let the environment's protection rules
    # gate the publish itself, which is the point of putting an irreversible
    # action behind an environment in the first place — but CORRECTION
    # (#1638, #1639): `npm-publish` currently has NO protection rules
    # (`protection_rules: []`, live-verified), so today this line is purely
    # about the secret, not a reviewer gate. The `required_reviewers:
    # AhmedElBanna80, measured 2026-08-25` claim this comment used to make was
    # false as of this writing and has been removed rather than left stale.
    environment: npm-publish
    # Publish-BLOCKING supply-chain gate: never publish tarballs the audit did
    # not clear (HIGH/CRITICAL fail-closed). `audit` is named directly as well as
    # reached transitively, so deleting an intermediate job cannot silently drop
    # it. `ga-tarball-diff` (#1562) is the same shape: it must complete (skip or
    # pass) before a credentialed GA cut is allowed through.
    needs: [publish-lane-guard, audit, version-pr, publish-preflight, ga-tarball-diff, pack]
    # Belt-and-suspenders: only ever run on the canonical repo (never forks).
    # BOTH halves of the "there is something to publish" question are asserted —
    # no pending changesets AND a version the registry does not have. Either one
    # alone lets a routine docs push request a publish approval.
    if: >-
      github.repository == 'getknext-dev/knext'
      && needs.version-pr.outputs.has_changesets == 'false'
      && needs.publish-preflight.outputs.should_publish == 'true'
    concurrency:
      # Its own group, so a publish waiting on the required reviewer serialises
      # only other publishes. Never cancels: a half-finished `changeset publish`
      # is worse than a queue.
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build in dependency order: @getknext/lib, then @getknext/db (depends on lib and
      # holds the `kn-next db migrate` runner, #242), then @getknext/core (type-imports
      # both). @getknext/lib/@getknext/db ship only dist/, so they must build first.
      - name: Build publishable packages
        run: bun run --filter @getknext/lib build && bun run --filter @getknext/db build && bun run --filter @getknext/core build

      # ── FIX: rewrite `workspace:` ranges to concrete ranges BEFORE publish ──
      # `changeset publish` shells to `npm publish` for a bun workspace
      # (getPublishTool: bun ∉ {npm,pnpm,yarn} → npm), and `npm publish` invoked
      # in a package subdir of a BUN-installed workspace ships `workspace:^`
      # VERBATIM — it does not rewrite it the way `bun pm pack` does. That is how
      # @getknext/core@0.4.0 went to npm depending on `@getknext/lib: workspace:^`
      # and became uninstallable (EUNSUPPORTEDPROTOCOL). This step rewrites the
      # source manifests to `^<version>` so whatever tool publishes ships a
      # resolvable range. Ephemeral (runner only) — the repo keeps `workspace:`.
      - name: Rewrite workspace protocol ranges to concrete versions (publish fix)
        run: node scripts/rewrite-workspace-ranges.mjs

      # #1616 — the `pack` job's artifact: this job's OWN fresh pack (below)
      # is compared against it byte-for-byte, PROVING there is no drift
      # between what the `audit`/`ga-tarball-diff` gates already vouched for
      # and what is about to publish. This does NOT make `changeset publish`
      # ship these literal tarball files — it still packs from this job's own
      # (rewritten) directory, because `changeset publish` shells to
      # `npm publish <dir>`, not `npm publish <tarball>`, for a bun workspace.
      # Forking that mechanism is deliberately out of scope here (supply-chain
      # trigger-class change on the publish path, days before an rc
      # publish) — see the PR description.
      - name: Download the pack-once artifact (drift check)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: release-tarballs-compare

      # ── GUARD (pre): red the run BEFORE the credentialed publish if the fix
      # above regressed. Packs each publishable package with `npm pack` — the
      # SAME tool the publish shells to, so the tarball is faithful — and asserts
      # no dependency still carries a `workspace:` spec AND the fixed group is
      # internally coherent (one version, every sibling ^-dep satisfiable).
      # Packing with `bun pm pack` would HIDE the leak (bun rewrites), which is
      # exactly why audit-published.mjs missed it — `npm pack` is deliberate.
      # `--compare-dir` additionally sha256-compares this fresh pack against
      # the `pack` job's artifact and fails on drift (#1616).
      - name: Verify published group is safe to ship (pre-publish)
        run: >-
          node scripts/verify-published-group.mjs --pre
          --compare-dir "${{ github.workspace }}/release-tarballs-compare"

      # Gate the publish command WITHOUT referencing `secrets` inside the action's
      # `with:` input (that expression caused GitHub startup-failure runs).
      #
      # PRESENCE IS NOT VALIDITY. The environment secret was set 2026-07-25 and a
      # token can be present and expired; reporting "NPM_TOKEN present" as if it
      # meant "publish will work" is the kind of claim this repo does not make.
      # `npm whoami` answers the real question, and the branch is on its EXIT
      # CODE — npm's stderr wording has changed between majors and a message
      # match would rot silently.
      - name: Determine publish gate (token present AND accepted)
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on the npm-publish environment. This job only publishes; there is nothing it can do without it."
            exit 1
          fi
          if npm whoami --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "NPM_TOKEN is present and the registry accepted it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::NPM_TOKEN is PRESENT but the registry REJECTED it (npm whoami exited non-zero). Rotate the npm-publish environment secret; presence is not validity."
            exit 1
          fi
          echo "publish=bun run release" >> "$GITHUB_OUTPUT"

      # No `version-script` here on purpose: this job must never take the version
      # path. It is reached only when there are no changesets, and it is the one
      # job holding a publish credential.
      - name: Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: ${{ steps.gate.outputs.publish }}
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # On publish, create one GitHub Release per published package, tagged
          # `@getknext/<pkg>@x.y.z`. The hand-made `v0.1.0` release predates this and
          # uses a different tag format, so there is no tag collision.
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Still exported: `changeset publish` and the gate script read it, and
          # NODE_AUTH_TOKEN is how npm authenticates. The github-token INPUT above
          # is what v2 uses for pushing; this is not redundant with it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── SELF-HEAL: recover a PARTIAL publish IN-RUN ──────────────────────────
      # `changeset publish` has TWICE left the fixed group partial — core + the
      # kn-next alias landed at the target version but lib/db did NOT — because
      # for a bun workspace it shells to per-package `npm publish`, and a single
      # per-package failure or registry read-after-write lag can leave a subset
      # published. The post guard below DETECTS that but cannot PREVENT it (core
      # is already published, immutable); both times a manual RE-RUN healed it,
      # proving the partial is transient/per-package.
      #
      # This step closes the gap in-run: for every fixed-group member NOT yet
      # resolvable at the target version, it re-publishes JUST that member's
      # already-built + workspace-rewritten package dir (the same artifact the
      # publish above shipped, `^<version>` siblings, never `workspace:`), with
      # bounded retries + backoff for lag, then FAILS CLOSED if still incoherent.
      # It re-publishes ONLY the missing members (a present member's version is
      # immutable) and never certifies from an unreachable registry.
      #
      # `if: !cancelled() && gate succeeded`: run even if the Publish step above
      # hard-failed on a partial, so long as the token was accepted — that is the
      # case this heals. NODE_AUTH_TOKEN is the same publish credential; the
      # reviewers must know this step re-publishes with it.
      - name: Heal a partial publish in-run (re-publish only missing members)
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        run: node scripts/ensure-published-group.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── GUARD (post): the whole fixed group must have LANDED at one version ──
      # Incident #1 was a PARTIAL publish — `core`+`db` shipped, `lib` skipped,
      # so `core` needed a `lib` version that did not exist. This asks the
      # registry whether every fixed-group member now resolves to the target
      # version. A missing member or one stuck at the old version fails the job.
      # Fail-closed on an unreachable registry (a reachability probe), mirroring
      # publish-preflight.mjs — an unanswerable question is never a pass.
      #
      # `if:` MATCHES the heal step above exactly (`!cancelled() && gate
      # succeeded`) rather than the implicit `success()`. Under `success()` a
      # HARD-FAILED Publish skips this final authority even though the heal step
      # still ran and may have made the group coherent — so heal's work would go
      # UNconfirmed in that very run. Running it in precisely the cases heal runs
      # keeps this the last word on coherence in-run. This does NOT mask the
      # Publish failure: a later passing step never clears an earlier step's
      # failure, and the Publish step carries no `continue-on-error`, so a
      # hard-failed Publish still reds the job. Fail-closed here too — an
      # unreachable registry is never a pass — so a green here is a real re-confirm.
      - name: Verify the whole group published coherently (post-publish)
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        run: node scripts/verify-published-group.mjs --post

  # #1639(c) — nothing previously alerted when a version bump landed on `main`
  # and did NOT end up published, for ANY reason: a crash (the #1622 class),
  # red CI, the environment gate never approved, or a registry outage. This
  # re-asks EXACTLY the question `publish-preflight` asked before the run —
  # is there a publishable name@version the registry does not have — a second
  # time, after `release` has had its chance.
  #
  # `always()` so a hard-failed or never-run `release` job still gets this
  # check — that is precisely the case it exists for. Gated on
  # `publish-preflight` having SUCCEEDED (its `should_publish` output cannot
  # be trusted otherwise) AND having said `true` (nothing to publish is not a
  # drift to report).
  publish-drift-alert:
    name: Alert if main is still ahead of the registry after this run
    runs-on: ubuntu-latest
    needs: [version-pr, publish-preflight, release]
    if: >-
      always()
      && github.repository == 'getknext-dev/knext'
      && needs.version-pr.outputs.has_changesets == 'false'
      && needs.publish-preflight.result == 'success'
      && needs.publish-preflight.outputs.should_publish == 'true'
    # Least privilege: only this job gets issues:write, and only to file/update
    # the dedup-by-title alert (scripts/lib/nightly-alert-issue.mjs, #1347 —
    # never pinned). Same HUMAN PRECONDITION as every other alert job in this
    # repo (see docs-closure-nightly.yml): "Settings → Actions → General →
    # Workflow permissions → Allow GitHub Actions to create and approve pull
    # requests" must be enabled, or the default GITHUB_TOKEN cannot create the
    # issue and no alert surfaces.
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No install step: scripts/publish-verify-alert.mjs's whole closure
      # (scripts/publish-preflight.mjs, scripts/lib/nightly-alert-issue.mjs)
      # reaches only node: builtins — enforced by
      # tests/workflow-script-install-guard.test.ts (#1639a) scanning this
      # exact file, not merely claimed here.
      - name: Check whether main is still ahead of the registry; alert if so
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-verify-alert.mjs
