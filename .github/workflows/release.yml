# Release (changesets) — E1-1
#
# Gated: no publish occurs until NPM_TOKEN is set as a repo secret (E1-4, user step).
# Until then this workflow only ever opens/updates the "Version Packages" PR — it never
# runs `changeset publish`. The publish gate is computed in a plain `run` step (see
# "Determine publish gate") rather than a `secrets`-in-`with:` expression, which GitHub
# rejected during workflow evaluation and produced phantom startup-failure runs.
#
# Flow:
#   1. A normal feature PR includes a changeset (.changeset/*.md).
#   2. On merge to main, changesets/action opens a "Version Packages" PR (version bump + changelog).
#   3. Merging that PR (a second push to main) runs `changeset publish` IF NPM_TOKEN exists.
#
# Publishable packages: @getknext/core (packages/kn-next), @getknext/lib (packages/lib),
# @getknext/db (packages/db) — core depends on lib AND db, db depends on lib; all
# three must ship together or consumers 404 on the missing member (#255/#256).
# Provenance is enabled via each package's publishConfig.provenance + id-token permission.
#
# ┌─ DO NOT SHA-PIN-STRIP: KEEP THESE PINS (#522) ─────────────────────────┐
# │ Every `uses:` below is pinned to a full 40-char commit SHA, with the human   │
# │ version in a trailing comment. This is load-bearing, not style: the          │
# │ `changesets/action` step receives NODE_AUTH_TOKEN = the live npm publish     │
# │ token (plus GITHUB_TOKEN with contents/pull-requests write). A mutable ref   │
# │ means whoever can move that ref chooses the code that runs with a publish    │
# │ credential in scope — and on changesets/action, `v1` is a BRANCH, not even   │
# │ a tag. Same rule security.md already applies to container images ("pin by    │
# │ digest; reject :latest"), applied to the CI action supply chain.             │
# │ Bumps come from Dependabot's github-actions ecosystem (.github/dependabot.yml)│
# │ so pinning does not become staleness. Guarded by                             │
# │ tests/release-action-pins.test.ts.                                           │
# └──────────────────────────────────────────────────────────────────────────────┘

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance (--provenance)

jobs:
  # npm/JS supply-chain gate (v4-P3). The image Trivy gate scans containers; this
  # scans the PUBLISHED npm tarballs' PRODUCTION closure (--omit=dev) of
  # @getknext/{core,lib,db}, FAILS on HIGH/CRITICAL (mirrors security.md's Trivy
  # rule), and emits a CycloneDX SBOM per package. It is PUBLISH-BLOCKING: the
  # `release` job `needs: audit`, so a failed audit stops the publish — never
  # advisory/after. scripts/audit-published.mjs is the single source of truth for
  # scope + audit-level; the dated+justified allowlist is security/npm-audit-allowlist.json.
  audit:
    name: npm supply-chain audit + JS SBOM (blocks publish)
    runs-on: ubuntu-latest
    if: github.repository == 'getknext-dev/knext'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build in dependency order so the packed tarballs carry real dist/ (lib →
      # db → core) — audit-published.mjs pnpm-packs each (rewriting workspace:^
      # exactly like changeset publish) and audits the resolved prod closure.
      - name: Build publishable packages
        run: pnpm --filter @getknext/lib build && pnpm --filter @getknext/db build && pnpm --filter @getknext/core build

      # Audits the PUBLISHED production closure (--omit=dev, HIGH/CRITICAL) and
      # writes sbom/*.cdx.json. Non-zero exit here fails the job → blocks publish.
      - name: Audit published production closure + generate SBOMs
        run: node scripts/audit-published.mjs

      - name: Upload JS SBOMs (CycloneDX)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  release:
    name: Version PR / Publish (gated on NPM_TOKEN)
    runs-on: ubuntu-latest
    # NPM_TOKEN lives as an ENVIRONMENT secret on `npm-publish`, not a repo
    # secret. Environment secrets are only injected into jobs that declare the
    # environment — without this line `secrets.NPM_TOKEN` resolves to the empty
    # string, the publish gate below reports "not set", and the workflow would
    # silently only ever open Version PRs. Declaring it also lets the
    # environment's protection rules (e.g. Required reviewers) gate the publish
    # itself, which is the point of putting an irreversible action behind an
    # environment in the first place.
    environment: npm-publish
    # Publish-BLOCKING supply-chain gate: never publish tarballs the audit did
    # not clear (HIGH/CRITICAL fail-closed). This does NOT unblock #53 — publish
    # still requires the human NPM_TOKEN (see "Determine publish gate" below).
    needs: audit
    # Belt-and-suspenders: only ever run on the canonical repo (never forks).
    if: github.repository == 'getknext-dev/knext'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build in dependency order: @getknext/lib, then @getknext/db (depends on lib and
      # holds the `kn-next db migrate` runner, #242), then @getknext/core (type-imports
      # both). @getknext/lib/@getknext/db ship only dist/, so they must build first.
      - name: Build publishable packages
        run: pnpm --filter @getknext/lib build && pnpm --filter @getknext/db build && pnpm --filter @getknext/core build

      # Gate the publish command WITHOUT referencing `secrets` inside the action's
      # `with:` input (that expression caused GitHub startup-failure runs). When
      # NPM_TOKEN is unset, `publish` is empty → changesets/action can only open the
      # Version PR (nothing destructive).
      - name: Determine publish gate
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "publish=pnpm run release" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN present — publish path enabled."
          else
            echo "publish=" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN not set — publish gated off (E1-4, user step). Only the Version PR path will run."
          fi

      # Opens/updates the "Version Packages" PR, OR publishes when there are
      # already-versioned packages to release AND the publish gate is enabled.
      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run changeset:version
          publish: ${{ steps.gate.outputs.publish }}
          commit: 'chore: version packages'
          title: 'chore: version packages'
          # On publish, create one GitHub Release per published package, tagged
          # `@getknext/<pkg>@x.y.z`. The hand-made `v0.1.0` release predates this and
          # uses a different tag format, so there is no tag collision.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
