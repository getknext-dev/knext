# Release (changesets) — E1-1
#
# Flow:
#   1. A normal feature PR includes a changeset (.changeset/*.md).
#   2. On merge to main, `version-pr` opens/updates the "Version Packages" PR
#      (version bump + changelog). NO credential, NO environment, NO approval.
#   3. Merging that PR is a second push to main. `publish-preflight` then finds a
#      version in the tree that the registry does not have, and `release` — the
#      only job that ever holds NPM_TOKEN — publishes it after the `npm-publish`
#      environment's required reviewer approves.
#
# ┌─ WHY THIS IS THREE JOBS AND NOT ONE (the lane starved itself for a month) ───┐
# │ It used to be one job, and that job declared `environment: npm-publish`.     │
# │ That environment has a `required_reviewers` rule, so EVERY push to main —    │
# │ including the ones that only wanted to open a Version PR — parked the run in │
# │ `waiting` for a human click.                                                 │
# │                                                                             │
# │ Run 30207128316 (2026-07-26) parked and was never approved. With a           │
# │ WORKFLOW-level `concurrency: {group: release-<ref>, cancel-in-progress:      │
# │ false}` it held that group indefinitely; every later push queued behind it   │
# │ as `pending`; and GitHub keeps at most ONE pending run per group, so each    │
# │ new push cancelled the previous one. MEASURED: 99 of the last 100 runs are   │
# │ `cancelled` with ZERO jobs, each cancelled at the exact second the next push │
# │ arrived. No Version PR opened after #523, so nothing was published for a     │
# │ month and `kn-next` stayed a 404.                                            │
# │                                                                             │
# │ The environment gate is evaluated when a JOB STARTS, not when a step runs,   │
# │ so the publish job must be able to decide it has nothing to do WITHOUT       │
# │ starting. A job-level `if:` is evaluated first — hence the decision lives in │
# │ `publish-preflight`'s output, and `release` is skipped outright when there   │
# │ is nothing to publish. A skipped job never requests an approval, so it never │
# │ parks, so it never holds a group.                                            │
# │                                                                             │
# │ Concurrency is now PER JOB, in two different groups. A publish awaiting      │
# │ approval serialises later publishes (correct — two concurrent `changeset     │
# │ publish` runs are worse than a queue) and cannot touch the version lane.     │
# │ Neither group cancels in progress; `tests/ci-concurrency-group.test.ts`      │
# │ enforces that for every workflow that publishes or signs.                    │
# │ Guarded by `tests/release-lane-liveness.test.ts`, mutation-proved by         │
# │ `scripts/mutation-prove-release-lane.mjs`.                                   │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Publishable packages: @getknext/core (packages/kn-next), @getknext/lib (packages/lib),
# @getknext/db (packages/db) and the `kn-next` alias (packages/kn-next-alias) — core
# depends on lib AND db, db depends on lib; they are a changesets `fixed` group and
# must ship together or consumers 404 on the missing member (#255/#256).
# Provenance is enabled via each package's publishConfig.provenance + id-token permission.
#
# ┌─ DO NOT SHA-PIN-STRIP: KEEP THESE PINS (#522) ─────────────────────────┐
# │ Every `uses:` below is pinned to a full 40-char commit SHA, with the human   │
# │ version in a trailing comment. This is load-bearing, not style: the          │
# │ `changesets/action` step in the `release` job receives NODE_AUTH_TOKEN = the │
# │ live npm publish token (plus GITHUB_TOKEN with contents/pull-requests        │
# │ write). A mutable ref means whoever can move that ref chooses the code that  │
# │ runs with a publish credential in scope — and on changesets/action, `v1` is  │
# │ a BRANCH, not even a tag. Same rule security.md already applies to container │
# │ images ("pin by digest; reject :latest"), applied to the CI action supply    │
# │ chain. Bumps come from Dependabot's github-actions ecosystem                 │
# │ (.github/dependabot.yml) so pinning does not become staleness. Guarded by    │
# │ tests/release-action-pins.test.ts.                                           │
# │                                                                             │
# │ A BUMP HERE IS NOT SELF-CONTAINED. `changesets/action`'s major is coupled to │
# │ the `@changesets/cli` major in the ROOT package.json: action v1 <-> CLI v2,  │
# │ action v2 <-> CLI v3. The action validates this before it reads a single     │
# │ input and throws on a mismatch, so the Version-PR job dies and the whole     │
# │ lane below it never starts. It happened: #831 took the v1->v2 bump against   │
# │ CLI v2 and the first live run after the deadlock lifted (32850202919) failed │
# │ on exactly that. Guarded by tests/changesets-cli-action-compat.test.ts,      │
# │ mutation-proved by mutations 19-22 of the release-lane prover.               │
# └──────────────────────────────────────────────────────────────────────────────┘

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# NO workflow-level `concurrency:` — see the block above. A workflow-level group
# is what let one un-approved run starve every subsequent one. Concurrency is
# declared per job instead, in two groups that cannot block each other.

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance (--provenance)

jobs:
  # npm/JS supply-chain gate (v4-P3). The image Trivy gate scans containers; this
  # scans the PUBLISHED npm tarballs' PRODUCTION closure (--omit=dev) of
  # @getknext/{core,lib,db}, FAILS on HIGH/CRITICAL (mirrors security.md's Trivy
  # rule), and emits a CycloneDX SBOM per package. It is PUBLISH-BLOCKING: the
  # `release` job `needs: audit` (transitively and directly), so a failed audit
  # stops the publish — never advisory/after. scripts/audit-published.mjs is the
  # single source of truth for scope + audit-level; the dated+justified allowlist
  # is security/npm-audit-allowlist.json.
  audit:
    name: npm supply-chain audit + JS SBOM (blocks publish)
    runs-on: ubuntu-latest
    if: github.repository == 'getknext-dev/knext'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build in dependency order so the packed tarballs carry real dist/ (lib →
      # db → core) — audit-published.mjs packs each with `bun pm pack`, asserts
      # the rewritten workspace:^ sibling ranges match the co-packed versions
      # (bun rewrites from bun.lock, which drifts on every changeset bump —
      # #942 F1), and audits the resolved prod closure.
      - name: Build publishable packages
        run: bun run --filter @getknext/lib build && bun run --filter @getknext/db build && bun run --filter @getknext/core build

      # Audits the PUBLISHED production closure (--omit=dev, HIGH/CRITICAL) and
      # writes sbom/*.cdx.json. Non-zero exit here fails the job → blocks publish.
      - name: Audit published production closure + generate SBOMs
        run: node scripts/audit-published.mjs

      - name: Upload JS SBOMs (CycloneDX)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # The VERSION lane. Opens/updates the "Version Packages" PR and nothing else.
  #
  # It holds NO npm credential and declares NO environment, which is the whole
  # point: opening a PR is reversible, so it must not sit behind a human click.
  # This is the job whose month-long starvation was the actual release blocker.
  version-pr:
    name: Version PR (no credential, no approval)
    runs-on: ubuntu-latest
    needs: audit
    if: github.repository == 'getknext-dev/knext'
    concurrency:
      # Its OWN group: a publish parked on the environment approval lives in
      # `release-publish-*` and cannot queue anything up behind this one.
      group: release-version-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      # Underscore, not the action's own kebab key, so nothing downstream has to
      # dereference a dashed property name in an expression.
      has_changesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── The version bump MUST pass (FAIL-CLOSED) ──────────────────────────
      # Split out of the best-effort changesets/action step below so a REAL
      # release defect — a malformed changeset, a broken bump, a changelog hook
      # that throws — still turns this job RED. We run the exact command the
      # action runs (`bun run changeset:version`), assert it exits 0, then
      # RESTORE the tree so the action below still finds the changesets to
      # consume and opens/updates the PR from an identical starting point.
      #
      # Why this split exists: the action below does the bump AND the PR-open in
      # ONE step, and that step must be `continue-on-error` (see its comment).
      # Without validating the bump here first, that continue-on-error would
      # ALSO swallow a genuine version-bump failure — blanket-greening a real
      # defect, which is exactly what this must not do.
      - name: Verify the version bump succeeds (fail-closed)
        id: bump
        run: |
          set -euo pipefail
          bun run changeset:version
          # Undo it: the action below re-runs the same bump and opens the PR.
          # Restore tracked edits/deletions (package.json versions, CHANGELOGs,
          # the deleted .changeset/*.md) and drop the newly generated untracked
          # CHANGELOG files, so the action starts from the tree this step did.
          git checkout -- .
          git clean -fd

      # NO `publish-script` and NO `NODE_AUTH_TOKEN`: this step is structurally
      # incapable of publishing, which is what lets it run unapproved.
      #
      # ── Opening the PR is BEST-EFFORT (environment limit, not a defect) ────
      # `continue-on-error: true` is scoped to THIS step only. The getknext-dev
      # org/repo toggle "Allow GitHub Actions to create and approve pull
      # requests" is OFF — a human-only setting — so after the bump succeeds
      # this step ALWAYS ends in `HttpError: GitHub Actions is not permitted to
      # create or approve pull requests` and the Version PR is opened by hand
      # (as it always has been). That is an environment limitation, NOT a
      # release defect, so it must not paint the main CI rollup permanently red
      # — two permanently-red lanes trained the rollup to noise, which is how a
      # live HIGH CVE hid for a whole sprint. The bump above is already
      # fail-closed and the `release` publish job stays fully fail-closed; only
      # this PR-open is softened. The moment the org toggle is flipped on, this
      # step simply starts succeeding — no further change needed.
      - name: Create or update the Version Packages PR (best-effort)
        id: changesets
        continue-on-error: true
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # v2 RENAMED EVERY INPUT THIS STEP PASSES, and #831 took the v1→v2 pin
          # bump WITHOUT this migration (#749 had it, but was not what merged) —
          # GitHub Actions does NOT error on unknown `with:` keys, it ignores
          # them, so the step sat GREEN while set to run with every input
          # defaulted (no version script, no publish script, wrong commit
          # message), surfacing only at the next release. Caught by the #750
          # input-existence check on its first live run; migration mirrors #749.
          #   version              -> version-script
          #   publish              -> publish-script
          #   commit               -> commit-message
          #   title                -> pr-title
          #   createGithubReleases -> create-github-releases
          version-script: bun run changeset:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # Releases are created by the publish job, from the published set.
          create-github-releases: false
          # v2 requires the token as an INPUT. Its release notes are explicit that
          # "the GITHUB_TOKEN environment variable and credentials configured by
          # actions/checkout ... are not substitutes for this input" — so the env
          # var below is no longer sufficient on its own for the push.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── PUSH-INTEGRITY GATE: a swallowed push failure MUST stay red ───────
      # The `continue-on-error` above swallows more than the PR-create 403. The
      # action, BEFORE it opens the PR, pushes the `changeset-release/main`
      # branch with GITHUB_TOKEN (contents:write). So a real push failure —
      # reduced token scope, new branch protection, a rejected ref — is now
      # swallowed too, and must NOT be mistaken for the org PR-open limitation.
      #
      # This step runs ONLY when the best-effort step above actually failed
      # (`outcome == 'failure'` — its pre-continue-on-error result). When it
      # fails, we must distinguish the two causes.
      #
      # EXISTENCE IS NOT ENOUGH — assert FRESHNESS. The org toggle is
      # permanently off, so the action force-pushes `changeset-release/main`
      # every run and the branch PERSISTS between runs. A bare
      # `git ls-remote`/existence check would therefore go green on last run's
      # leftover even when THIS run's push failed — decoration by this repo's
      # own standard (green when its subject is removed), and the exact
      # unverified-cause falsehood this PR exists to kill, one level down. So we
      # fetch the branch and require THIS run's commit ($GITHUB_SHA) to be an
      # ANCESTOR of the pushed tip: the action bases the branch on the checked-out
      # HEAD and commits the bump on top, so a fresh push descends from
      # $GITHUB_SHA, while a stale leftover from an earlier main tip does not.
      #   - fresh push (descends from $GITHUB_SHA) -> only the PR-open was refused
      #     (the org toggle) — tolerated.
      #   - branch missing, unfetchable, OR stale  -> the PUSH failed — a real
      #     release defect — so FAIL the job.
      # A fetch failure is a FAILURE, never a pass (a network/ref error must not
      # read as "fresh"). NO continue-on-error, so `exit 1` reds the lane. On the
      # merge push (no changesets, action succeeds) `outcome` is 'success' and
      # this is skipped; if the fail-closed bump step failed, `outcome` is
      # 'skipped' and this is skipped too (the job is already red at the bump).
      - name: Assert the version branch push is FRESH (a real push failure stays red)
        if: steps.changesets.outcome == 'failure'
        run: |
          set -euo pipefail
          if ! git fetch --no-tags origin changeset-release/main; then
            echo "::error title=Version branch push failed::The version bump PASSED but 'changeset-release/main' could not be fetched from origin — the changesets/action branch push (GITHUB_TOKEN, contents:write) did not land it. That is a real release defect (reduced token scope, branch protection, a rejected ref), NOT the org PR-open limitation. Failing the job."
            exit 1
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "changeset-release/main on origin descends from $GITHUB_SHA — this run's version branch push is FRESH; only the PR-open was refused." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Version branch push failed (stale)::The version bump PASSED but 'changeset-release/main' on origin does NOT descend from this run's commit ($GITHUB_SHA) — this run's push FAILED and only a stale leftover from an earlier run remains. That is a real release defect (reduced token scope, branch protection, a rejected ref), NOT the org PR-open limitation. Failing the job."
            exit 1
          fi

      # ── HONEST NUDGE (only when it is genuinely the org limitation) ───────
      # Gated so it can NEVER assert a cause it did not verify: it runs only
      # when the bump SUCCEEDED (`steps.bump.outcome == 'success'`) AND the
      # PR-open step failed (`steps.changesets.outcome == 'failure'`). The
      # implicit `success()` on this un-annotated `if:` also requires the
      # push-integrity gate above to have PASSED — so if the push failed (gate
      # exited 1) this step is skipped and never prints "not a release defect".
      # The claim is therefore true by construction: bump passed, branch pushed,
      # only the PR-open was refused.
      - name: Report the Version PR must be opened by hand
        if: steps.bump.outcome == 'success' && steps.changesets.outcome == 'failure'
        run: |
          echo "::warning title=Version PR must be opened by hand::The version bump PASSED and 'changeset-release/main' was pushed; only opening the Version PR was refused because GitHub Actions cannot create PRs in getknext-dev (the org toggle is OFF, a human-only setting). Open or refresh the 'chore: version packages' PR by hand. This is an environment limitation, not a release defect."
          {
            echo "### Version PR: open by hand"
            echo "The version bump PASSED and the version branch was pushed. Opening the Version PR was refused by the standing org limitation (\`GitHub Actions is not permitted to create or approve pull requests\`), so open/refresh the \`chore: version packages\` PR by hand. Not a release defect."
          } >> "$GITHUB_STEP_SUMMARY"

  # Decide whether `release` should start AT ALL.
  #
  # This exists because the `npm-publish` environment gate fires when the job
  # STARTS. A publish job that starts on every push and then discovers it has
  # nothing to do would request an approval on every push, and each un-clicked
  # request parks a run — which is exactly the failure this workflow was
  # restructured to remove. So the decision has to be reachable from a job-level
  # `if:`, and a job-level `if:` can only read another job's outputs.
  #
  # No environment, no credential, no pnpm install: it is a registry read.
  publish-preflight:
    name: Is anything actually unpublished?
    runs-on: ubuntu-latest
    needs: version-pr
    # A run that just opened/updated a Version PR has nothing to publish yet —
    # the bump is on the PR branch, not on main.
    if: github.repository == 'getknext-dev/knext' && needs.version-pr.outputs.has_changesets == 'false'
    outputs:
      should_publish: ${{ steps.preflight.outputs['should-publish'] }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Fails closed if the registry is unreachable — an unanswerable question is
      # never answered "nothing to publish".
      - name: Compare tree versions against the registry
        id: preflight
        run: node scripts/publish-preflight.mjs

  release:
    name: Publish to npm (gated on NPM_TOKEN + environment approval)
    runs-on: ubuntu-latest
    # NPM_TOKEN lives as an ENVIRONMENT secret on `npm-publish`, not a repo
    # secret. Environment secrets are only injected into jobs that declare the
    # environment — without this line `secrets.NPM_TOKEN` resolves to the empty
    # string. Declaring it also lets the environment's protection rules
    # (`required_reviewers: AhmedElBanna80`, measured 2026-08-25) gate the
    # publish itself, which is the point of putting an irreversible action behind
    # an environment in the first place.
    environment: npm-publish
    # Publish-BLOCKING supply-chain gate: never publish tarballs the audit did
    # not clear (HIGH/CRITICAL fail-closed). `audit` is named directly as well as
    # reached transitively, so deleting an intermediate job cannot silently drop
    # it.
    needs: [audit, version-pr, publish-preflight]
    # Belt-and-suspenders: only ever run on the canonical repo (never forks).
    # BOTH halves of the "there is something to publish" question are asserted —
    # no pending changesets AND a version the registry does not have. Either one
    # alone lets a routine docs push request a publish approval.
    if: >-
      github.repository == 'getknext-dev/knext'
      && needs.version-pr.outputs.has_changesets == 'false'
      && needs.publish-preflight.outputs.should_publish == 'true'
    concurrency:
      # Its own group, so a publish waiting on the required reviewer serialises
      # only other publishes. Never cancels: a half-finished `changeset publish`
      # is worse than a queue.
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build in dependency order: @getknext/lib, then @getknext/db (depends on lib and
      # holds the `kn-next db migrate` runner, #242), then @getknext/core (type-imports
      # both). @getknext/lib/@getknext/db ship only dist/, so they must build first.
      - name: Build publishable packages
        run: bun run --filter @getknext/lib build && bun run --filter @getknext/db build && bun run --filter @getknext/core build

      # Gate the publish command WITHOUT referencing `secrets` inside the action's
      # `with:` input (that expression caused GitHub startup-failure runs).
      #
      # PRESENCE IS NOT VALIDITY. The environment secret was set 2026-07-25 and a
      # token can be present and expired; reporting "NPM_TOKEN present" as if it
      # meant "publish will work" is the kind of claim this repo does not make.
      # `npm whoami` answers the real question, and the branch is on its EXIT
      # CODE — npm's stderr wording has changed between majors and a message
      # match would rot silently.
      - name: Determine publish gate (token present AND accepted)
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on the npm-publish environment. This job only publishes; there is nothing it can do without it."
            exit 1
          fi
          if npm whoami --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "NPM_TOKEN is present and the registry accepted it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::NPM_TOKEN is PRESENT but the registry REJECTED it (npm whoami exited non-zero). Rotate the npm-publish environment secret; presence is not validity."
            exit 1
          fi
          echo "publish=bun run release" >> "$GITHUB_OUTPUT"

      # No `version-script` here on purpose: this job must never take the version
      # path. It is reached only when there are no changesets, and it is the one
      # job holding a publish credential.
      - name: Publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: ${{ steps.gate.outputs.publish }}
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # On publish, create one GitHub Release per published package, tagged
          # `@getknext/<pkg>@x.y.z`. The hand-made `v0.1.0` release predates this and
          # uses a different tag format, so there is no tag collision.
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Still exported: `changeset publish` and the gate script read it, and
          # NODE_AUTH_TOKEN is how npm authenticates. The github-token INPUT above
          # is what v2 uses for pushing; this is not redundant with it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
