# Re-derives every vinext quarantine-ledger entry from the runs it lists.
#
# The ledger records, per entry, the compat-vinext runs its snapshot came from
# (`evidence.fail` with each run's failing cases, and `evidence.pass` for a
# flaky entry). Validation alone cannot tell whether those runs exist, are the
# right lane's runs on `main`, used the default nextjsRef, have every shard
# present (a missing shard must never count as a pass), or say what the entry
# claims — so an unsupported entry could be relabelled flaky with an invented
# "passing" run and escape the stale rule. This job downloads every listed
# run's shard summaries plus its `gh api` metadata and re-runs `refresh` on
# them: any difference, an unfetchable run, a run off `main`/off this
# workflow/with a custom ref/missing a shard fails the check.
#
# ADVISORY ONLY — this workflow is deliberately NOT a required status check
# (nothing in branch protection references its job name). A red run here is a
# signal to fix the ledger before merging, but it cannot by itself block one;
# code review + spec review + CI green are what gate a PR (see
# .claude/rules/workflow.md). Every cited run's artifacts are also
# GitHub's standard 90 days: an entry whose evidence cites a run older than
# that can no longer be verified (or refreshed against the SAME runs) and
# needs `refresh` against fresh runs before its next renewal.
name: compat-vinext ledger evidence (advisory)

on:
  pull_request:
    paths:
      - test/compat-vinext-ledger.json
      - scripts/compat-vinext-ledger.mjs

permissions:
  contents: read
  actions: read

concurrency:
  group: compat-vinext-ledger-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Ledger evidence re-derives from its listed runs (advisory, not a required check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Re-derive every entry from the runs it lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/compat-vinext-ledger.mjs verify --ledger test/compat-vinext-ledger.json
