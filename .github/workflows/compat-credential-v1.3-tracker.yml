name: Compat v1.3 credential matrix tracker

# ── The v1.3 line's own aggregate credential view ───────────────────────────
# The v1.3 line earns its four-cell (node/bun × turbopack/webpack) 14-night
# credential IN PARALLEL with v1.0's, on its own RC tag
# (.github/compat-credential-ref-v1.3.json) and its own derived workflow
# (compat-credential-v1.3.yml). This refreshes ONE issue for that line — the
# "Compat v1.3 credential matrix tracker" — with a daily comment, the same way
# compat-matrix-tracker-nightly.yml does for v1.0.
#
# Separation from v1.0 (scripts/compat-line-tracker.mjs): it audits only
# compat-credential-v1.3.yml's runs, grades them on that file's own crons, holds
# a cell unmet if any night ran a tag off the v1.3 line, and it NEVER pins —
# GitHub's 3-pin cap belongs to the v1.0 tracker, whose job fails when it
# cannot pin.
#
# 05:23 UTC — past the audit's missing-night grace (MISSING_NIGHT_GRACE_HOURS,
# 10 h) of every v1.3 slot of the previous UTC day: 14:17, 15:47, 17:17 and
# 18:47 UTC (+10 h = 04:47), and before the next day's first slot. Guarded by
# tests/compat-credential-line.test.ts.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      dispatch_reason:
        description: 'Why this is being run manually'
        required: false
        type: string
        default: 'manual verification run'

permissions:
  contents: read

jobs:
  line-tracker:
    name: Refresh the v1.3 credential matrix tracker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level block REPLACES the top-level one: restate every scope.
    # `actions: read` is what `gh run list` / `gh run download` need to read the
    # credential workflow's runs and ledgers; without it every night reads back
    # unresolved, which the script refuses to publish.
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Audit the v1.3 credential matrix and update its tracker issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node scripts/compat-line-tracker.mjs --line v1.3 --fetch --run-url "${RUN_URL}"
