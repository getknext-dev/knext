name: Standalone deploy — kind e2e (build-id lock-step, private visibility)

# #1417: every `kn-next deploy` of the DEFAULT standalone target (turbopack)
# on Next >= 16.2.11 died on the `.next/BUILD_ID == tag` guard, because knext
# exported NEXT_DEPLOYMENT_ID before `next build` and Next then writes the
# constant `build-TfctsWXpff2fKS` and ignores `generateBuildId`. No lane caught
# it: the nightlies deploy vinext apps, and the compat lanes use their own
# deploy script rather than `kn-next deploy`.
#
# This lane runs the REAL CLI end to end on both default builders
# (turbopack, webpack — #1733) at the Next version the scaffold pins
# (16.3.6): `kn-next deploy` -> NextApp CR -> the operator built from HEAD ->
# Knative on an ephemeral kind cluster. It asserts the built `.next/BUILD_ID`
# IS the deploy tag, the CR carries that `spec.buildId`, the NextApp goes
# Ready, and `/api/health` answers 200 — the same health check on every leg.
#
# Job shape reused from `standalone-self-contained-operator-e2e.yml` (#1554,
# the self-contained variant, which needs its own operator change): same
# fixture staged outside the repo, same local-registry + certs.d recipe as
# `file-manager-platform-e2e-nightly.yml`. Both runtimes AND both default
# builders (turbopack, webpack) run, since all four are v1.0 cells (#1733).
#
# #1865: this lane also carries the private-visibility (cluster-local)
# coverage — a SECOND `kn-next deploy` on the SAME already-warm cluster,
# reusing the already-pushed digest via `--image` (no rebuild), with
# `--private`. It asserts the rendered ksvc carries the Knative cluster-local
# label, that the external Kourier gateway (svc/kourier, not
# svc/kourier-internal) has no route for it (404), and that it IS reachable
# from inside the cluster through kourier-internal with the Host header. No
# new workflow, no new cluster — same reasoning as the build-id check above:
# reuse the infrastructure this lane already stands up.
#
# Scheduled weekly on top of the path-filtered PR/push triggers (#1733): the
# path filters above only fire this lane when one of the listed files
# changes, so a credential-window stretch where none of them change never
# runs it at all. Wed 10:23 UTC is off every credential slot (22:17, 23:47,
# 01:17, 03:17, 04:47, 05:47 UTC + ~1h runtime each) and off the hour used by
# every other WEEKLY lane (compat-vinext.yml Sun 07:17, bun-base-build.yml
# Mon 04:17, operator-upgrade-e2e.yml Mon 04:11, mutation-prover-nightly.yml
# Sun 06:07, file-manager-platform-e2e-nightly.yml Sun 04:37,
# operator-e2e-nightly.yml Sun 03:29) — checked against
# `tests/ci-capacity-budget.test.ts`'s repo-wide cron-overlap scan, which
# would red on any genuine collision. Non-required: nothing in branch
# protection names this job.

on:
  schedule:
    - cron: '23 10 * * 3'
  pull_request:
    paths:
      - 'packages/kn-next/src/cli/deploy.ts'
      - 'packages/kn-next/src/cli/build-id-env.ts'
      - 'packages/kn-next/src/cli/cr-builder.ts'
      - 'packages/kn-next/src/cli/runtime-image.ts'
      - 'packages/kn-next/src/cli/project-build.ts'
      - 'packages/kn-next/src/cli/build-artifact.ts'
      - 'packages/kn-next/src/cli/standalone-exec-build.ts'
      - 'packages/kn-next/src/cli/validate.ts'
      - 'packages/kn-next/src/cli/help.ts'
      - 'packages/kn-next/src/config.ts'
      - 'packages/kn-next-operator/api/v1alpha1/nextapp_types.go'
      - 'packages/kn-next-operator/internal/controller/nextapp_controller.go'
      - 'packages/kn-next-operator/internal/controller/private_exposure.go'
      - 'packages/kn-next-operator/internal/controller/status_verdict.go'
      - 'packages/kn-next/templates/app/next.config.ts.hbs'
      - 'packages/kn-next/templates/runtime-standalone/**'
      - 'packages/kn-next/src/__tests__/fixtures/standalone-drain-app/**'
      - '.github/workflows/standalone-deploy-kind-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/kn-next/src/cli/deploy.ts'
      - 'packages/kn-next/src/cli/build-id-env.ts'
      - 'packages/kn-next/src/cli/cr-builder.ts'
      - 'packages/kn-next/src/cli/runtime-image.ts'
      - 'packages/kn-next/src/cli/project-build.ts'
      - 'packages/kn-next/src/cli/build-artifact.ts'
      - 'packages/kn-next/src/cli/standalone-exec-build.ts'
      - 'packages/kn-next/src/cli/validate.ts'
      - 'packages/kn-next/src/cli/help.ts'
      - 'packages/kn-next/src/config.ts'
      - 'packages/kn-next-operator/api/v1alpha1/nextapp_types.go'
      - 'packages/kn-next-operator/internal/controller/nextapp_controller.go'
      - 'packages/kn-next-operator/internal/controller/private_exposure.go'
      - 'packages/kn-next-operator/internal/controller/status_verdict.go'
      - 'packages/kn-next/templates/app/next.config.ts.hbs'
      - 'packages/kn-next/templates/runtime-standalone/**'
      - 'packages/kn-next/src/__tests__/fixtures/standalone-drain-app/**'
      - '.github/workflows/standalone-deploy-kind-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  standalone-deploy-e2e:
    name: standalone (${{ matrix.builder }}, ${{ matrix.runtime }}) through kn-next deploy on kind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
        builder: [turbopack, webpack]
    env:
      CLUSTER: standalone-e2e
      APP_NS: standalone-e2e
      APP_NAME: standalone-e2e
      NEXT_VERSION: 16.3.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache-dependency-path: packages/kn-next-operator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build the workspace packages + the kn-next CLI
        run: |
          set -euo pipefail
          bun run --filter "@getknext/lib" build
          bun run --filter "@getknext/db" build
          bun run --filter "@getknext/core" build
          test -f packages/kn-next/dist/cli/kn-next.js

      # Same closure/rewrite the compat harness lane packs (test-e2e-deploy.yml
      # "Pack knext adapter tarballs"), now via the SAME shared packer
      # `release.yml`'s `pack` job uses (`scripts/pack-release-tarballs.mjs`):
      # `npm pack` — never `bun pm pack` (#1614) — after
      # `rewrite-workspace-ranges.mjs` resolves the `workspace:^` deps
      # @getknext/core carries on @getknext/lib + @getknext/db to a real
      # semver, which is what makes the tarballs npm-installable standalone.
      # `npm pack` is the tool `changeset publish` actually shells to for a
      # bun workspace, so this lane installs+exercises the SAME bytes that
      # ship, rather than `bun pm pack`'s (a different rewrite source, and —
      # measured, #1562 — a duplicate tar entry for a multi-`bin`-key target).
      - name: Pack knext adapter tarballs (npm pack — the real publish tool, #1614)
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/knext-tarballs"
          node scripts/pack-release-tarballs.mjs --dest "${DEST}" \
            --dirs packages/lib,packages/db,packages/kn-next
          ls -la "${DEST}"
          echo "TARBALLS_DIR=${DEST}" >> "$GITHUB_ENV"

      # Staged OUTSIDE the repo (a real app is its own project dir; in place,
      # Next's tracing root and the docker context collapse onto the monorepo
      # root). Next is moved to the version the scaffold pins; on the
      # turbopack leg the build script stays the fixture's plain `next
      # build` and no `build` key is set in the config (absent means
      # turbopack, ADR-0054); on the webpack leg both are switched to
      # `--webpack` below (#1733). Both are the DEFAULT builders — this lane
      # proves both on a real cluster.
      #
      # The Docker build context IS this directory (`kn-next deploy` builds
      # from `process.cwd()`), and `Dockerfile.standalone` COPYs `public` and
      # `node_modules/@getknext/core` from it unconditionally — the drain
      # fixture has neither (it is a minimal SIGTERM-drain fixture, not a
      # real scaffolded app), so both are staged here, matching how
      # `scripts/e2e-deploy.sh` installs the packed adapter tarballs into a
      # fixture (`npm install --no-save` all three tarballs in one reify so
      # npm resolves @getknext/core's lib/db deps from the local tarballs
      # rather than the registry) rather than a hand-rolled copy.
      - name: Stage the fixture app outside the repo + install its own dependencies
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/standalone-app"
          cp -R packages/kn-next/src/__tests__/fixtures/standalone-drain-app "$APP_DIR"
          cd "$APP_DIR"
          npm pkg set "dependencies.next=${NEXT_VERSION}"
          grep -q '"build": "next build"' package.json
          grep -q 'KNEXT_BUILD_ID' next.config.js
          # The `build` key selects the builder (ADR-0054); absent means
          # turbopack. The webpack leg needs BOTH the config key AND the
          # fixture's own `build` script to carry `--webpack`
          # (project-build.ts's guard reads the app's package.json script,
          # not the config) — same `.next/standalone` shape either way.
          if [ "${{ matrix.builder }}" = "webpack" ]; then
            npm pkg set "scripts.build=next build --webpack"
            BUILD_KEY_LINE='build: "webpack",'
          else
            BUILD_KEY_LINE=''
          fi
          cat > knext.config.ts <<EOF
          const config = {
            name: "${APP_NAME}",
            runtime: "${{ matrix.runtime }}",
            ${BUILD_KEY_LINE}
            registry: "localhost:5001",
            healthCheckPath: "/api/health",
            scaling: { minScale: 0, maxScale: 1, memoryRequest: "256Mi", memoryLimit: "512Mi" },
          };
          export default config;
          EOF
          bun install
          node -e "const v=require('./node_modules/next/package.json').version; if (v !== process.env.NEXT_VERSION) { console.error('next is ' + v); process.exit(1) }"
          mkdir -p public
          LIB_TGZ="$(find "${TARBALLS_DIR}" -maxdepth 1 -name 'getknext-lib-*.tgz' | sort | tail -n1)"
          DB_TGZ="$(find "${TARBALLS_DIR}" -maxdepth 1 -name 'getknext-db-*.tgz' | sort | tail -n1)"
          CORE_TGZ="$(find "${TARBALLS_DIR}" -maxdepth 1 -name 'getknext-core-*.tgz' | sort | tail -n1)"
          npm install --no-save --no-audit --no-fund "${LIB_TGZ}" "${DB_TGZ}" "${CORE_TGZ}"
          test -d node_modules/@getknext/core
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=r${GITHUB_RUN_ID}-${{ matrix.builder }}-${{ matrix.runtime }}" >> "$GITHUB_ENV"

      - name: Create kind cluster (registry certs.d config_path)
        run: |
          set -euo pipefail
          cat <<'YAML' | kind create cluster --name "$CLUSTER" --wait 120s --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            [plugins."io.containerd.grpc.v1.cri".registry]
              config_path = "/etc/containerd/certs.d"
          YAML

      - name: Start in-cluster registry + wire the kind node to it
        run: |
          set -euo pipefail
          reg=kind-registry
          docker run -d --restart=always -p 127.0.0.1:5001:5000 --name "$reg" \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker network connect kind "$reg"
          node="${CLUSTER}-control-plane"
          docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
          printf '[host."http://%s:5000"]\n' "$reg" \
            | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml

      - name: Install cert-manager
        run: |
          set -euo pipefail
          scripts/kind-manifests/apply-cert-manager.sh
          kubectl wait --for=condition=Available --timeout=300s \
            -n cert-manager deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector

      - name: Install Knative Serving + Kourier
        run: |
          set -euo pipefail
          V="knative-v1.16.0"
          scripts/kind-manifests/apply-knative-kourier.sh "${V}"
          kubectl patch configmap/config-network -n knative-serving --type merge \
            --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
          kubectl wait --for=condition=Available --timeout=300s \
            -n knative-serving deployment/controller deployment/webhook deployment/autoscaler deployment/net-kourier-controller

      - name: Build + deploy the operator from HEAD
        working-directory: packages/kn-next-operator
        run: |
          set -euo pipefail
          IMG=example.com/kn-next-operator:e2e
          for attempt in 1 2 3; do
            make docker-build IMG="$IMG" && break
            [ "$attempt" = 3 ] && { echo "::error::operator image build failed 3x"; exit 1; }
            echo "docker-build attempt $attempt failed; retrying"; sleep 10
          done
          kind load docker-image "$IMG" --name "$CLUSTER"
          make install
          make deploy IMG="$IMG"
          kubectl rollout status deployment/kn-next-operator-controller-manager \
            -n kn-next-operator-system --timeout=180s
          # #1591: deployment/... Available only means the pod passed its own
          # readiness probe -- it does NOT mean cert-manager has finished
          # issuing the serving cert and its cainjector has patched the
          # ValidatingWebhookConfiguration's caBundle, nor that the webhook
          # Service has a routable endpoint yet. Applying a NextApp before
          # both are true intermittently fails admission with "the NextApp
          # admission webhook could not be reached" -- a lane race, not a
          # CLI/operator field-skew problem (see the CLI's own preflight
          # error text). Close the window explicitly before the first apply.
          kubectl wait --for=condition=Ready --timeout=120s \
            -n kn-next-operator-system certificate/kn-next-operator-serving-cert
          kubectl wait --for=jsonpath='{.subsets[0].addresses[0]}' --timeout=120s \
            -n kn-next-operator-system endpoints/kn-next-operator-webhook-service
          # #1594 round 2: a Ready Certificate + a routable Endpoint still
          # raced with cainjector's caBundle patch and the apiserver's own
          # webhook client -- see the script for the run that proved it.
          "${GITHUB_WORKSPACE}/scripts/kind-manifests/wait-for-webhook-ready.sh"

      - name: Namespace
        run: kubectl create namespace "$APP_NS"

      # Through the product. A runner-level NEXT_DEPLOYMENT_ID is exported on
      # purpose: a CI environment that sets it must not put Next back on the
      # constant-build-id path — knext unsets it for the standalone build.
      - name: kn-next deploy (${{ matrix.builder }}, ${{ matrix.runtime }})
        env:
          NEXT_DEPLOYMENT_ID: inherited-from-the-runner
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          node "${GITHUB_WORKSPACE}/packages/kn-next/dist/cli/kn-next.js" deploy \
            --registry localhost:5001 --namespace "$APP_NS" --tag "$DEPLOY_TAG"

      - name: Assert the build id IS the deploy tag (build + CR)
        run: |
          set -euo pipefail
          built="$(cat "$APP_DIR/.next/BUILD_ID")"
          echo ".next/BUILD_ID=${built} tag=${DEPLOY_TAG}"
          if [ "$built" != "$DEPLOY_TAG" ]; then
            echo "::error::.next/BUILD_ID is '${built}', want the deploy tag '${DEPLOY_TAG}'"; exit 1
          fi
          cr="$(kubectl -n "$APP_NS" get nextapp "$APP_NAME" -o jsonpath='{.spec.buildId}')"
          echo "spec.buildId=${cr}"
          if [ "$cr" != "$DEPLOY_TAG" ]; then
            echo "::error::NextApp spec.buildId is '${cr}', want '${DEPLOY_TAG}'"; exit 1
          fi

      - name: Wait for the NextApp to go Ready
        run: |
          set -euo pipefail
          kubectl -n "$APP_NS" wait --for=condition=Ready --timeout=300s "nextapp/$APP_NAME" \
            || (kubectl -n "$APP_NS" get nextapp,ksvc,pods -o wide; kubectl -n "$APP_NS" describe "nextapp/$APP_NAME"; exit 1)

      - name: Reach the cluster (kourier-internal port-forward) and hit /api/health
        run: |
          set -euo pipefail
          kubectl -n kourier-system port-forward svc/kourier-internal 8080:80 >/tmp/pf-kourier.log 2>&1 &
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null; then break; fi
            sleep 1
          done
          host="$(kubectl -n "$APP_NS" get nextapp "$APP_NAME" -o jsonpath='{.status.url}' | sed -e 's#^https\?://##')"
          if [ -z "$host" ]; then
            echo "::error::nextapp status.url is empty"; kubectl -n "$APP_NS" get nextapp "$APP_NAME" -o yaml; exit 1
          fi
          code="$(curl -s -o /tmp/health-body.json -w '%{http_code}' -H "Host: ${host}" http://127.0.0.1:8080/api/health)"
          echo "GET /api/health -> $code"
          cat /tmp/health-body.json
          if [ "$code" != "200" ]; then
            echo "::error::/api/health returned $code, want 200"; exit 1
          fi

      # #1865: a SECOND NextApp, deployed `--private`, reusing the image the
      # first deploy already pushed (via `--image`, which implies
      # --skip-build/--skip-upload — no rebuild). Its own minimal
      # knext.config.ts mirrors the fixture's runtime/build so the operator
      # renders the same containerCommand for the SAME image digest.
      - name: Deploy a second, cluster-local NextApp (--private)
        run: |
          set -euo pipefail
          img="$(kubectl -n "$APP_NS" get nextapp "$APP_NAME" -o jsonpath='{.spec.image}')"
          if [ -z "$img" ]; then
            echo "::error::could not resolve spec.image from nextapp/$APP_NAME"; exit 1
          fi
          echo "reusing image: $img"

          PRIVATE_APP_NAME="${APP_NAME}-private"
          PRIVATE_APP_DIR="${RUNNER_TEMP}/standalone-app-private"
          mkdir -p "$PRIVATE_APP_DIR"
          cd "$PRIVATE_APP_DIR"
          if [ "${{ matrix.builder }}" = "webpack" ]; then
            BUILD_KEY_LINE='build: "webpack",'
          else
            BUILD_KEY_LINE=''
          fi
          cat > knext.config.ts <<EOF
          const config = {
            name: "${PRIVATE_APP_NAME}",
            runtime: "${{ matrix.runtime }}",
            ${BUILD_KEY_LINE}
            registry: "localhost:5001",
            healthCheckPath: "/api/health",
            scaling: { minScale: 0, maxScale: 1, memoryRequest: "256Mi", memoryLimit: "512Mi" },
          };
          export default config;
          EOF

          node "${GITHUB_WORKSPACE}/packages/kn-next/dist/cli/kn-next.js" deploy \
            --image "$img" --namespace "$APP_NS" --tag "${DEPLOY_TAG}-private" --private

          echo "PRIVATE_APP_NAME=${PRIVATE_APP_NAME}" >> "$GITHUB_ENV"

      - name: Wait for the private NextApp to go Ready, and assert the cluster-local label
        run: |
          set -euo pipefail
          kubectl -n "$APP_NS" wait --for=condition=Ready --timeout=120s "nextapp/$PRIVATE_APP_NAME" \
            || (kubectl -n "$APP_NS" get nextapp,ksvc,pods -o wide; kubectl -n "$APP_NS" describe "nextapp/$PRIVATE_APP_NAME"; exit 1)

          label="$(kubectl -n "$APP_NS" get ksvc "$PRIVATE_APP_NAME" -o jsonpath='{.metadata.labels.networking\.knative\.dev/visibility}')"
          echo "ksvc networking.knative.dev/visibility = ${label}"
          if [ "$label" != "cluster-local" ]; then
            echo "::error::ksvc/$PRIVATE_APP_NAME is missing the cluster-local visibility label (got '${label}')"; exit 1
          fi

      # A DomainMapping targeting a cluster-local app is routed on the PUBLIC
      # ingress by Knative, so the operator must flag it with the
      # PrivateExposure condition (read-only: it never touches the mapping) and
      # clear it once the mapping is gone. The mapping is removed again BEFORE
      # the unreachable-from-outside assertion below, so it cannot pollute it.
      - name: Assert a DomainMapping on the private app raises PrivateExposure, and removing it clears it
        run: |
          set -euo pipefail
          cat <<EOF | kubectl apply -f -
          apiVersion: serving.knative.dev/v1beta1
          kind: DomainMapping
          metadata:
            name: private-app.example.test
            namespace: ${APP_NS}
          spec:
            ref:
              apiVersion: serving.knative.dev/v1
              kind: Service
              name: ${PRIVATE_APP_NAME}
              namespace: ${APP_NS}
          EOF
          cond() {
            kubectl -n "$APP_NS" get nextapp "$PRIVATE_APP_NAME" \
              -o jsonpath='{.status.conditions[?(@.type=="PrivateExposure")].status}'
          }
          ok=""
          for _ in $(seq 1 60); do
            if [ "$(cond)" = "True" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::PrivateExposure=True never appeared for a DomainMapping targeting ${PRIVATE_APP_NAME}"
            kubectl -n "$APP_NS" get nextapp "$PRIVATE_APP_NAME" -o yaml; exit 1
          fi
          kubectl -n "$APP_NS" delete domainmapping.serving.knative.dev private-app.example.test --wait=true
          cleared=""
          for _ in $(seq 1 60); do
            if [ -z "$(cond)" ]; then cleared=1; break; fi
            sleep 2
          done
          if [ -z "$cleared" ]; then
            echo "::error::PrivateExposure was not cleared after the DomainMapping was deleted"
            kubectl -n "$APP_NS" get nextapp "$PRIVATE_APP_NAME" -o yaml; exit 1
          fi

      - name: Assert the private app is UNREACHABLE from outside the cluster (external Kourier -> 404)
        run: |
          set -euo pipefail
          kubectl -n kourier-system port-forward svc/kourier 8081:80 >/tmp/pf-kourier-external.log 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8081) 2>/dev/null; then break; fi
            sleep 1
          done
          host="$(kubectl -n "$APP_NS" get nextapp "$PRIVATE_APP_NAME" -o jsonpath='{.status.url}' | sed -e 's#^https\?://##')"
          if [ -z "$host" ]; then
            echo "::error::private nextapp status.url is empty"; kubectl -n "$APP_NS" get nextapp "$PRIVATE_APP_NAME" -o yaml; exit 1
          fi
          code="$(curl -s -o /tmp/private-external-body.txt -w '%{http_code}' -H "Host: ${host}" http://127.0.0.1:8081/api/health)"
          echo "external GET /api/health (private app) -> $code"
          cat /tmp/private-external-body.txt
          kill "$pf_pid" 2>/dev/null || true
          trap - EXIT
          if [ "$code" != "404" ]; then
            echo "::error::external Kourier route for the PRIVATE app returned $code, want 404 (no public route for a cluster-local-only app)"; exit 1
          fi

      - name: Assert the private app IS reachable from inside the cluster (kourier-internal -> 200)
        run: |
          set -euo pipefail
          kubectl -n kourier-system port-forward svc/kourier-internal 8082:80 >/tmp/pf-kourier-internal-private.log 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8082) 2>/dev/null; then break; fi
            sleep 1
          done
          host="$(kubectl -n "$APP_NS" get nextapp "$PRIVATE_APP_NAME" -o jsonpath='{.status.url}' | sed -e 's#^https\?://##')"
          code="$(curl -s -o /tmp/private-internal-body.json -w '%{http_code}' -H "Host: ${host}" http://127.0.0.1:8082/api/health)"
          echo "internal (kourier-internal) GET /api/health (private app) -> $code"
          cat /tmp/private-internal-body.json
          kill "$pf_pid" 2>/dev/null || true
          trap - EXIT
          if [ "$code" != "200" ]; then
            echo "::error::kourier-internal route for the PRIVATE app returned $code, want 200"; exit 1
          fi

      # #1865 round 2 (spec review): a LATER plain redeploy (no --private,
      # and this fixture's knext.config.ts never sets networking.visibility)
      # must REFUSE rather than silently make the app public again — see
      # assertVisibilityDowngradeIsExplicit in deploy.ts. Proves the guard
      # against the REAL CLI + a REAL live NextApp, not just the hermetic TS
      # unit test.
      - name: A plain redeploy (no --private) of the now-private app MUST REFUSE
        run: |
          set -euo pipefail
          img="$(kubectl -n "$APP_NS" get nextapp "$APP_NAME" -o jsonpath='{.spec.image}')"
          cd "${RUNNER_TEMP}/standalone-app-private"
          set +e
          node "${GITHUB_WORKSPACE}/packages/kn-next/dist/cli/kn-next.js" deploy \
            --image "$img" --namespace "$APP_NS" --tag "${DEPLOY_TAG}-private-redeploy" \
            >/tmp/plain-redeploy.log 2>&1
          code=$?
          set -e
          cat /tmp/plain-redeploy.log
          if [ "$code" -eq 0 ]; then
            echo "::error::a plain redeploy with no --private succeeded — it should have REFUSED to silently make the private app public"; exit 1
          fi
          grep -qi -- '--public' /tmp/plain-redeploy.log || {
            echo "::error::the refusal message does not mention --public"; exit 1
          }

      - name: After the refused redeploy, the private app is STILL unreachable from outside
        run: |
          set -euo pipefail
          kubectl -n kourier-system port-forward svc/kourier 8083:80 >/tmp/pf-kourier-external-recheck.log 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8083) 2>/dev/null; then break; fi
            sleep 1
          done
          host="$(kubectl -n "$APP_NS" get nextapp "$PRIVATE_APP_NAME" -o jsonpath='{.status.url}' | sed -e 's#^https\?://##')"
          code="$(curl -s -o /tmp/private-external-recheck-body.txt -w '%{http_code}' -H "Host: ${host}" http://127.0.0.1:8083/api/health)"
          echo "external GET /api/health (private app, after the refused redeploy) -> $code"
          cat /tmp/private-external-recheck-body.txt
          kill "$pf_pid" 2>/dev/null || true
          trap - EXIT
          if [ "$code" != "404" ]; then
            echo "::error::after the refused redeploy the external Kourier route returned $code, want 404 — the app must have stayed private"; exit 1
          fi
          label="$(kubectl -n "$APP_NS" get ksvc "$PRIVATE_APP_NAME" -o jsonpath='{.metadata.labels.networking\.knative\.dev/visibility}')"
          if [ "$label" != "cluster-local" ]; then
            echo "::error::ksvc/$PRIVATE_APP_NAME lost its cluster-local label after the refused redeploy (got '${label}')"; exit 1
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$APP_NS" get nextapp,ksvc,configuration,revision,pods -o wide 2>&1 || true
          kubectl -n "$APP_NS" get "nextapp/$APP_NAME" -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' 2>&1 || true
          if [ -n "${PRIVATE_APP_NAME:-}" ]; then
            kubectl -n "$APP_NS" get "nextapp/$PRIVATE_APP_NAME" -o yaml 2>&1 || true
            kubectl -n "$APP_NS" get "nextapp/$PRIVATE_APP_NAME" -o jsonpath='{range .status.conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}' 2>&1 || true
          fi
          kubectl -n "$APP_NS" get events --sort-by=.lastTimestamp 2>&1 | tail -30 || true
          kubectl -n kn-next-operator-system logs deploy/kn-next-operator-controller-manager --tail=100 2>&1 || true
          for p in $(kubectl -n "$APP_NS" get pods -l "serving.knative.dev/service=$APP_NAME" -o name 2>/dev/null); do
            kubectl -n "$APP_NS" logs "$p" --all-containers --tail=80 2>&1 || true
          done
          if [ -n "${PRIVATE_APP_NAME:-}" ]; then
            for p in $(kubectl -n "$APP_NS" get pods -l "serving.knative.dev/service=$PRIVATE_APP_NAME" -o name 2>/dev/null); do
              kubectl -n "$APP_NS" logs "$p" --all-containers --tail=80 2>&1 || true
            done
          fi
          cat /tmp/plain-redeploy.log 2>&1 || true

      - name: Tear down
        if: always()
        run: |
          kind delete cluster --name "$CLUSTER" || true
          docker rm -f kind-registry || true
