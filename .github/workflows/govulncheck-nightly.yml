name: govulncheck nightly

# A dated govulncheck exception (security/govulncheck-exceptions.json) must stop
# passing ON its expiry date, not whenever the next PR happens to touch the Go
# template. go-template.yml only runs on path-filtered events, so this nightly
# runs the same fail-closed gate over BOTH lane refs, the way
# mutation-prover-nightly.yml does: a `schedule:` trigger only fires from the
# default branch's copy of this file (main), so the integration/v2 content it must
# prove is reached by checking the ref out explicitly. A ref that carries no Go
# template (main, today) skips its steps by FILE PRESENCE, so the lane turns on by
# itself when the template lands there.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck gate (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ref: [main, integration/v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Go (templates/go/go.mod)
        if: ${{ hashFiles('templates/go/go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: templates/go/go.mod
          cache-dependency-path: templates/go/go.sum

      - name: Setup Node.js
        if: ${{ hashFiles('templates/go/go.mod') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: govulncheck (pinned) through the fail-closed gate
        if: ${{ hashFiles('templates/go/go.mod') != '' }}
        working-directory: templates/go
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... | node "$GITHUB_WORKSPACE/scripts/govulncheck-gate.mjs"
