name: Public hosts — kind e2e (spec.networking.publicHosts -> KNEXT_PUBLIC_ORIGINS)

# `networking.publicHosts` in knext.config.ts is sent by the real CLI as
# `spec.networking.publicHosts`; the operator built from HEAD renders it as the
# KNEXT_PUBLIC_ORIGINS allowlist; the app's runtime then rewrites a redirect
# built from `request.url` (which Next gives the pod's 0.0.0.0 bind address)
# to the public host. This lane proves the whole chain on an ephemeral kind
# cluster with Knative + Kourier:
#
#   1. `kn-next deploy` applies a NextApp whose config sets publicHosts (the
#      deploy preflight server-side dry-runs it with --validate=strict, so the
#      CRD must already know the field: operator/CRD first, then CLI);
#   2. the CR carries the field, the Knative Service carries exactly one
#      KNEXT_PUBLIC_ORIGINS in list order, and so does the running pod;
#   3. `GET /go` through Kourier — a route handler that redirects with
#      `new URL('/article/one', request.url)` — answers the PUBLIC host, never
#      0.0.0.0; an allowlisted X-Forwarded-Host selects its own entry and a
#      forged one falls back to the first;
#   4. the pod log carries the `PUBLIC_ORIGINS:` boot line.
#
# The routes under test are the public-origin-redirect fixture's
# (packages/kn-next/src/__tests__/fixtures/public-origin-redirect), overlaid on
# the minimal standalone fixture the other kind lanes deploy so the app also
# has /api/health. The assertions live in scripts/public-hosts-e2e-assert.sh,
# which can be run against any kind cluster that already has the operator,
# Knative and Kourier.
#
# Job shape reused from standalone-deploy-kind-e2e.yml (same fixture staging,
# local registry + certs.d recipe, operator build). Path-filtered PR/push plus
# manual dispatch; no schedule. Non-required: nothing in branch protection
# names this job.

on:
  pull_request:
    paths:
      - 'packages/kn-next/src/cli/cr-builder.ts'
      - 'packages/kn-next/src/cli/validate.ts'
      - 'packages/kn-next/src/cli/schema/**'
      - 'packages/kn-next/src/config.ts'
      - 'packages/kn-next/src/adapters/public-origin.cjs'
      - 'packages/kn-next-operator/api/v1alpha1/nextapp_types.go'
      - 'packages/kn-next-operator/internal/controller/nextapp_controller.go'
      - 'packages/kn-next-operator/internal/controller/public_hosts.go'
      - 'packages/kn-next-operator/config/crd/bases/apps.kn-next.dev_nextapps.yaml'
      - 'packages/kn-next/src/__tests__/fixtures/public-origin-redirect/**'
      - 'packages/kn-next/src/__tests__/fixtures/standalone-drain-app/**'
      - 'scripts/public-hosts-e2e-assert.sh'
      - '.github/workflows/public-hosts-kind-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'packages/kn-next/src/cli/cr-builder.ts'
      - 'packages/kn-next/src/cli/validate.ts'
      - 'packages/kn-next/src/cli/schema/**'
      - 'packages/kn-next/src/config.ts'
      - 'packages/kn-next/src/adapters/public-origin.cjs'
      - 'packages/kn-next-operator/api/v1alpha1/nextapp_types.go'
      - 'packages/kn-next-operator/internal/controller/nextapp_controller.go'
      - 'packages/kn-next-operator/internal/controller/public_hosts.go'
      - 'packages/kn-next-operator/config/crd/bases/apps.kn-next.dev_nextapps.yaml'
      - 'packages/kn-next/src/__tests__/fixtures/public-origin-redirect/**'
      - 'packages/kn-next/src/__tests__/fixtures/standalone-drain-app/**'
      - 'scripts/public-hosts-e2e-assert.sh'
      - '.github/workflows/public-hosts-kind-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  public-hosts-e2e:
    name: publicHosts (${{ matrix.runtime }}) through kn-next deploy on kind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    env:
      CLUSTER: public-hosts-e2e
      APP_NS: public-hosts-e2e
      APP_NAME: public-hosts-e2e
      NEXT_VERSION: 16.3.8
      PUBLIC_HOST_1: www.example.com
      PUBLIC_HOST_2: app.example.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/kn-next-operator/go.mod
          cache-dependency-path: packages/kn-next-operator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build the workspace packages + the kn-next CLI
        run: |
          set -euo pipefail
          bun run --filter "@getknext/lib" build
          bun run --filter "@getknext/db" build
          bun run --filter "@getknext/core" build
          test -f packages/kn-next/dist/cli/kn-next.js

      # Same closure/rewrite the compat harness lane packs (test-e2e-deploy.yml
      # "Pack knext adapter tarballs"), now via the SAME shared packer
      # `release.yml`'s `pack` job uses (`scripts/pack-release-tarballs.mjs`):
      # `npm pack` — never `bun pm pack` (#1614) — after
      # `rewrite-workspace-ranges.mjs` resolves the `workspace:^` deps
      # @getknext/core carries on @getknext/lib + @getknext/db to a real
      # semver, which is what makes the tarballs npm-installable standalone.
      # `npm pack` is the tool `changeset publish` actually shells to for a
      # bun workspace, so this lane installs+exercises the SAME bytes that
      # ship, rather than `bun pm pack`'s (a different rewrite source, and —
      # measured, #1562 — a duplicate tar entry for a multi-`bin`-key target).
      - name: Pack knext adapter tarballs (npm pack — the real publish tool, #1614)
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/knext-tarballs"
          node scripts/pack-release-tarballs.mjs --dest "${DEST}" \
            --dirs packages/lib,packages/db,packages/kn-next
          ls -la "${DEST}"
          echo "TARBALLS_DIR=${DEST}" >> "$GITHUB_ENV"


      # Staged OUTSIDE the repo (a real app is its own project dir). The
      # minimal standalone fixture supplies /api/health and the build wiring;
      # the public-origin-redirect fixture's routes (/go and the article it
      # redirects to) are overlaid on it. The Docker build context IS this
      # directory, and Dockerfile.standalone COPYs `public` and
      # `node_modules/@getknext/core` unconditionally, so both are staged
      # (see standalone-deploy-kind-e2e.yml).
      - name: Stage the fixture app outside the repo + install its own dependencies
        run: |
          set -euo pipefail
          APP_DIR="${RUNNER_TEMP}/public-hosts-app"
          FIXTURES=packages/kn-next/src/__tests__/fixtures
          cp -R "${FIXTURES}/standalone-drain-app" "$APP_DIR"
          cp -R "${FIXTURES}/public-origin-redirect/app/go" "$APP_DIR/app/go"
          cp -R "${FIXTURES}/public-origin-redirect/app/article" "$APP_DIR/app/article"
          cd "$APP_DIR"
          npm pkg set "dependencies.next=${NEXT_VERSION}"
          cat > knext.config.ts <<EOF
          const config = {
            name: "${APP_NAME}",
            runtime: "${{ matrix.runtime }}",
            registry: "localhost:5001",
            healthCheckPath: "/api/health",
            scaling: { minScale: 0, maxScale: 1, memoryRequest: "256Mi", memoryLimit: "512Mi" },
            networking: { publicHosts: ["${PUBLIC_HOST_1}", "${PUBLIC_HOST_2}"] },
          };
          export default config;
          EOF
          bun install
          node -e "const v=require('./node_modules/next/package.json').version; if (v !== process.env.NEXT_VERSION) { console.error('next is ' + v); process.exit(1) }"
          mkdir -p public
          LIB_TGZ="$(find "${TARBALLS_DIR}" -maxdepth 1 -name 'getknext-lib-*.tgz' | sort | tail -n1)"
          DB_TGZ="$(find "${TARBALLS_DIR}" -maxdepth 1 -name 'getknext-db-*.tgz' | sort | tail -n1)"
          CORE_TGZ="$(find "${TARBALLS_DIR}" -maxdepth 1 -name 'getknext-core-*.tgz' | sort | tail -n1)"
          npm install --no-save --no-audit --no-fund "${LIB_TGZ}" "${DB_TGZ}" "${CORE_TGZ}"
          test -d node_modules/@getknext/core
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "DEPLOY_TAG=r${GITHUB_RUN_ID}-${{ matrix.runtime }}" >> "$GITHUB_ENV"

      - name: Create kind cluster (registry certs.d config_path)
        run: |
          set -euo pipefail
          cat <<'YAML' | kind create cluster --name "$CLUSTER" --wait 120s --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            [plugins."io.containerd.grpc.v1.cri".registry]
              config_path = "/etc/containerd/certs.d"
          YAML

      - name: Start in-cluster registry + wire the kind node to it
        run: |
          set -euo pipefail
          reg=kind-registry
          docker run -d --restart=always -p 127.0.0.1:5001:5000 --name "$reg" \
            registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker network connect kind "$reg"
          node="${CLUSTER}-control-plane"
          docker exec "$node" mkdir -p /etc/containerd/certs.d/localhost:5001
          printf '[host."http://%s:5000"]\n' "$reg" \
            | docker exec -i "$node" cp /dev/stdin /etc/containerd/certs.d/localhost:5001/hosts.toml

      - name: Install cert-manager
        run: |
          set -euo pipefail
          scripts/kind-manifests/apply-cert-manager.sh
          kubectl wait --for=condition=Available --timeout=300s \
            -n cert-manager deployment/cert-manager deployment/cert-manager-webhook deployment/cert-manager-cainjector

      - name: Install Knative Serving + Kourier
        run: |
          set -euo pipefail
          V="knative-v1.16.0"
          scripts/kind-manifests/apply-knative-kourier.sh "${V}"
          kubectl patch configmap/config-network -n knative-serving --type merge \
            --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'
          kubectl wait --for=condition=Available --timeout=300s \
            -n knative-serving deployment/controller deployment/webhook deployment/autoscaler deployment/net-kourier-controller

      - name: Build + deploy the operator from HEAD
        working-directory: packages/kn-next-operator
        run: |
          set -euo pipefail
          IMG=example.com/kn-next-operator:e2e
          for attempt in 1 2 3; do
            make docker-build IMG="$IMG" && break
            [ "$attempt" = 3 ] && { echo "::error::operator image build failed 3x"; exit 1; }
            echo "docker-build attempt $attempt failed; retrying"; sleep 10
          done
          kind load docker-image "$IMG" --name "$CLUSTER"
          make install
          make deploy IMG="$IMG"
          kubectl rollout status deployment/kn-next-operator-controller-manager \
            -n kn-next-operator-system --timeout=180s
          # #1591: deployment/... Available only means the pod passed its own
          # readiness probe -- it does NOT mean cert-manager has finished
          # issuing the serving cert and its cainjector has patched the
          # ValidatingWebhookConfiguration's caBundle, nor that the webhook
          # Service has a routable endpoint yet. Applying a NextApp before
          # both are true intermittently fails admission with "the NextApp
          # admission webhook could not be reached" -- a lane race, not a
          # CLI/operator field-skew problem (see the CLI's own preflight
          # error text). Close the window explicitly before the first apply.
          kubectl wait --for=condition=Ready --timeout=120s \
            -n kn-next-operator-system certificate/kn-next-operator-serving-cert
          kubectl wait --for=jsonpath='{.subsets[0].addresses[0]}' --timeout=120s \
            -n kn-next-operator-system endpoints/kn-next-operator-webhook-service
          # #1594 round 2: a Ready Certificate + a routable Endpoint still
          # raced with cainjector's caBundle patch and the apiserver's own
          # webhook client -- see the script for the run that proved it.
          "${GITHUB_WORKSPACE}/scripts/kind-manifests/wait-for-webhook-ready.sh"

      - name: Namespace
        run: kubectl create namespace "$APP_NS"

      # Through the product. The CLI's deploy preflight server-side dry-runs
      # the CR with --validate=strict first, so this step itself fails if the
      # installed CRD does not know spec.networking.publicHosts.
      - name: kn-next deploy (${{ matrix.runtime }})
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          node "${GITHUB_WORKSPACE}/packages/kn-next/dist/cli/kn-next.js" deploy \
            --registry localhost:5001 --namespace "$APP_NS" --tag "$DEPLOY_TAG"

      - name: Wait for the NextApp to go Ready
        run: |
          set -euo pipefail
          kubectl -n "$APP_NS" wait --for=condition=Ready --timeout=300s "nextapp/$APP_NAME" \
            || (kubectl -n "$APP_NS" get nextapp,ksvc,pods -o wide; kubectl -n "$APP_NS" describe "nextapp/$APP_NAME"; exit 1)

      - name: Assert the CR, the rendered env, the pod and the /go redirect through Kourier
        run: |
          set -euo pipefail
          bash scripts/public-hosts-e2e-assert.sh "$APP_NS" "$APP_NAME" "$PUBLIC_HOST_1" "$PUBLIC_HOST_2"

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n "$APP_NS" get nextapp,ksvc,pods -o wide || true
          kubectl -n "$APP_NS" get ksvc "$APP_NAME" -o yaml || true
          kubectl -n "$APP_NS" logs -l "serving.knative.dev/service=${APP_NAME}" -c user-container --tail=100 || true
          kubectl -n kn-next-operator-system logs deployment/kn-next-operator-controller-manager --tail=100 || true
