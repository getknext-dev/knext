name: Deep-health alert — kind e2e

# Proof lane for the observability path of the deep-health alerts. An app whose
# database refuses connections must make KnextDeepHealthDown go FIRING in a real
# Prometheus, using the PodMonitor and PrometheusRule knext ships, unmodified:
#
#   shipped PodMonitor -> scrape of :9464 -> knext_deep_health_state (forwarded
#   by the runtime contract) -> shipped PrometheusRule -> alert firing
#
# Why this exists: the alert-reachability unit tests prove, by scanning the
# artifacts, that the series is served on the port the PodMonitor scrapes. They
# cannot prove a Prometheus actually scrapes it and a rule actually fires. The
# gauge was once emitted on a port nothing scraped, and every emission check
# stayed green; this lane is the end-to-end half of that fix.
#
# The app is a fixture process running the real instrumentation, the real runtime
# contract listener and the real @getknext/lib deep health check — not a Knative
# service, because the claim is about the observability path (scripts/
# deep-health-alert-e2e.sh says exactly what is real and what is not).
#
# Runs on PRs that touch the pieces it exercises, plus on demand. Ephemeral kind
# on the runner only.

on:
  pull_request:
    paths:
      - 'packages/kn-next-operator/config/observability/**'
      - 'packages/kn-next-operator/config/prometheus/**'
      - 'packages/kn-next/templates/app/runtime-contract.mjs.hbs'
      - 'packages/kn-next/src/adapters/metrics.ts'
      - 'packages/lib/src/health/**'
      - 'apps/file-manager/runtime-contract.mjs'
      - 'apps/file-manager/src/instrumentation-node.ts'
      - 'apps/file-manager/e2e-support/deep-health-alert-fixture.ts'
      - 'scripts/deep-health-alert-e2e.sh'
      - 'scripts/deep-health-alert-e2e/**'
      - '.github/workflows/deep-health-alert-kind-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deep-health-alert-kind-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-health-alert:
    name: a dead database fires KnextDeepHealthDown on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route Docker Hub pulls through mirror.gcr.io (anonymous rate limit)
        id: docker-hub-mirror
        uses: ./.github/actions/docker-hub-mirror

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build the workspace packages the fixture imports
        run: |
          set -euo pipefail
          bun run --filter "@getknext/lib" build
          bun run --filter "@getknext/db" build
          bun run --filter "@getknext/core" build

      - name: Run the deep-health alert e2e
        env:
          CLUSTER: deep-health-alert-e2e
        run: scripts/deep-health-alert-e2e.sh

      - name: Dump Prometheus and fixture state on failure
        if: failure()
        run: |
          set -x
          kubectl --context kind-deep-health-alert-e2e -n deep-health-e2e logs deploy/e2e-app --tail=100 || true
          kubectl --context kind-deep-health-alert-e2e -n monitoring get pods || true
          kubectl --context kind-deep-health-alert-e2e get podmonitors,prometheusrules -A || true
