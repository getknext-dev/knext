# Nightly full-history secret scan (security sprint S1).
#
# The ci.yml secret-scan job already scans full history on every PR and push,
# so this nightly exists for exactly one gap: a NEW gitleaks rule (or an
# allowlist expiry) that would flag existing history gets surfaced on a quiet
# repo without waiting for the next PR. Same wrapper, same allowlist, same
# fail-closed semantics — enabled only after the S2 history sweep and the
# #730 rotation completed, per the sprint plan's leak-amplification ordering
# (a public red on an unrotated live secret would publish its location).
#
# No credentials are in scope here (permissions: {}), and the wrapper's output
# is redacted by construction (references only, never match content).
name: Secret scan (nightly)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  secret-scan-nightly:
    name: Full-history secret scan (nightly)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks (checksum-verified)
        run: |
          set -eu
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan full history against the disposition-classed allowlist
        run: node scripts/secret-scan.mjs
