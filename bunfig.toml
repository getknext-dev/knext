# Bun test runner configuration
[test]
# Enable coverage by default
# coverage is opted into per RUN (`bun test --coverage`), not forced here.
# Forcing it made every single-file run fail the global 0.8 threshold, which is
# meaningless for one file and blocks per-file process isolation.
# coverage = true

# Enforce minimum 80% coverage threshold
coverageThreshold = 0.8

# Coverage output directory
coverageDir = "coverage"

# Preload TypeScript configuration
preload = ["./tests/setup.ts"]


