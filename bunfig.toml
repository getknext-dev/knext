# Bun test runner configuration
[test]
# Enable coverage by default
# coverage is opted into per RUN (`bun test --coverage`), not forced here.
# Forcing it made every single-file run fail the global 0.8 threshold, which is
# meaningless for one file and blocks per-file process isolation.
# coverage = true

# NO coverageThreshold, and NO coverageDir. Both are deliberate (#884):
#
#   - coverageThreshold applies PER PROCESS, and this repo runs one process per
#     test file (see scripts/bun-test.mjs). A global floor against a single
#     file's report is meaningless. The floors now live in
#     scripts/lib/coverage-policy.mjs and are enforced by
#     scripts/check-coverage.mjs over the MERGED report of both runners.
#   - coverageDir SILENTLY OVERRIDES --coverage-dir (measured, bun 1.4.0: the
#     flag is accepted, ignored, and nothing is printed). With it set, every
#     parallel spawn wrote the same coverage/lcov.info and all but the last were
#     lost. scripts/bun-test.mjs passes a unique --coverage-dir per spawn, which
#     only works while this key is absent.
#
# tests/bun-test-coverage-emission.test.ts fails if either comes back.

# Preload TypeScript configuration
preload = ["./tests/setup.ts"]



[install]
# FRESH-RELEASE QUARANTINE. Bun will not resolve a registry version published less
# than this many seconds ago, so a malicious or broken release that is pulled within
# a day or two never reaches this tree through `bun add`, `bun update` or an
# unlocked `bun install`. Three days (259200 s) is long enough for the registry's
# takedown and the OSV malicious-package feed to catch up on most incidents, short
# enough that routine bumps are not held back. Dependabot's cooldown is the same
# number (.github/dependabot.yml) and tests/bun-release-age.test.ts keeps them equal.
#
# `bun install --frozen-lockfile` is unaffected: it installs what the lockfile
# already pins and resolves nothing new. The quarantine bites when a version is first
# chosen.
#
# ESCAPE HATCHES, in order of preference:
#   1. One-off: `bun add <pkg>@<version> --minimum-release-age 0` (or `bun update ...`).
#      Needed for a security fix you must take today. Say so in the PR.
#   2. Standing, for one package: add its exact name to `minimumReleaseAgeExcludes`
#      below. Each entry is pinned by tests/bun-release-age.test.ts, so adding one is
#      a reviewed change, not a quiet edit. Only first-party packages belong here by
#      default.
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = ["@getknext/core", "@getknext/lib", "@getknext/db"]
