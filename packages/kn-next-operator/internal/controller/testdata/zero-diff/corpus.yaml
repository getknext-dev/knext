# Observability with RUM + tracing, custom health path, custom timeout.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: observability-timeout
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 0
    maxScale: 10
  timeoutSeconds: 120
  healthCheckPath: /api/live
  observability:
    enabled: true
    rum:
      enabled: true
      sampleRate: "0.5"
    tracing:
      enabled: true
      endpoint: http://otel.default.svc:4318
      sampleRate: "0.25"
---
# Secrets: envFrom + envMap, plus plain env.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: secrets-env
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 0
    maxScale: 10
  secrets:
    envFrom:
      - app-secrets
    envMap:
      STRIPE_KEY:
        secretName: stripe
        secretKey: key
  env:
    FEATURE_FLAG: "on"
---
