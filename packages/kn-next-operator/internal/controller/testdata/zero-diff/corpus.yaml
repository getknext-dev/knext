---
# 1.3-line fully-configured app (CLI dump): all four resource fields (the CLI
# back-fills the three the user left unset), the scaling knobs, observability.
# maxScale 8 x poolMax 10 = 80 sits exactly on the connection budget.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: cli13-full
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 1
    maxScale: 8
    containerConcurrency: 50
    poolMax: 10
    targetBurstCapacity: 0
    panicWindowPercentage: 10
    panicThresholdPercentage: 200
    scaleDownDelay: 60s
  resources:
    cpuRequest: 500m
    memoryRequest: 512Mi
    cpuLimit: 1000m
    memoryLimit: 2Gi
  storage:
    provider: gcs
    bucket: b
    region: us
  cache:
    provider: redis
    url: redis://r:6379
    keyPrefix: kp
  revalidation:
    queue: kafka
    kafkaBrokerUrl: kafka:9092
  env:
    NEXT_DEPLOYMENT_ID: b-1
  observability:
    enabled: true
    tracing:
      enabled: true
      sampleRate: "0.1"
  healthCheckPath: /healthz
  runtime: node
  build: turbopack
  buildId: b-1
---
# No spec.scaling block at all: the operator's own min-scale 0 / max-scale 10
# annotation defaults. This is the shape a CLI that omits an unset scaling
# pair emits.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: no-scaling-block
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  runtime: bun
  build: turbopack
---
# A scaling block WITHOUT maxScale: the operator reads the zero as "unbounded"
# and stamps max-scale "0". Pinned on purpose: a CLI that stops emitting
# maxScale must not leave a non-empty scaling block without one.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: scaling-without-maxscale
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    containerConcurrency: 30
---
# Only one resource field set: the operator fills the other three itself.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: resources-partial
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 0
    maxScale: 10
  resources:
    cpuLimit: 2000m
---
# Every scaling knob set, scale-down-delay included.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: scaling-knobs
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 0
    maxScale: 20
    containerConcurrency: 100
    targetBurstCapacity: -1
    panicWindowPercentage: 5
    panicThresholdPercentage: 150
    scaleDownDelay: 15m
---
# Scheduled warm floor (evaluated against the fixed test clock).
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: warm-schedule
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 0
    maxScale: 10
    warmSchedule:
      - start: "0 8 * * 1-5"
        end: "0 20 * * 1-5"
        replicas: 2
        timezone: UTC
---
# Image prewarm DaemonSet.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: image-prewarm
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  imagePullSecrets:
    - name: ocir-pull
  scaling:
    minScale: 0
    maxScale: 10
    imagePrewarm: true
---
