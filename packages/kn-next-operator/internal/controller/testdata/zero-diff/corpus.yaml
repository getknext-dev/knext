# Zero-diff golden corpus: NextApp specs shaped like what real CLIs emit.
#
# Each document is a FROZEN snapshot. Do not "modernise" an entry to follow a
# newer CLI: the point is that CRs already stored in a cluster by an older CLI
# keep rendering byte-identically when the operator is upgraded. The entries
# named cli13-* were dumped from the 1.3-line CLI's buildNextAppCRObject; the
# entries named v10-* are hand-curated 1.0-line shapes (fields the 1.0 CRD
# knew); the rest cover one operator rendering branch each.
#
# Every entry must pass validation.ValidateNextAppSpec except the ones named
# reject-*, whose golden is the reconcile error text.
---
# 1.0-line minimal shape: image + the always-emitted scaling pair.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: v10-minimal
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 0
    maxScale: 10
---
# 1.0-line shape with the storage + redis cache + kafka revalidation trio.
apiVersion: apps.kn-next.dev/v1alpha1
kind: NextApp
metadata:
  name: v10-storage-cache-kafka
  namespace: default
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
  scaling:
    minScale: 0
    maxScale: 10
  storage:
    provider: gcs
    bucket: my-bucket
    region: us-central1
  cache:
    provider: redis
    url: redis://redis.default.svc.:6379
    keyPrefix: v10
  revalidation:
    queue: kafka
    kafkaBrokerUrl: kafka.default.svc:9092
---
