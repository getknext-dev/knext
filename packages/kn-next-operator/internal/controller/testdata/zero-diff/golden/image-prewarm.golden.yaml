spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - knative-serving
          - kourier-system
    ports:
    - port: 8012
    - port: 8013
    - port: 8112
    - port: 9090
    - port: 9464
  - from:
    - podSelector: {}
    ports:
    - port: 9090
    - port: 9464
  - from:
    - namespaceSelector:
        matchLabels:
          knext.dev/metrics-scrape: "true"
    ports:
    - port: 9464
  podSelector:
    matchLabels:
      serving.knative.dev/service: image-prewarm
  policyTypes:
  - Ingress
---
