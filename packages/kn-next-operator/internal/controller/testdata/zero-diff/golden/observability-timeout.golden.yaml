---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: observability-timeout-sa
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: observability-timeout
    uid: uid-observability-timeout
---
apiVersion: caching.internal.knative.dev/v1alpha1
kind: Image
metadata:
  labels:
    app: observability-timeout
    generated-by: kn-next-operator
  name: observability-timeout-image-cache
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: observability-timeout
    uid: uid-observability-timeout
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  labels:
    app: observability-timeout
    generated-by: kn-next-operator
  name: observability-timeout
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: observability-timeout
    uid: uid-observability-timeout
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/min-scale: "0"
        prometheus.io/path: /metrics
        prometheus.io/port: "9464"
        prometheus.io/scrape: "true"
    spec:
      containerConcurrency: 20
      containers:
      - env:
        - name: HOSTNAME
          value: 0.0.0.0
        - name: NODE_ENV
          value: production
        - name: KN_APP_NAME
          value: observability-timeout
        - name: NEXT_PUBLIC_RUM_ENABLED
          value: "true"
        - name: NEXT_PUBLIC_RUM_SAMPLE_RATE
          value: "0.5"
        - name: OTEL_TRACING_ENABLED
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel.default.svc:4318
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.25"
        image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
        livenessProbe:
          httpGet:
            path: /api/live
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        name: ""
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /api/live
            port: 3000
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          readOnlyRootFilesystem: true
      serviceAccountName: observability-timeout-sa
      timeoutSeconds: 120
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: observability-timeout
    generated-by: kn-next-operator
  name: observability-timeout-allow-ingress
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: observability-timeout
    uid: uid-observability-timeout
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - knative-serving
          - kourier-system
    ports:
    - port: 8012
    - port: 8013
    - port: 8112
    - port: 9090
    - port: 9464
  - from:
    - podSelector: {}
    ports:
    - port: 9090
    - port: 9464
  - from:
    - namespaceSelector:
        matchLabels:
          knext.dev/metrics-scrape: "true"
    ports:
    - port: 9464
  podSelector:
    matchLabels:
      serving.knative.dev/service: observability-timeout
  policyTypes:
  - Ingress
