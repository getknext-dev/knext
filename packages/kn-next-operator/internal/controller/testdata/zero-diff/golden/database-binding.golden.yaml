---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: database-binding-sa
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: database-binding
    uid: uid-database-binding
---
apiVersion: caching.internal.knative.dev/v1alpha1
kind: Image
metadata:
  labels:
    app: database-binding
    generated-by: kn-next-operator
  name: database-binding-image-cache
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: database-binding
    uid: uid-database-binding
spec:
  image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  labels:
    app: database-binding
    generated-by: kn-next-operator
  name: database-binding
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: database-binding
    uid: uid-database-binding
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "4"
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containerConcurrency: 20
      containers:
      - env:
        - name: HOSTNAME
          value: 0.0.0.0
        - name: NODE_ENV
          value: production
        - name: KNEXT_DB_POOL_MAX
          value: "10"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: url
              name: app-db
        - name: DATABASE_URL_RO
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL_RO
              name: app-db-ro
        image: registry.example.com/app:v1@sha256:abc123def456abc123def456abc123def456abc123def456abc123def456abc1
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        name: ""
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          readOnlyRootFilesystem: true
      serviceAccountName: database-binding-sa
      timeoutSeconds: 300
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: database-binding
    generated-by: kn-next-operator
  name: database-binding-allow-ingress
  namespace: default
  ownerReferences:
  - apiVersion: apps.kn-next.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NextApp
    name: database-binding
    uid: uid-database-binding
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - knative-serving
          - kourier-system
    ports:
    - port: 8012
    - port: 8013
    - port: 8112
    - port: 9090
    - port: 9464
  - from:
    - podSelector: {}
    ports:
    - port: 9090
    - port: 9464
  - from:
    - namespaceSelector:
        matchLabels:
          knext.dev/metrics-scrape: "true"
    ports:
    - port: 9464
  podSelector:
    matchLabels:
      serving.knative.dev/service: database-binding
  policyTypes:
  - Ingress
