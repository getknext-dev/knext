# [GRAFANA] Turnkey knext dashboards (#316).
#
# Packages every dashboard JSON in ./dashboards as a ConfigMap labeled
# `grafana_dashboard: "1"` — the standard Grafana sidecar convention
# (kube-prometheus-stack / grafana Helm chart). A Grafana whose sidecar watches
# this namespace auto-imports them; no manual "Import dashboard" step. They graph
# the per-app :9464 series discovered by the PodMonitor in ../prometheus.
#
# OPT-IN, mirroring ../prometheus: this overlay is NOT part of the default
# install bundle (config/default/kustomization.yaml keeps the `- ../grafana`
# include commented, next to the `- ../prometheus` one). Apply it directly:
#
#   kubectl apply -k config/grafana
#
# Namespace: the ConfigMaps land in `monitoring` (the conventional
# kube-prometheus-stack namespace). If your Grafana sidecar watches a different
# namespace, override with `namespace:` here or `kubectl apply -k` into it.
#
# Dashboards stay data-source-agnostic: each references the `${datasource}`
# Grafana template variable, never a hardcoded datasource UID.
namespace: monitoring

generatorOptions:
  # Stable ConfigMap names (no content-hash suffix) so re-applies update in place
  # and the Grafana sidecar keeps a steady dashboard identity.
  disableNameSuffixHash: true
  labels:
    # The sidecar discovery label — this is what makes the import automatic.
    grafana_dashboard: "1"
    app.kubernetes.io/name: kn-next-operator
    app.kubernetes.io/component: grafana-dashboards

configMapGenerator:
  - name: knext-dashboard-red-overview
    files:
      - dashboards/red-overview.json
  - name: knext-dashboard-scale-to-zero
    files:
      - dashboards/scale-to-zero.json
  # REMOVED (#792), not merely unlisted — the JSON is deleted too:
  #   knext-dashboard-rum       kn_next_web_vitals_* is collected by an app-level
  #                             /api/rum route into a prom-client registry served
  #                             on the APP port. The shipped PodMonitor scrapes
  #                             :9464 only, so every panel was permanently blank.
  #   knext-dashboard-bytecode  its subject was NODE_COMPILE_CACHE warmth on the
  #                             node-server path. ADR-0048's compiled binary has
  #                             no bytecode cache to measure — the metric is not
  #                             renamed, the thing it measured is gone.
  # A blank dashboard is worse than no dashboard: it reads as "the system is
  # quiet". Deleting is the honest outcome.
  - name: knext-dashboard-loadtesting
    files:
      - dashboards/loadtesting.json
