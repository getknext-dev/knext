# Puts the secret-configmap-writes policy in force, cluster-wide.
#
# No namespace or object selector: the operator writes in every namespace that
# holds a zone, so a narrower scope would leave the others unbounded. The policy
# itself confines only the operator's ServiceAccount.
#
# Deny refuses the write. Audit also records each refusal in the apiserver audit
# log (when auditing is on), which is how a compromised operator would show up.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: secret-configmap-writes
  labels:
    app.kubernetes.io/name: kn-next-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  policyName: secret-configmap-writes
  validationActions: ["Deny", "Audit"]
