# Narrows what the operator's ServiceAccount may write to Secrets and ConfigMaps.
#
# The operator needs cluster-wide create/update on both (it generates and rotates
# each zone's signing key Secret and its JWKS ConfigMap in the zone's own
# namespace). RBAC cannot express "only these names" for `create`, so without this
# policy a compromised operator could overwrite any Secret or ConfigMap whose
# name it knows. This policy removes that: the operator's ServiceAccount may
# create, update and delete ONLY
#
#   - Secrets whose name ends in   -knext-signing-key, and only of type Opaque
#   - ConfigMaps whose name ends in -knext-jwks
#
# and, of those, only an object that the zone's NextApp controls (OWNERSHIP,
# below). Every other principal is untouched: the single matchCondition below
# skips the policy for any request that is not from the operator.
#
# OWNERSHIP. The name is not enough on its own: an object under an allowed name that
# belongs to someone else (a leftover, or another zone's) is still a name the operator
# writes. So each write is also to an object whose controller ownerReference names
# the zone's NextApp: kind NextApp, apiVersion in the apps.kn-next.dev group, and a
# name equal to the object's name without its suffix (`<zone>-knext-jwks` is owned by
# NextApp `<zone>`). Where that reference must sit:
#
#   - CREATE: on the new object. The reconciler sets it at create, so the operator's
#     own creates pass.
#   - UPDATE and DELETE: on the stored object.
#   - UPDATE: the ownerReferences must equal the stored ones, so a write cannot drop,
#     swap or forge the owner (the UID included). The reconciler rotates a key with a
#     full update that keeps the reference, so rotation passes.
#
# What CEL cannot check is the UID. Nothing here can tell whether the UID in that
# reference belongs to a live NextApp, so this is a name check, not an identity
# check. The reconciler makes the UID comparison (controlledByZone, by UID) before
# any write, and it never writes an object it does not control, so in normal
# operation the two agree. The residual this leaves is an object of an allowed name
# whose controller ownerReference names the zone but carries a stale or foreign UID:
# a leftover from an earlier NextApp of the same name, awaiting garbage collection.
# The policy admits a compromised operator's write to such an object; the reconciler
# alone refuses it.
#
# The Secret TYPE is pinned because the name alone is not enough: a Secret of type
# kubernetes.io/service-account-token under an allowed name, annotated with the name
# of a privileged ServiceAccount, is filled in by the tokens controller with that
# ServiceAccount's credential, and the operator can read the Secret it wrote. The
# operator writes only Opaque Secrets, so that is the only type admitted. A Secret's
# type cannot change after creation, so checking the new object also refuses an
# update of a foreign token Secret that happens to carry an allowed name. The type is
# not checked on delete (a delete creates no credential); ownership is.
#
# `dyn(object).type` (not `object.type`) because the policy matches ConfigMaps too,
# which have no type; the expression reads the field only for Secrets, and `dyn`
# keeps the apiserver's type check from warning about the ConfigMap case.
#
# KEEP IN LOCKSTEP with the operator's code. The two suffix lists below are the
# names the operator writes (ZoneSigningKeySecretName, ZoneJWKSConfigMapName in
# internal/controller). internal/controller/operator_write_inventory_test.go scans
# the operator's source for every Secret and ConfigMap write and fails if this
# list and the code disagree, in either direction. A new Secret/ConfigMap the
# operator writes needs its suffix added here in the same change, or the
# reconciler is refused in production. The ownership rule depends on the writer
# setting the controller reference at create (zone_signing_key_reconcile.go); a
# writer that did not would be refused by the UPDATE check after its first write.
#
# The operator's identity is the ServiceAccount username, spelled as separate
# literals ('system:serviceaccount:' + <namespace> + ':' + <name>) so that
# config/default can rewrite the namespace and name from the real ServiceAccount
# (see replacements there). The values below are the base names; the rendered
# bundle carries the prefixed ones.
#
# Requires Kubernetes 1.30 or later (ValidatingAdmissionPolicy is GA in 1.30).
#
# failurePolicy Fail: this policy confines only the operator, through a plain
# equality that cannot fail, and runs in the apiserver (no webhook, no network
# hop). If it ever errored, Fail refuses the operator's own write, which is the
# safe direction; Ignore would turn an evaluation error into an unrestricted
# operator.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: secret-configmap-writes
  labels:
    app.kubernetes.io/name: kn-next-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["secrets", "configmaps"]
  matchConditions:
  - name: request-is-from-the-operator
    expression: "request.userInfo.username == 'system:serviceaccount:' + 'system' + ':' + 'controller-manager'"
  variables:
  - name: objectName
    expression: "request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
  - name: allowedSecretSuffixes
    expression: "['-knext-signing-key']"
  - name: allowedConfigMapSuffixes
    expression: "['-knext-jwks']"
  - name: allowedSecretType
    expression: "'Opaque'"
  - name: allowedSuffixes
    expression: "request.resource.resource == 'secrets' ? variables.allowedSecretSuffixes : variables.allowedConfigMapSuffixes"
  # The owners of the new object (empty on DELETE) and of the stored one (empty on
  # CREATE). An absent ownerReferences list reads as empty, not as an error.
  - name: newOwners
    expression: "request.operation == 'DELETE' || !has(object.metadata.ownerReferences) ? [] : object.metadata.ownerReferences"
  - name: oldOwners
    expression: "request.operation == 'CREATE' || !has(oldObject.metadata.ownerReferences) ? [] : oldObject.metadata.ownerReferences"
  # The owners the zone check reads: the new object's on CREATE, the stored object's otherwise.
  - name: zoneOwners
    expression: "request.operation == 'CREATE' ? variables.newOwners : variables.oldOwners"
  validations:
  - expression: "variables.allowedSuffixes.exists(s, variables.objectName.endsWith(s) && size(variables.objectName) > size(s))"
    messageExpression: "'the knext operator may not ' + request.operation.lowerAscii() + ' the ' + request.resource.resource + ' object \"' + variables.objectName + '\": it writes only the per-zone signing key and JWKS'"
    reason: Forbidden
  - expression: "request.resource.resource != 'secrets' || request.operation == 'DELETE' || dyn(object).type == variables.allowedSecretType"
    message: "the knext operator may write only Opaque Secrets: a service-account-token or any other Secret type under an allowed name would let it mint a credential"
    reason: Forbidden
  - expression: "variables.allowedSuffixes.exists(s, variables.zoneOwners.exists(r, has(r.controller) && r.controller == true && r.kind == 'NextApp' && r.apiVersion.startsWith('apps.kn-next.dev/') && r.name + s == variables.objectName))"
    message: "the knext operator may write only an object its zone's NextApp controls: it needs a controller ownerReference to that NextApp, named after the object's zone"
    reason: Forbidden
  - expression: "request.operation != 'UPDATE' || variables.newOwners == variables.oldOwners"
    message: "the knext operator may not change an object's ownerReferences: a write that swaps, drops or forges its owner is refused"
    reason: Forbidden
