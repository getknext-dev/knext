# Narrows what the operator's ServiceAccount may write to Secrets and ConfigMaps.
#
# The operator needs cluster-wide create/update on both (it generates and rotates
# each zone's signing key Secret and its JWKS ConfigMap in the zone's own
# namespace). RBAC cannot express "only these names" for `create`, so without this
# policy a compromised operator could overwrite any Secret or ConfigMap whose
# name it knows. This policy removes that: the operator's ServiceAccount may
# create, update and delete ONLY
#
#   - Secrets whose name ends in   -knext-signing-key
#   - ConfigMaps whose name ends in -knext-jwks
#
# and nothing else. Every other principal is untouched: the single matchCondition
# below skips the policy for any request that is not from the operator.
#
# KEEP IN LOCKSTEP with the operator's code. The two suffix lists below are the
# names the operator writes (ZoneSigningKeySecretName, ZoneJWKSConfigMapName in
# internal/controller). internal/controller/operator_write_inventory_test.go scans
# the operator's source for every Secret and ConfigMap write and fails if this
# list and the code disagree, in either direction. A new Secret/ConfigMap the
# operator writes needs its suffix added here in the same change, or the
# reconciler is refused in production.
#
# The operator's identity is the ServiceAccount username, spelled as separate
# literals ('system:serviceaccount:' + <namespace> + ':' + <name>) so that
# config/default can rewrite the namespace and name from the real ServiceAccount
# (see replacements there). The values below are the base names; the rendered
# bundle carries the prefixed ones.
#
# Requires Kubernetes 1.30 or later (ValidatingAdmissionPolicy is GA in 1.30).
#
# failurePolicy Fail: this policy confines only the operator, through a plain
# equality that cannot fail, and runs in the apiserver (no webhook, no network
# hop). If it ever errored, Fail refuses the operator's own write, which is the
# safe direction; Ignore would turn an evaluation error into an unrestricted
# operator.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: secret-configmap-writes
  labels:
    app.kubernetes.io/name: kn-next-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE", "DELETE"]
      resources: ["secrets", "configmaps"]
  matchConditions:
  - name: request-is-from-the-operator
    expression: "request.userInfo.username == 'system:serviceaccount:' + 'system' + ':' + 'controller-manager'"
  variables:
  - name: objectName
    expression: "request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
  - name: allowedSecretSuffixes
    expression: "['-knext-signing-key']"
  - name: allowedConfigMapSuffixes
    expression: "['-knext-jwks']"
  validations:
  - expression: >-
      (request.resource.resource == 'secrets'
        ? variables.allowedSecretSuffixes
        : variables.allowedConfigMapSuffixes).exists(s,
          variables.objectName.endsWith(s) && size(variables.objectName) > size(s))
    messageExpression: >-
      'the knext operator may not ' + request.operation.lowerAscii() + ' the ' +
      request.resource.resource + ' object "' + variables.objectName +
      '": it writes only the per-zone signing key and JWKS'
    reason: Forbidden
