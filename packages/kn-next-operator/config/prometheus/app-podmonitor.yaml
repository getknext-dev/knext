# Per-app golden-signal metrics (#315).
#
# The operator annotates every generated Knative Service with
# `prometheus.io/scrape=true`, `prometheus.io/port=9464`, `prometheus.io/path=/metrics`
# (see internal/controller/nextapp_controller.go) — the annotation-based scrape
# that plain Prometheus honors. For a Prometheus OPERATOR setup (which ignores
# those annotations and discovers targets via CRDs) this PodMonitor makes the
# same per-app :9464 endpoint discoverable.
#
# :9464 is the runtime's own metrics endpoint. Since ADR-0048 that is the
# compiled single executable's second Bun.serve listener (see `renderMetrics` in
# packages/kn-next/templates/app/runtime-contract.mjs.hbs), which exports the
# knext_bunexec_* process, RED and cold-start series. It is the ONLY endpoint
# this PodMonitor scrapes, so anything an app registers into its own prom-client
# registry and serves on the APP port (an `/api/metrics` route) is NOT collected
# here — that path used to be merged in by the node-server supervisor and no
# longer is. Every app pod the operator generates carries the label
# `generated-by: kn-next-operator`, which is the selector below — one PodMonitor
# covers all NextApps.
#
# Scale-to-zero note: a scaled-to-zero app has no pods, so it exports no series
# and its targets vanish from Prometheus until the next request wakes it. That
# is expected; the SLIs in docs/observability/slos.md are evaluated over rolling
# windows for exactly this reason.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app.kubernetes.io/name: kn-next-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: app-metrics
  name: nextapp-metrics
  namespace: system
spec:
  # Discover every knext-generated app pod, across namespaces, by the operator's
  # ownership label. Narrow to a single app by adding `app: <NextApp name>`.
  selector:
    matchLabels:
      generated-by: kn-next-operator
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    # Knative user-container ports are unnamed in the pod spec, so target the
    # supervisor metrics port by NUMBER (9464) rather than by port name.
    - targetPort: 9464
      path: /metrics
      interval: 30s
      scheme: http
      relabelings:
        # Surface the app name (the operator labels every pod `app=<NextApp>`).
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: app
        # Pin a STABLE `job` label. Without this, prometheus-operator derives
        # `job` from the pod's app.kubernetes.io/name label (or falls back to
        # `<namespace>/<podmonitor>`), so it varies per app and per install —
        # and the knext.app.staleness rules in
        # config/observability/prometheusrule.yaml select on `up{job=...}`.
        # A meta-alert that cannot name its own targets is not a meta-alert.
        - targetLabel: job
          replacement: knext-nextapp
