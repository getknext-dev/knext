# This rule is not used by the project kn-next-operator itself.
# It is provided to allow the cluster admin to help manage permissions for the
# cluster-scoped KnextPlatform (ADR-0064): whoever can write it changes the
# defaults of EVERY NextApp in the cluster, so it is a separate grant from the
# NextApp roles and is never included in them.
#
# Grants full permissions ('*') over platform.kn-next.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kn-next-operator
    app.kubernetes.io/managed-by: kustomize
  name: knextplatform-admin-role
rules:
- apiGroups:
  - platform.kn-next.dev
  resources:
  - knextplatforms
  verbs:
  - '*'
- apiGroups:
  - platform.kn-next.dev
  resources:
  - knextplatforms/status
  verbs:
  - get
