# Operator-managed Knative config (issue #45): declarative ConfigMaps for
# Knative Serving:
#   - config-network  : Kourier ingress-class (#45).
#
# Pinned to the knative-serving namespace. When included from config/default
# (which applies `namespace: kn-next-operator-system` to all resources), that
# namespace would be rewritten — so config/default re-pins the ConfigMap back to
# its required name / `knative-serving` with a PatchTransformer
# (config_network_repin.yaml) that runs AFTER the namespace/namePrefix
# transformers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knative-serving

resources:
- config-network.yaml
