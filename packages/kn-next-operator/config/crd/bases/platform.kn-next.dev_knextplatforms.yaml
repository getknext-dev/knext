---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: knextplatforms.platform.kn-next.dev
spec:
  group: platform.kn-next.dev
  names:
    kind: KnextPlatform
    listKind: KnextPlatformList
    plural: knextplatforms
    shortNames:
    - kplatform
    singular: knextplatform
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KnextPlatform is the cluster-scoped platform layer configuration (ADR-0064).
          The operator reads it and merges its defaults into every NextApp at render
          time, under the app's own fields and over the built-in values. Applied with
          kubectl or GitOps; never written by the CLI.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the platform configuration.
            properties:
              database:
                description: |-
                  Database carries the cluster-wide database connection budget. It turns the
                  operator's hardcoded cap into a per-cluster value; it provisions nothing.
                properties:
                  connectionBudget:
                    description: |-
                      ConnectionBudget is the cap that maxScale x poolMax must fit within for an
                      app that declares a poolMax. Built-in: 80. It creates no database, pooler
                      or connection of any kind; it only moves the cap the operator enforces.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              limits:
                description: Limits carries cluster-wide request limits.
                properties:
                  timeoutSeconds:
                    description: |-
                      TimeoutSeconds is the maximum seconds a request may take before Knative
                      times it out, used when an app sets none. Built-in: 300.
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                type: object
              profile:
                description: |-
                  Profile names a bundle of platform values. "default" sets nothing (it is the
                  built-in defaults). "fastColdStart" is accepted but takes effect in a later
                  phase: in this release it sets no value.
                enum:
                - default
                - fastColdStart
                type: string
              resources:
                description: |-
                  Resources carries cluster-wide container resource defaults for apps that
                  leave the matching spec.resources field unset.
                properties:
                  defaults:
                    description: |-
                      Defaults applies per field: an app that sets cpuLimit but not memoryLimit
                      inherits the platform memoryLimit.
                    properties:
                      cpuLimit:
                        maxLength: 32
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                      cpuRequest:
                        maxLength: 32
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                      memoryLimit:
                        maxLength: 32
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                      memoryRequest:
                        maxLength: 32
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        type: string
                    type: object
                type: object
              rollout:
                description: Rollout bounds how fast a platform change is applied
                  across apps.
                properties:
                  maxAppsPerMinute:
                    description: |-
                      MaxAppsPerMinute bounds how many apps the operator re-renders per minute
                      when a platform change alters their effective values. Each re-render is a
                      new Knative revision (initial-scale 1), so an unbounded edit would boot one
                      pod per app at once. Built-in: 10.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              scaling:
                description: |-
                  Scaling carries cluster-wide autoscaling defaults for apps that leave the
                  matching spec.scaling field unset.
                properties:
                  defaults:
                    description: Defaults applies to every app that leaves the matching
                      field unset.
                    properties:
                      containerConcurrency:
                        description: |-
                          ContainerConcurrency is the per-pod concurrent-request soft target used
                          when an app sets none. Built-in: 20.
                        format: int32
                        minimum: 1
                        type: integer
                      panicThresholdPercentage:
                        description: |-
                          PanicThresholdPercentage is the KPA panic threshold used when an app sets
                          none. Unset leaves the Knative cluster default in force.
                        format: int32
                        minimum: 110
                        type: integer
                      panicWindowPercentage:
                        description: |-
                          PanicWindowPercentage is the KPA panic window used when an app sets none.
                          Unset leaves the Knative cluster default in force.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                      scaleDownDelay:
                        description: |-
                          ScaleDownDelay is how long the last pod stays routable after traffic
                          stops, used when an app sets none. Unset leaves the Knative cluster default
                          in force. Validated by the same Knative validator the app field uses.
                        maxLength: 16
                        type: string
                      targetBurstCapacity:
                        description: |-
                          TargetBurstCapacity is the activator burst capacity used when an app sets
                          none: -1 keeps the activator in the request path, >= 0 is a capacity in
                          requests. Unset leaves the Knative cluster default in force.
                        format: int32
                        minimum: -1
                        type: integer
                    type: object
                type: object
            type: object
          status:
            description: status defines the observed state.
            properties:
              conditions:
                description: |-
                  Conditions: Accepted (the spec is valid and the object is the singleton),
                  DefaultsPropagated (every inheriting app re-rendered, or Progressing with
                  counts) and Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the operator
                  last evaluated.
                format: int64
                type: integer
              rollout:
                description: Rollout counts apps by how far the current platform config
                  has reached.
                properties:
                  applied:
                    description: Applied is the number of apps rendered with the current
                      platform config.
                    format: int32
                    type: integer
                  held:
                    description: |-
                      Held is the number of apps whose current Knative Service is held because
                      the platform config would make their effective spec invalid.
                    format: int32
                    type: integer
                  pending:
                    description: Pending is the number of apps still waiting to be
                      re-rendered (rate-limited).
                    format: int32
                    type: integer
                required:
                - applied
                - held
                - pending
                type: object
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'the KnextPlatform is a singleton: only an object named ''default''
            is honoured'
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
