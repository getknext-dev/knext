# knext day-2 alerting rules (observability P0).
#
# Wires the SLOs in docs/observability/slos.md to the series this codebase
# actually exports:
#   - operator:  knext_nextapp_reconcile_{total,errors_total,duration_seconds}
#                (packages/kn-next-operator/internal/controller/metrics.go)
#   - app:       knext_bunexec_{http_requests_total, http_request_duration_seconds,
#                http_inflight_requests, startup_duration_seconds,
#                process_uptime_seconds, process_resident_memory_bytes}
#                — rendered by the compiled runtime's :9464 endpoint
#                (packages/kn-next/templates/app/runtime-contract.mjs.hbs,
#                `renderMetrics`), which is what the shipped PodMonitor scrapes.
#                That same endpoint also forwards ONE app-registry family,
#                knext_deep_health_state (APP_METRIC_FAMILIES in the same file),
#                present only when tracing is enabled.
#   - condition: knext_nextapp_condition — a kube-state-metrics CRD metric
#                exposing the NextApp .status.conditions. The KSM
#                CustomResourceStateMetrics config now ships as an applyable
#                ConfigMap (kube-state-metrics-crd-config.yaml, in this overlay),
#                so KnextNextAppDegraded is live once this overlay is applied and
#                KSM is pointed at that ConfigMap (no longer inert). The alert
#                accepts either knext_nextapp_condition or the generic
#                kube_customresource fallback name.
#
# Validate locally with:  promtool check rules prometheusrule.yaml
# (extract .spec.groups first, or use kube-prometheus's rule unit harness).
#
# EVERY metric name below is pinned against a real emitter by
# packages/kn-next/src/__tests__/observability-metric-contract.test.ts. That
# gate exists because the failure mode here is SILENT: PromQL over a series
# nobody emits returns an empty vector, so `for:` is never satisfied and the
# alert simply never fires — no error, no red, nothing to notice. It is how the
# whole `knext.app` group sat dead after ADR-0048 moved the runtime to the
# compiled binary and the metric names stopped overlapping (#792). Adding a
# rule that queries a name the runtime does not render reds that test.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: knext-slo-alerts
  labels:
    app.kubernetes.io/name: kn-next-operator
    app.kubernetes.io/component: observability
    # Picked up by the kube-prometheus-stack ruleSelector by default.
    release: prometheus
spec:
  groups:
    - name: knext.operator
      rules:
        # SLO: reconcile-error rate. Any reconcile error is a control-plane
        # signal — the operator is the single source of truth (ADR-0001), so a
        # failing reconcile means cluster state may diverge from the NextApp CR.
        - alert: KnextOperatorReconcileErrors
          expr: increase(knext_nextapp_reconcile_errors_total[10m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "knext operator is failing NextApp reconciles"
            description: >-
              The operator recorded {{ $value }} reconcile error(s) in the last
              10m. Desired cluster state may not be applied.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/incident.md#scenario-4-rollback--bad-revision"

        # Image prewarm (opt-in cold-start optimisation) is failing to reconcile
        # its DaemonSet — almost always missing DaemonSet RBAC after an operator
        # upgrade. Deliberately WARNING, not critical: this failure no longer
        # fails the NextApp reconcile pass, the app stays Ready and keeps
        # serving, and the only consequence is that cold starts pay the image
        # pull again. It gets its OWN series precisely because it no longer
        # trips KnextOperatorReconcileErrors above — without this rule the
        # decoupling would have traded a false-critical for a silent failure.
        - alert: KnextImagePrewarmFailing
          expr: increase(knext_nextapp_image_prewarm_errors_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "knext image prewarm is failing to reconcile"
            description: >-
              The operator failed {{ $value }} image-prewarm DaemonSet
              reconcile(s) in the last 15m. Affected apps stay Ready but their
              ImageCacheReady condition is False and cold starts pay the image
              pull. Most likely the operator's ClusterRole is missing
              daemonsets create/update/delete.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/troubleshooting.md"

        # SLO: reconcile latency. A slow control loop delays scale-up and
        # rollbacks. p95 over 30s sustained is degraded.
        - alert: KnextOperatorReconcileSlow
          expr: >-
            histogram_quantile(0.95,
              sum(rate(knext_nextapp_reconcile_duration_seconds_bucket[10m])) by (le)
            ) > 30
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "knext reconcile p95 latency is high"
            description: "Reconcile p95 is {{ $value | humanizeDuration }} (>30s)."
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/incident.md#scenario-1-scale-to-zero-stuck"

    - name: knext.nextapp
      rules:
        # NextApp Degraded=True — the reconciler now populates status.conditions
        # (Ready / Degraded). kube-state-metrics exposes them as
        # knext_nextapp_condition{type="Degraded",status="True"}.
        - alert: KnextNextAppDegraded
          expr: >-
            max by (namespace, name) (
              knext_nextapp_condition{type="Degraded",status="True"}
            ) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NextApp {{ $labels.namespace }}/{{ $labels.name }} is Degraded"
            description: >-
              The NextApp reports Degraded=True. The operator could not bring the
              Knative Service to the desired revision/traffic state.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/incident.md#scenario-4-rollback--bad-revision"

    # ── The guard goes in BEFORE the things it guards ──────────────────────
    #
    # #792's lesson, applied here rather than re-learned: a dashboard that goes
    # blank and an alert that stops firing look EXACTLY like a healthy, quiet
    # system. Nothing pages, nothing reds, and the gap is discovered only when
    # someone eventually goes looking — five weeks later, in the original case.
    #
    # So the first rules in this file are the ones that alert on knext's own
    # blindness. Everything below them assumes app series exist; these two are
    # what notice when they do not. Mirrors the KubeStateMetricsDown self-guard
    # in packages/scale-zero-pg/deploy/60-prometheus.yaml, which is the same
    # pattern applied to the same class of failure.
    #
    # Scale-to-zero makes the naive form wrong, and that is worth stating: a
    # scaled-to-zero app has NO pods, so it exports no series and its targets
    # vanish entirely. A bare `absent(knext_bunexec_...)` would therefore fire
    # on every idle app, every night, and be muted within a week. Both rules
    # below are instead keyed on a target that EXISTS — `up` is only present for
    # a discovered target — so an app at zero is silent by construction.
    - name: knext.app.staleness
      rules:
        # (1) The target is discovered but cannot be scraped: wrong port, the
        # :9464 listener never bound, a NetworkPolicy in the way. The app may
        # still be serving traffic perfectly — which is the point, because every
        # other app alert in this file is blind while this is true.
        - alert: KnextAppMetricsTargetDown
          expr: up{job="knext-nextapp"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "knext app metrics target {{ $labels.namespace }}/{{ $labels.pod }} is not scrapeable"
            description: >-
              Prometheus has discovered this app pod but the :9464 /metrics
              scrape has failed for 10m. Every knext.app alert is blind for this
              app until it recovers. Check that the runtime bound its metrics
              listener (the pod logs `LISTENING:<port> METRICS:<port>` at
              startup) and that a NetworkPolicy is not blocking 9464.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/troubleshooting.md"

        # (2) THE #792 SHAPE ITSELF, and the reason this group exists. The
        # scrape SUCCEEDS — `up == 1`, the endpoint answers 200 — and returns
        # nothing this file recognises. That is what a metric RENAME looks like
        # from Prometheus' side: perfectly healthy plumbing carrying series no
        # query names. Nothing else in this repo can see it.
        #
        # `unless on(namespace, pod)` is the whole rule: a scraped pod that does
        # not export the runtime's most basic gauge is either not a knext
        # runtime or is exporting under names these rules do not know.
        - alert: KnextAppMetricsContractBroken
          expr: >-
            (up{job="knext-nextapp"} == 1)
              unless on (namespace, pod) knext_bunexec_process_uptime_seconds
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "knext app pod {{ $labels.namespace }}/{{ $labels.pod }} scrapes OK but exports no knext series"
            description: >-
              The :9464 endpoint is answering, but it is not exporting
              knext_bunexec_process_uptime_seconds. The metric contract has
              drifted: every dashboard panel and every knext.app alert for this
              app is silently empty. Compare the pod's live /metrics output
              against renderMetrics() in runtime-contract.mjs.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/troubleshooting.md"

    - name: knext.app
      rules:
        # SLO: cold start. knext_bunexec_startup_duration_seconds is set ONCE
        # per process, at the moment both listeners bind, from process.uptime()
        # — so it covers the Bun bootstrap and every module evaluation a waking
        # pod pays for. One sample per pod means the fleet distribution is
        # already the gauge itself; `max by (app)` is the right aggregation, and
        # `histogram_quantile` would need 13 series to hold one observation.
        #
        # (Was `histogram_quantile(0.95, kn_next_startup_duration_seconds_bucket
        # {cache_status="cold"})` — a prom-client histogram from the retired
        # node-server path, with a warm/cold split that only meant anything when
        # the runtime used NODE_COMPILE_CACHE. The compiled binary has no such
        # split: every start is a cold start.)
        - alert: KnextColdStartLatencyHigh
          expr: max by (app) (knext_bunexec_startup_duration_seconds) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "knext cold-start latency is high for {{ $labels.app }}"
            description: >-
              Slowest observed cold start is {{ $value | humanizeDuration }}
              (>3s SLO). Cold starts dominate when the app scales from zero.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/incident.md#scenario-2-cold-start-latency-spike"

        # Availability SLI: server-side 5xx ratio. Computable at all only
        # because the runtime's request counter now carries `status_class` —
        # before that the binary emitted ONE unlabelled counter and an error
        # rate could not be expressed, which is a capability gap, not a naming
        # one. Five label values, fixed; see the cardinality note in
        # runtime-contract.mjs.
        - alert: KnextHighErrorRate
          expr: >-
            sum(rate(knext_bunexec_http_requests_total{status_class="5xx"}[5m])) by (app)
              /
            clamp_min(sum(rate(knext_bunexec_http_requests_total[5m])) by (app), 0.001)
              > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "knext app {{ $labels.app }} 5xx ratio above 5%"
            description: >-
              Server-side error ratio is {{ $value | humanizePercentage }} over
              5m. This is also the signal for an unreachable backing dependency
              (Redis ISR cache, Postgres): a deep-health route failing its
              checks returns 5xx and lands here.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/incident.md#scenario-3-rediscache-down"

        # Latency SLI. The duration histogram is new with the status_class work
        # — the runtime previously emitted no duration series at all, so no
        # latency SLO was computable. Buckets are tuned sub-100ms (the measured
        # cold-start floor is tens of ms), so a p95 here is a real number rather
        # than an interpolation across one enormous first bucket.
        - alert: KnextHighRequestLatency
          expr: >-
            histogram_quantile(0.95,
              sum(rate(knext_bunexec_http_request_duration_seconds_bucket[5m])) by (le, app)
            ) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "knext app {{ $labels.app }} request p95 latency is high"
            description: "Request p95 is {{ $value | humanizeDuration }} (>1s)."
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/incident.md#scenario-2-cold-start-latency-spike"

        # RETIRED HERE, DELIBERATELY — do not re-add without the label it needs.
        #
        # `KnextCacheUnreachable` filtered on `route="/api/health"`. A route
        # label is unbounded by construction (one crawler mints a series per
        # URL), so the runtime does not emit one and will not until there is an
        # explicit bounded route allowlist. Its concept — a backing dependency
        # is down — is covered by KnextHighErrorRate above, since a failing deep
        # health check returns 5xx.
        #
        # DEEP-HEALTH ALERTS (below) are live in THIS group because the runtime
        # contract forwards exactly one app-registry family onto :9464 —
        # `knext_deep_health_state` (APP_METRIC_FAMILIES in runtime-contract.mjs).
        # They used to sit in an opt-in `knext.app.node-legacy` group because the
        # gauge was served on a loopback port the PodMonitor does not scrape.
        # The condition that remains: the gauge is registered only when tracing
        # is enabled (`spec.observability.tracing.enabled`), because registering
        # it unconditionally would cost every cold start the ~0.9 s that gate
        # saves. With tracing off there is no series and these two rules stay
        # silent. That is a limit of the registration, not a scrape gap, and the
        # reachability scan (alert-reachability.test.ts) deliberately does not
        # pretend otherwise: it proves the PORT, not the registration.
        # A dead dependency is also visible through KnextHighErrorRate, whose
        # deep-health route returns 5xx while it is failing.
        #
        # Also: only an app that has used its database recently is probed (so an
        # idle scale-to-zero database is never woken by the scrape), and an app
        # at zero has no pod and therefore no series.

        # #348: SUSTAINED deep-health `waking` = a permanent connection-level DB
        # outage of the scale-to-zero database. checkDeepHealth
        # (packages/lib/src/health/index.ts) classifies a refused connection
        # (ECONNREFUSED) as `waking` ONLY when DATABASE_URL points at the
        # scale-zero-pg gateway host — CORRECT for a normal scale-to-zero wake,
        # which is brief (~2-6s). A connect timeout or a dropped connection
        # reads `waking` on any host. But a GENUINELY-down scale-to-zero DB
        # presents the SAME connection-level signature, so it sits at `waking`
        # FOREVER and never becomes `down`. Alerts keyed on `down`/503 alone
        # therefore never fire on it. A refused connection to any OTHER host
        # (bring-your-own Postgres) reads `down` straight away and is alerted on
        # by KnextDeepHealthDown below. This
        # rule closes the waking gap: the deep-health state gauge reporting
        # overall waking=1 for LONGER than the wake budget is a stuck-waking
        # real outage. `for: 2m` is far above the legitimate 2-6s wake, so a normal
        # wake never pages.
        - alert: KnextDeepHealthStuckWaking
          expr: >-
            max by (app) (
              knext_deep_health_state{dependency="overall",state="waking"}
            ) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "knext app {{ $labels.app }} deep health stuck WAKING (DB outage?)"
            description: >-
              The deep health check has reported `waking` for over 2m — far
              longer than a legitimate 2-6s scale-to-zero wake. A permanent
              connection-level outage of the scale-to-zero database (host gone,
              dead DNS, bad DATABASE_URL) presents as connection-level errors
              and sits at `waking` forever, never `down`. Check the
              scale-zero-pg gateway / compute and the app's DATABASE_URL.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/troubleshooting.md#deep-health-stuck-waking-permanent-db-outage"
        # Sustained deep-health `down`: the database is unreachable and nothing
        # is waking it (a refused/timed-out connection to a bring-your-own
        # Postgres, or a reachable database that errors on the probe query).
        # Same gauge and labels as the waking rule; `for: 2m` matches it so a
        # transient blip does not page.
        - alert: KnextDeepHealthDown
          expr: >-
            max by (app) (
              knext_deep_health_state{dependency="overall",state="down"}
            ) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "knext app {{ $labels.app }} deep health DOWN (DB unreachable or erroring)"
            description: >-
              The deep health check has reported `down` for over 2m. Either the
              database refused the connection and is not a scale-to-zero
              database that could be waking (bring-your-own
              Postgres, a custom APPDB_GATEWAY_HOST, or a pooler in front of the
              scale-to-zero database), or it is reachable but erroring on the
              probe query. Check the database and the app's DATABASE_URL.
            runbook_url: "https://github.com/getknext-dev/knext/blob/main/docs/runbooks/troubleshooting.md#deep-health-down-database-unreachable-or-erroring"
