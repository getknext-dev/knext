# AppDatabase CRD — the v1.0 declarative provisioning interface (ADR-0004, #96).
#
# OWNER-RATIFIED 2026-07-04: BUILD the operator. An AppDatabase custom resource is
# the source of truth for one branch-per-app database (ADR-0003); the appdb-operator
# (deploy/83-appdb-operator.yaml) reconciles reality to match it — branch the shared
# `apps` template timeline, render the per-app compute (Deployment + Service +
# ConfigMap), mint the per-app credential Secret, and wire the apps-gateway routing.
# This REIMPLEMENTS the proven imperative logic of deploy/provision-app.sh in Go; the
# script remains as a break-glass / CI tool. See docs/adr-0004-provisioning-bless-or-build.md.
#
# Lifecycle: `kubectl apply` an AppDatabase -> operator provisions (phase Ready);
# `kubectl delete appdatabase <name>` -> finalizer runs safe deprovision (two-sided
# timeline delete on the pageserver + all safekeepers, unless keepTimelineOnDelete)
# before the object is removed. Continuous reconciliation heals drift (a hand-deleted
# Deployment is re-created; a missing branch is re-branched).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appdatabases.apps.scale-zero-pg.dev
  labels: { tier: apps, plane: control }
spec:
  group: apps.scale-zero-pg.dev
  scope: Namespaced
  names:
    kind: AppDatabase
    listKind: AppDatabaseList
    plural: appdatabases
    singular: appdatabase
    shortNames: [appdb]
    categories: [all]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - { name: App, type: string, jsonPath: .spec.appName }
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: Secret, type: string, jsonPath: .status.secretName }
        - { name: Timeline, type: string, jsonPath: .status.timelineId }
        - { name: Compute, type: boolean, jsonPath: .status.computeReady }
        - { name: Tier, type: string, jsonPath: .spec.tier }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [appName]
              properties:
                appName:
                  type: string
                  description: >-
                    RFC1123 DNS label; the DSN database name and the suffix of
                    compute-<app>. Immutable after creation (a rename is a
                    new app). Reserved names (tmpl/warm/ro) are rejected.
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                  maxLength: 63
                tier:
                  type: string
                  description: >-
                    cold = scale-to-zero at rest, the gateway wakes the compute on connect.
                    warm = the operator holds one authenticated gateway connection permanently
                    so the compute never idles to zero (a permanent warm hold, equivalent to a
                    24/7 warmSchedule window; it takes precedence over warmSchedule). NOT a
                    replica floor - the operator writes replicas 0 for both tiers; the gateway
                    is the single writer of replica counts. See docs/appdatabase-api.md section 2a.
                  enum: [cold, warm]
                  default: cold
                quotas:
                  type: object
                  description: Per-app noisy-neighbour bound (issue #89). Limits cap; requests default.
                  properties:
                    cpu:
                      type: string
                      description: CPU limit (e.g. "1000m"). Caps a hostile CPU burn to its allotment.
                      default: "1000m"
                    cpuRequest:
                      type: string
                      description: CPU request (scheduling floor).
                      default: "250m"
                    mem:
                      type: string
                      description: Memory limit (OOM bound, e.g. "1Gi").
                      default: "1Gi"
                    memRequest:
                      type: string
                      description: Memory request (scheduling floor).
                      default: "256Mi"
                    maxConnections:
                      type: integer
                      description: Postgres max_connections for this app's compute.
                      default: 100
                      minimum: 1
                  default: {}
                roPool:
                  type: object
                  description: >-
                    Read-replica pool (read-scaling axis). When enabled, the operator
                    emits a DATABASE_URL_RO key into the output Secret (the stable
                    external-driver contract knext maps from NextApp.spec.database.
                    readReplicas). The per-app RO SERVING endpoint (apps-gateway RO
                    listener + per-app RO computes) is a tracked read-scaling/gateway
                    follow-up — see docs/appdatabase-api.md and docs/operations.md.
                  properties:
                    enabled: { type: boolean, default: false }
                    minReplicas: { type: integer, default: 0, minimum: 0 }
                    maxReplicas: { type: integer, default: 3, minimum: 0 }
                  default: {}
                keepTimelineOnDelete:
                  type: boolean
                  description: >-
                    When true, `kubectl delete` removes the k8s objects but RETAINS the
                    Neon timeline (PITR/forensics) as an orphan — reclaim it later with
                    `provision-app.sh reclaim-orphans`. Default false = safe two-sided
                    timeline delete (no orphan branch, no unbounded safekeeper WAL).
                  default: false
                idleDelay:
                  type: string
                  description: >-
                    Per-app override of the fleet-default idle window (GW_IDLE_MS) after
                    which the apps-gateway parks this app's compute at zero. A Go duration
                    string, e.g. "5m". The operator stamps it as the compute Deployment
                    annotation apps.kn-next.dev/idle-delay-ms (integer milliseconds) — the
                    gateway reads it at idle-arm time and uses it in place of GW_IDLE_MS
                    for this app only. nil or "0s" = the fleet default (no per-app
                    override; additive back-compat). Negative is rejected; capped at 6h
                    (a longer idle window is an always-warm intent — use tier: warm or
                    alwaysWarm). There is no admission webhook on this CRD, so a bad value
                    is surfaced as an InvalidIdleDelay Warning event + Failed phase, never
                    silently applied. Use it to align the DB idle window with the app's
                    own warm window without raising the cheap 60s fleet default for every
                    app. See docs/appdatabase-api.md.
                  pattern: '^([0-9]+(ns|us|µs|ms|s|m|h))+$'
                alwaysWarm:
                  type: boolean
                  description: >-
                    Additive alias over spec.tier: warm. true = the operator holds one
                    authenticated gateway connection so the compute never idles to zero,
                    byte-identically to tier: warm (same held-connection warmhold, no new
                    machinery, no replica floor — a Neon compute is single-writer). It is
                    OR'd with tier and warmSchedule, so alwaysWarm: false is NOT a
                    kill-switch for tier: warm — both are just ways to ask for the same
                    hold. Cost = one compute always up. See docs/appdatabase-api.md.
                  default: false
                warmSchedule:
                  type: array
                  description: >-
                    Scheduled DB warm windows (knext #388, ADR-0030 addendum). While
                    any window is active the appdb operator holds ONE authenticated
                    connection through the apps-gateway so this app's compute never
                    goes idle — the first query in the window pays no compute wake
                    and no cold-auth. Declare the SAME windows as the knext NextApp's
                    spec.scaling.warmSchedule (same 5-field cron semantics, same
                    timezone handling) and the app pod floor + this DB hold flip
                    together (this side within one operator resync, default 15s, of a
                    boundary). Outside every window the hold is released and the
                    compute sleeps at zero as usual. No `replicas` field: a Neon
                    compute is single-writer, so warm means exactly one compute held
                    awake. There is no admission webhook on this CRD — a malformed
                    cron/timezone is surfaced by the operator as an
                    InvalidWarmWindow Warning event + the WarmHold status condition,
                    never silently skipped. Empty/absent = cold scale-to-zero as
                    before (byte-identical back-compat).
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        minLength: 1
                        description: >-
                          5-field cron (minute hour day month weekday) at which the
                          DB warm hold engages, e.g. "0 8 * * 1-5" = 08:00 weekdays.
                      end:
                        type: string
                        minLength: 1
                        description: >-
                          5-field cron at which the warm hold is released (the
                          gateway then parks the compute on its ordinary idle window).
                      timezone:
                        type: string
                        description: >-
                          IANA timezone the crons are evaluated in (e.g.
                          "America/New_York"). Defaults to UTC.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Provisioning | Ready | Failed | Deleting
                  enum: [Provisioning, Ready, Failed, Deleting]
                secretName:
                  type: string
                  description: >-
                    The output credential Secret an external driver reads/mirrors
                    (app-db-<appName>): keys PGUSER, PGPASSWORD, APP_ROLE_VERIFIER,
                    DATABASE_URL, and DATABASE_URL_RO (only when spec.roPool.enabled).
                    Part of the external-driver contract — see docs/appdatabase-api.md.
                timelineId:
                  type: string
                  description: The app's Neon timeline id (the durable owner of record). Minted once, fresh per lifecycle.
                ancestorLsn:
                  type: string
                  description: >-
                    The template last_record_lsn this app branched from (its ancestor
                    point). Compared against the template's remote_consistent_lsn to
                    decide the ColdRestorable condition (docs/runbook-dr.md §9d-bis).
                computeReady:
                  type: boolean
                  description: >-
                    DIAGNOSTIC ONLY (#777): true iff the app's compute Deployment has
                    >=1 available replica right now. It is NOT a readiness gate for
                    either tier — serving readiness is the Ready condition, because the
                    wake path is the same for cold and warm (the apps-gateway wakes the
                    compute 0->1 on connect). A perfectly healthy cold app reads false
                    at rest; a warm app reads false in the moment between the gateway
                    parking the compute and the operator's hold re-establishing it.
                    Printed as the "Compute" column, deliberately not "Ready".
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
