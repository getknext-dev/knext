# Object storage: bottomless history + basis for branching/PITR.
#
# OPTIONAL — this MinIO is the LOCAL-DEV / ON-PREM DEFAULT, not a hard dependency
# (#105). The pageserver + safekeepers speak the S3 API and read their endpoint
# from the `storage-objstore` ConfigMap (deploy/gen-secrets.sh). To run against an
# EXTERNAL object store (managed cloud S3 or a self-hosted alternative), point
# storage-objstore at it and DO NOT apply this file — see docs/operations.md
# "Object-storage backend" and deploy/_verify-objstore.sh. Bucket creation lives
# in 55-storage-init.yaml so it works against whatever endpoint is configured
# (this file no longer creates the bucket).
#
# WHY OPTIONAL MATTERS: MinIO archived its community repos, so a platform whose
# goal is "easy to host anywhere" must not be married to it. Maintained on-prem
# S3 alternatives that speak the same API (all path-style, SigV4): SeaweedFS,
# Ceph RADOS Gateway, and Garage. On a managed cluster, prefer the cloud's native
# object store (e.g. OCI Object Storage's S3 Compatibility API — proven in
# deploy/_verify-objstore.sh).
#
# IMAGE IS DIGEST-PINNED: MinIO's community project is archived, so we pin an
# immutable sha256 — a moved/retagged upstream can never change what we pull.
#
# #1423 (FIXED): quay.io/minio/minio's RELEASE.2022-10-20 build became
# UNPULLABLE — quay.io now UNAUTHORIZES every anonymous pull, repo-wide,
# verified with `crane manifest` against several tags including that exact
# "last-good" pin, not a transient flake. Repinned to
# docker.io/bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
# (Bitnami's post-license-change "legacy" free mirror — unmaintained but genuine
# MinIO, proven S3-API-compatible; the same digest every throwaway MinIO
# consumer in this repo already uses, #1403). Bitnami's image runs as non-root
# UID 1001 by default (`crane config` confirms `User: "1001"`), but the bound
# PVC's existing data is root-owned from years running as root — so a
# `fix-data-ownership` initContainer chowns the volume to 1001:1001 as root
# (CAP_CHOWN only, everything else dropped) BEFORE the main container starts as
# non-root. This file's own comment above already argues for migrating off
# MinIO entirely (SeaweedFS/Ceph RGW/Garage) — the archival is a live argument
# for prioritizing that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: scale-zero-pg
  labels: { app: minio, plane: storage }
spec:
  replicas: 1
  revisionHistoryLimit: 2 # cap ReplicaSet churn
  selector: { matchLabels: { app: minio } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: minio, plane: storage }
    spec:
      # Bitnami's minio image runs as non-root UID 1001 by default (#1423); the
      # fix-data-ownership initContainer below chowns the PVC to 1001:1001 as
      # root FIRST, so the main container can safely run non-root here.
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # One-shot, as root: the bound PVC's data predates this image swap and
        # is root-owned (years running the old root-default quay.io image).
        # `chown -R` is idempotent — a no-op on a PVC already owned by 1001.
        # CAP_CHOWN/CAP_FOWNER only (everything else dropped): the minimum a
        # non-uid-0-owning chown as root actually needs, not full root.
        - name: fix-data-ownership
          image: docker.io/bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c # same pin as the main container (#1423)
          command: ["/bin/sh", "-c", "chown -R 1001:1001 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN", "FOWNER"] }
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: minio
          image: docker.io/bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c # digest-pinned (#1423; upstream quay.io/minio/minio archived + unpullable)
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          # Root identity from the storage-s3-creds Secret (deploy/gen-secrets.sh),
          # never plaintext YAML. Same creds double as the S3 key for the storage
          # plane. Rotating requires MinIO's root-rotation flow — see gen-secrets.sh.
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: storage-s3-creds, key: user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: storage-s3-creds, key: password } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001 # Bitnami's default minio user (#1423); the PVC is chowned to it above
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 2
          # Liveness: /minio/health/live flips only on a wedged server.
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 256Mi, ephemeral-storage: 100Mi }
            # 512Mi: 256Mi OOMKilled 12x under a legitimate full-bucket backup
            # mirror (observed live at ~18GB). The durability tier must survive
            # its own backup traffic.
            limits: { memory: 512Mi, ephemeral-storage: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: scale-zero-pg
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: scale-zero-pg
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
# NOTE (#105): bucket creation used to live here (minio-create-buckets Job). It
# has moved to 55-storage-init.yaml's ensure-bucket initContainer so the bucket
# is created on the CONFIGURED endpoint (MinIO or external S3), not minio-only.
