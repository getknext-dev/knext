# Standing warm-Secondary pageserver + the generation ledger the failover
# watcher advances. This is the durable half of issue #3: a second pageserver
# (distinct identity id, SAME bucket + broker) that holds a warm Secondary
# location for the SAME tenant storage-init created on the primary — it
# pre-downloads layers from MinIO without serving, so a promotion is a
# generation+1 re-attach, not a cold restore.
#
# Topology (the watcher — 58 — drives the flip):
#   Service pageserver          (from 53) — the CLIENT handle the compute
#     resolves (host=pageserver). Selector app:pageserver at rest; the watcher
#     FLIPS it to app:pageserver-standby on failover.
#   Service pageserver-primary  — STABLE handle to the primary STS, unaffected
#     by the flip; the watcher probes THIS for primary liveness.
#   Service pageserver-standby  — handle to the standby STS; the watcher PUTs
#     the promotion here and flips the client Service TO its selector.
---
# Stable liveness handle for the primary STS (never flipped). The watcher probes
# :9898/v1/status here so it detects the PRIMARY's death, not the client
# Service's current target.
apiVersion: v1
kind: Service
metadata:
  name: pageserver-primary
  namespace: scale-zero-pg
  labels: { app: pageserver, plane: storage }
spec:
  selector: { app: pageserver }
  ports:
    - { name: pg, port: 6400, targetPort: pg }
    - { name: http, port: 9898, targetPort: http }
---
# Generation ledger: the DURABLE record of the generation the tenant is attached at,
# and the AUTHORITY the bootstrap attach paths read (#1095). Each auto-failover reads
# it, promotes at value+1, and writes value+1 back (pswatcher, merge-patch); the
# storage-init Job and provision-app.sh READ it and attach at
# max(ledger, pageserver-view, 1) — never below it. Persisting it here survives a
# watcher/pageserver restart or a fresh pageserver PVC.
#
# The `generation` key is DELIBERATELY NOT DECLARED here (`data: {}`) and is instead
# seeded CREATE-IF-ABSENT by deploy/seed-ledger.sh (run by `make deploy` after apply).
# WHY, proven on kind: a declared `generation: "1"` is NOT `kubectl apply`-safe — a
# re-apply RESETS the live key back to the declared value even when pswatcher had
# advanced it (client-side apply reconciles a declared field to its manifest value:
# live 5 -> apply -> 1), and a reset "1" is byte-identical to a genesis "1", so the
# fail-closed readers cannot tell it apart and would silently attach low. With the key
# UNDECLARED, apply never resets it and never prunes it (verified: apply data:{} ->
# patch 5 -> re-apply data:{} leaves it 5), so pswatcher's value and the create-if-
# absent seed both survive every future `kubectl apply -f deploy/`. This CM object must
# still exist (pswatcher's merge-patch requires it), hence `data: {}` rather than
# omitting the ConfigMap.
#
# One-time migration: an install created by a PRE-#1095 deploy carried
# `generation: "1"` in last-applied-configuration; the first apply of THIS file prunes
# that key. The upgrade runbook (docs/operations.md) re-seeds/verifies the ledger to
# the live generation before any attach. The robust self-heal (pswatcher re-seeding
# from the pageserver's current max at startup) is owned by the pswatcher +
# ledger-authority work, not this change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pageserver-generation
  namespace: scale-zero-pg
  labels: { plane: storage }
data: {}
---
# Standby config: identical to the primary's (same broker + bucket) EXCEPT a
# distinct node identity (id=1235 vs the primary's 1234) — two pageservers must
# never share an id.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pageserver-standby-config
  namespace: scale-zero-pg
data:
  # remote_storage is appended by the seed-config init container from the
  # storage-objstore ConfigMap (#105) — SAME bucket/endpoint as the primary
  # (the standby must read the identical object store to hold warm layers).
  pageserver.toml: |
    broker_endpoint='http://storage-broker:50051'
    pg_distrib_dir='/usr/local/'
    listen_pg_addr='0.0.0.0:6400'
    listen_http_addr='0.0.0.0:9898'
    control_plane_api='http://0.0.0.0:6666' # no storage controller in the MVP; junk address
    control_plane_emergency_mode=true
    virtual_file_io_mode="buffered"
  identity.toml: |
    id=1235
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pageserver-standby
  namespace: scale-zero-pg
  labels: { app: pageserver-standby, plane: storage }
spec:
  serviceName: pageserver-standby
  replicas: 1
  revisionHistoryLimit: 2
  selector: { matchLabels: { app: pageserver-standby } }
  template:
    metadata:
      labels: { app: pageserver-standby, plane: storage }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: seed-config
          image: neondatabase/neon:8464
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # Object-store endpoint/bucket/region are env-driven (#105), same as the
          # primary; cp first, then append exactly one remote_storage line.
          envFrom:
            - configMapRef: { name: storage-objstore } # OBJSTORE_ENDPOINT / _BUCKET / _REGION
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /data/.neon
              cp /config/pageserver.toml /config/identity.toml /data/.neon/
              printf "remote_storage={ endpoint='%s', bucket_name='%s', bucket_region='%s', prefix_in_bucket='/pageserver' }\n" \
                "$OBJSTORE_ENDPOINT" "$OBJSTORE_BUCKET" "$OBJSTORE_REGION" >> /data/.neon/pageserver.toml
              echo "standby pageserver.toml object-store target: endpoint=$OBJSTORE_ENDPOINT bucket=$OBJSTORE_BUCKET region=$OBJSTORE_REGION"
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
      containers:
        - name: pageserver
          image: neondatabase/neon:8464
          command: ["/usr/local/bin/pageserver", "-D", "/data/.neon"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: storage-s3-creds, key: user } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: storage-s3-creds, key: password } }
          ports:
            - { name: pg, containerPort: 6400 }
            - { name: http, containerPort: 9898 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /v1/status, port: http }
            periodSeconds: 2
          # A hung standby is a dead standby — restart it so the warm layers
          # keep tracking the bucket (mirrors the primary's liveness stance).
          livenessProbe:
            httpGet: { path: /v1/status, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 100Mi }
            limits: { memory: 1Gi, ephemeral-storage: 1Gi }
      volumes:
        - name: config
          configMap: { name: pageserver-standby-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: pageserver-standby
  namespace: scale-zero-pg
spec:
  selector: { app: pageserver-standby }
  ports:
    - { name: pg, port: 6400, targetPort: pg }
    - { name: http, port: 9898, targetPort: http }
---
# One-shot Job that registers the standby as a WARM Secondary for the live
# tenant (mode:"Secondary", secondary_conf.warm:true) and kicks a first layer
# download. Idempotent: re-running just re-asserts the location. Runs on the
# neon image (ships curl); fixed IDs => no jq. It intentionally does NOT attach
# the tenant — only the watcher promotes, at generation+1.
apiVersion: batch/v1
kind: Job
metadata:
  name: pageserver-standby-init
  namespace: scale-zero-pg
  labels: { app: pageserver-standby-init, plane: storage }
spec:
  backoffLimit: 30
  template:
    metadata:
      labels: { app: pageserver-standby-init, plane: storage }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: neondatabase/neon:8464
          envFrom:
            - configMapRef: { name: compute-config } # TENANT_ID, TIMELINE_ID, PG_VERSION, PAGESERVER_HOST
          env:
            # The apps tenant: every per-app AppDatabase is a timeline under it, and
            # the failover watcher promotes it too (promotion scope == routing scope,
            # #1098). Register it as a warm Secondary so a promotion is a warm re-attach
            # rather than a cold object-store fetch. Best-effort: on a base-only plane
            # the apps tenant may not exist yet, so a failure here must NOT fail the Job.
            # Kept in lock-step with deploy/83 APPDB_TENANT_ID / 58 PSW_APPS_TENANT_ID.
            - { name: APPS_TENANT_ID, value: "a0000000000000000000000000000001" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              SB="http://pageserver-standby:9898"
              echo "waiting for standby HTTP at ${SB} ..."
              until curl -sf "${SB}/v1/tenant" >/dev/null 2>&1; do sleep 2; done
              # $1 = tenant id; register warm Secondary + kick a download.
              # The REGISTRATION decides the return code. The download kick is advisory
              # (it can legitimately fail on a cold bucket) so it is swallowed — but it
              # must NOT become the function's exit status, or `warm_secondary X || …`
              # is unreachable and a failed registration is silent at deploy time.
              warm_secondary() {
                if ! curl -sf -X PUT -H 'Content-Type: application/json' \
                  -d '{"mode":"Secondary","secondary_conf":{"warm":true},"tenant_conf":{}}' \
                  "${SB}/v1/tenant/$1/location_config" >/dev/null; then
                  return 1
                fi
                curl -sf -X POST "${SB}/v1/tenant/$1/secondary/download" >/dev/null 2>&1 || true
                return 0
              }
              echo "registering warm Secondary for BASE tenant ${TENANT_ID} on the standby"
              warm_secondary "${TENANT_ID}"
              # Apps tenant: the Job does not FAIL on it (a base-only plane legitimately
              # has no apps tenant yet), but the failure is LOUD and actionable — an
              # apps tenant that is provisioned but not warmed here 404s on the standby
              # at promotion time, and the watcher then ABORTS the failover rather than
              # stranding its per-app timelines. Re-run this Job after provisioning the
              # first app. (The `|| echo` branch is reachable only because
              # warm_secondary returns the REGISTRATION status; see above.)
              if [ -n "${APPS_TENANT_ID:-}" ]; then
                echo "registering warm Secondary for APPS tenant ${APPS_TENANT_ID}"
                warm_secondary "${APPS_TENANT_ID}" \
                  || echo "WARNING: apps tenant ${APPS_TENANT_ID} could NOT be registered as a warm Secondary (likely unprovisioned). If apps exist, automatic failover will ABORT until this Job is re-run — see docs/operations.md#pageserver-failover"
              fi
              echo "standby warm-Secondary registration done"
